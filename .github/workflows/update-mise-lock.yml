name: Refresh Mise lock

on:
  schedule:
    # Stagger this from the broader scheduled CI and schema refresh jobs.
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    name: Refresh Dotfiles Mise lock
    permissions:
      contents: write
      pull-requests: write
    uses: cgraf78/actions/.github/workflows/mise-lock-refresh.yml@dc7be3dcf6da264083f229d78818c2ad087a3d34
    with:
      project_name: Dotfiles
      mise_config_file: .config/mise/config.toml
      mise_lock_file: .config/mise/mise.lock
    secrets:
      # This existing key is scoped to this repository and already provides
      # real synchronize events for protected automation pull requests.
      deploy_key: ${{ secrets.DOTFILES_SCHEMA_REFRESH_DEPLOY_KEY }}
