name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@7cc897229a80517e83f09acf989f2da5889961ad
    with:
      # This repository owns only base and profile/control-plane tests. The
      # public capability repositories run their own focused suites, so this
      # job installs only the prerequisites for the base/control-plane client.
      setup: none
      # The profile fixtures do not run Shdeps; give them the same build
      # that the main suite installs through Shdeps in the candidate home.
      profiles: base,jq,python,zsh,lua,tmux-pinned,openssh-netcat-lsof,procps,cron,fd,ripgrep,hostname,shellcheck
      matrix-set: full
      shellcheck-exclude-codes: SC1091
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: |-
        set -euo pipefail
        : "${CI_TMUX_PINNED_RELEASE:?missing tmux-pinned release}" \
          "${CI_TMUX_PINNED_VERSION:?missing tmux-pinned version}" \
          "${CI_TMUX_PINNED_BIN:?missing tmux-pinned executable}"
        export DOTFILES_CANDIDATE_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
        # A suite that would skip its real-tmux coverage fails instead.
        export DOT_TEST_REQUIRE_TMUX=1
        # Exercise relative fixture entry points with a caller's CDPATH set.
        CDPATH=. .local/lib/dotfiles/tests/checkout-ci-candidate
        # Post-cutover the engine ships only as a native binary and the matrix
        # images carry no Rust toolchain: resolve the control-plane runtime
        # from the latest published release instead of a source checkout.
        # Resolve once here, after the candidate checkout, so every
        # stack-dot-runtime group in this leg tests the same frozen tag.
        # (The live suite resolves its own tag by design; see
        # dot-release-live-test.) The fleet consumes latest through shdeps,
        # so CI validates what the fleet installs with no manual pin to bump.
        . .local/lib/dotfiles/tests/dot-runtime-resolve.sh
        # Declare and export separately: `export VAR=$(...)` would mask a
        # resolution failure and silently fall back to the git path below.
        dot_release_tag="$(_dot_release_latest_tag cgraf78/dot)"
        export DOT_STACK_DOT_RELEASE_TAG=$dot_release_tag
        # with-relay-deps installs the base manifest's tmux, Termnav, and
        # tmux-tools through Shdeps. This exercises the installed stack in
        # tmux-test's nested relay and prefix C-a PTY cases.
        .local/lib/dotfiles/tests/stack-dot-runtime control-plane-run-ci -- \
          .local/lib/dotfiles/tests/run-ci-candidate-home \
            .local/lib/dotfiles/tests/with-relay-deps \
              .local/lib/dotfiles/tests/run-ci
        if [[ ${RUNNER_OS:-} == Linux ]]; then
          for mode in update doctor; do
            case "$mode" in
              update) group=profile-fixture-update ;;
              doctor) group=profile-doctor ;;
            esac
            .local/lib/dotfiles/tests/stack-dot-runtime "$group" -- \
              .local/lib/dotfiles/tests/run-ci-candidate-home \
                .local/lib/dotfiles/tests/profile-fixture-integration "$mode"
          done
        fi
      # Keep the Android smoke and the top-level suites on the base-owned
      # payload and run them through one exact Dot snapshot, resolved once for
      # this job. This is the only leg that runs the suites under Termux.
      termux-command: |-
        set -euo pipefail
        export DOTFILES_CANDIDATE_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
        export DOT_TEST_REQUIRE_TMUX=1
        # Same floating control-plane release as test-command (see above).
        # This job makes one runtime resolution, so `latest` is already
        # frozen for this job. (Each matrix job resolves independently.)
        export DOT_STACK_DOT_RELEASE_TAG='latest'
        test "$(git rev-parse HEAD)" = "$DOTFILES_CANDIDATE_SHA"
        .local/lib/dotfiles/tests/stack-dot-runtime control-plane-run-ci -- \
          .local/lib/dotfiles/tests/run-ci-candidate-home \
            bash -c '
              set -euo pipefail
              unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME XDG_CACHE_HOME XDG_RUNTIME_DIR
              export DOT_VERBOSE=1
              dot_bin_dir=${DOT_STACK_DOT_BIN%/*}
              # The provider runs, as on a phone: it installs the declared
              # tools (zsh, jq, fd, ripgrep, cron, tmux) the suites below use.
              PATH="$dot_bin_dir:$HOME/.local/bin:$PATH" \
                "$DOT_STACK_DOT_BIN" update
              PATH="$dot_bin_dir:$HOME/.local/bin:$PATH" \
                bash .local/lib/dotfiles/tests/android-ci-smoke
              # The top-level suites, one at a time: a parallel run on a
              # real phone gets the whole Termux app killed by Android.
              DOT_TEST_JOBS=1 .local/lib/dotfiles/tests/run-ci --top-level
            '
      termux-host-command: |-
        set -euo pipefail
        export DOTFILES_CANDIDATE_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
        .local/lib/dotfiles/tests/checkout-ci-candidate
      # `dot update` installs the declared tools through Termux pkg. Python is
      # a suite runtime no dependency declares. jq is required before
      # update so the control-plane Dot release download can authenticate.
      termux-profiles: base,jq,python,tmux,ripgrep,hostname

  wezterm-install:
    name: WezTerm Shdeps install / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install and recheck the pinned WezTerm package
        env:
          DOTFILES_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DOT_STACK_DOT_RELEASE_TAG: latest
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          .local/lib/dotfiles/tests/stack-dot-runtime control-plane-run-ci -- \
            .local/lib/dotfiles/tests/run-ci-candidate-home \
              bash .local/lib/dotfiles/tests/wezterm-install-smoke

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before repository files are read.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@7cc897229a80517e83f09acf989f2da5889961ad

  installed-profiles:
    name: Installed profiles
    uses: ./.github/workflows/installed-profiles.yml
    with:
      dotfiles-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  cold-bootstrap:
    # The README one-liner on a brand-new host, for every change: the
    # published Dot installer, then `dot init` with nothing pre-seeded, so
    # the first converge runs in the real client topology.
    #
    # Keep this job faithful to a real fresh host. Its value is exactly the
    # state a test harness would be tempted to paper over:
    # - Do not pre-create ~/.local/lib/dot, set DOT_TEST_HOST_HOME, stack a
    #   frozen Dot runtime, or seed any other client state. An earlier
    #   version of this job did all of that, and it hid a first-converge
    #   failure where the dotfiles Git launcher could not load its helper
    #   until Shdeps published ~/.local/lib/dot, so every Shdeps clone
    #   failed on every new host while this job stayed green.
    # - Do not move the first-run check below the resume, or add retries
    #   ahead of it: a resumed init succeeds once the first run has
    #   published the link, masking the defect again (verified: on the
    #   broken launcher the first init fails with 16 `clone failed` items
    #   and the resume completes cleanly).
    # - Keep matching `clone failed`, not just the launcher's message:
    #   Shdeps discards `git clone` stderr, so the console only ever shows
    #   the summarized item.
    # - Do not run it only on a schedule: a fresh-host regression should
    #   fail the change that introduces it.
    # - If GitHub rate limits or other transient service failures make it
    #   flaky, fix that at the transport (authenticated API lookups as
    #   below, bounded resumes of real stalls), never by seeding state,
    #   skipping steps, or switching to a pre-installed runtime.
    name: Cold Ubuntu default-profile bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install bootstrap prerequisites
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@7cc897229a80517e83f09acf989f2da5889961ad
        with:
          matrix-name: Ubuntu
          profiles: base,jq,python,zsh,lua,openssh-netcat-lsof,procps,cron,fd,ripgrep,hostname
          setup: none

      - name: Bootstrap and diagnose the configured default profile
        shell: bash
        env:
          # Shdeps authenticates with GH_TOKEN itself, and nothing on this
          # path scrubs it. installed-profiles.yml sets
          # SHDEPS_ALLOW_GH_AUTH_TOKEN because its test harness strips
          # tokens unless that flag is set; beyond that, the flag only
          # lets Shdeps fall back to `gh auth token`. This job needs
          # neither. The token only authenticates Shdeps' GitHub API
          # lookups, because hosted runners share the 60/hour
          # unauthenticated quota per IP. Git clones stay anonymous, as on
          # a fresh host with no GitHub credentials, since nothing
          # configures a credential helper; keep it that way.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          # The commit under test; GITHUB_SHA is a merge commit on PRs.
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |-
          set -euo pipefail
          staging=$(mktemp -d /tmp/dotfiles-cold-bootstrap.XXXXXXXX)
          origin=$staging/origin.git
          log=$staging/bootstrap.log
          git init --quiet --bare "$origin"
          git push --quiet "$origin" "$EXPECTED:refs/heads/main"
          git --git-dir="$origin" symbolic-ref HEAD refs/heads/main
          export HOME=$staging/home
          mkdir "$HOME"
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME XDG_CACHE_HOME XDG_RUNTIME_DIR
          unset GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND='ssh -o BatchMode=yes -o ConnectTimeout=5'

          # What cgraf78.github.io/d runs, pointed at this commit: the latest
          # published installer and release, with no Dot runtime, public
          # library link, or other client state seeded beforehand.
          init_status=0
          curl -fsSL https://raw.githubusercontent.com/cgraf78/dot/main/install.sh |
            bash -s -- --init --yes --branch main "file://$origin" 2>&1 |
            tee "$log" || init_status=$?
          # A first converge that breaks the client's own launchers (such as
          # Git running before Shdeps publishes ~/.local/lib/dot) is
          # deterministic, and the resume below would hide it. Shdeps
          # discards clone stderr, so a broken Git launcher surfaces only as
          # `clone failed` items. Anonymous clones of public repositories
          # are not what #320 resumes for, so failing on them is right.
          if grep -E 'could not load launcher helper|clone failed' "$log"; then
            echo '::error::first converge failed GitHub clones or a launcher'
            exit 1
          fi
          export PATH="$HOME/.local/bin:$PATH"
          if ((init_status != 0)); then
            # Registry-backed installs occasionally stall past their hook
            # timeout (#320); resume the initialization transaction once.
            echo 'Cold bootstrap failed; resuming initialization once' >&2
            dot init --branch main "file://$origin"
          fi
          [[ $(dot init --status) == *'initialization: complete'* ]]
          test "$(git --git-dir="$HOME/.dotfiles" rev-parse HEAD)" = "$EXPECTED"
          test "$(git --git-dir="$HOME/.dotfiles" config --bool core.bare)" = false
          test "$(git --git-dir="$HOME/.dotfiles" config core.worktree)" = "$HOME"
          dot update
          # Diagnose through the Dot this bootstrap installed: the command a
          # freshly bootstrapped user runs next, now adopted by Shdeps with
          # its public library published by the client's post hook.
          hash -r
          public_dot=$(command -v dot)
          test "$public_dot" = "$HOME/.local/bin/dot"
          test "$public_dot" -ef "$HOME/.local/share/cgraf78/dot/dot"
          test "$HOME/.local/lib/dot" -ef "$HOME/.local/share/cgraf78/dot/lib/dot/public"
          printf 'doctor-runtime\tdot=%s\tversion=%s\n' \
            "$public_dot" "$(dot --version)"
          test "$(command -v git)" = "$HOME/.local/bin/git"
          git --version
          public_tmux=$(command -v tmux)
          test "$public_tmux" = "$HOME/.local/bin/tmux"
          "$HOME/.local/bin/shdeps" check tmux
          dot doctor
          test "$(git --git-dir="$HOME/.dotfiles" rev-parse HEAD)" = "$EXPECTED"
