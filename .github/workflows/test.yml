name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@feeba8dcb271bd206ae55cd735e53577ffa08877
    with:
      matrix-set: full
      setup: dotfiles
      test-command: .local/bin/dot-test
