name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@e3a25ae946aea8fd57da3bf2ffbf9f94ea84b8d9
    with:
      # This repository owns only base and profile/control-plane tests. The
      # public capability repositories run their own focused suites, so this
      # job installs only the prerequisites for the base/control-plane client.
      setup: none
      profiles: base,jq,python,zsh,lua,tmux,openssh-netcat-lsof,procps,cron,fd,ripgrep,hostname,shellcheck
      matrix-set: full
      shellcheck-exclude-codes: SC1091
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: |-
        set -euo pipefail
        export DOTFILES_CANDIDATE_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
        .local/lib/dotfiles/tests/checkout-ci-candidate
        # Post-cutover the engine ships only as a native binary and the matrix
        # images carry no Rust toolchain: resolve the control-plane runtime
        # from the latest published release instead of a source checkout.
        # Resolve once here, after the candidate checkout, so every
        # stack-dot-runtime group in this leg tests the same frozen tag.
        # (The live suite resolves its own tag by design; see
        # dot-release-live-test.) The fleet consumes latest through shdeps,
        # so CI validates what the fleet installs with no manual pin to bump.
        . .local/lib/dotfiles/tests/dot-runtime-resolve.sh
        # Declare and export separately: `export VAR=$(...)` would mask a
        # resolution failure and silently fall back to the git path below.
        dot_release_tag="$(_dot_release_latest_tag cgraf78/dot)"
        export DOT_STACK_DOT_RELEASE_TAG=$dot_release_tag
        .local/lib/dotfiles/tests/stack-dot-runtime control-plane-run-ci -- \
          .local/lib/dotfiles/tests/run-ci-candidate-home \
            .local/lib/dotfiles/tests/run-ci
        if [[ ${RUNNER_OS:-} == Linux ]]; then
          for mode in update doctor; do
            case "$mode" in
              update) group=profile-fixture-update ;;
              doctor) group=profile-doctor ;;
            esac
            .local/lib/dotfiles/tests/stack-dot-runtime "$group" -- \
              .local/lib/dotfiles/tests/run-ci-candidate-home \
                .local/lib/dotfiles/tests/profile-fixture-integration "$mode"
          done
        fi
      # Keep this Android smoke on the base-owned payload and run it through
      # one exact Dot snapshot, resolved once for this job.
      termux-command: |-
        set -euo pipefail
        export DOTFILES_CANDIDATE_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
        # Same floating control-plane release as test-command (see above).
        # This job makes one runtime resolution, so `latest` is already
        # frozen for this job. (Each matrix job resolves independently.)
        export DOT_STACK_DOT_RELEASE_TAG='latest'
        test "$(git rev-parse HEAD)" = "$DOTFILES_CANDIDATE_SHA"
        .local/lib/dotfiles/tests/stack-dot-runtime control-plane-run-ci -- \
          .local/lib/dotfiles/tests/run-ci-candidate-home \
            bash -c '
              set -euo pipefail
              unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME XDG_CACHE_HOME XDG_RUNTIME_DIR
              export DOT_VERBOSE=1
              dot_bin_dir=${DOT_STACK_DOT_BIN%/*}
              DOT_INIT_SKIP_PROVIDER=1 \
                PATH="$dot_bin_dir:$HOME/.local/bin:$PATH" \
                "$DOT_STACK_DOT_BIN" update
              PATH="$dot_bin_dir:$HOME/.local/bin:$PATH" \
                bash .local/lib/dotfiles/tests/android-ci-smoke
            '
      termux-host-command: |-
        set -euo pipefail
        export DOTFILES_CANDIDATE_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
        .local/lib/dotfiles/tests/checkout-ci-candidate
      termux-profiles: base,tmux,ripgrep,hostname

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before repository files are read.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@e3a25ae946aea8fd57da3bf2ffbf9f94ea84b8d9

  installed-profiles:
    name: Installed profiles
    uses: ./.github/workflows/installed-profiles.yml
    with:
      dotfiles-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  cold-bootstrap:
    name: Cold Ubuntu default-profile bootstrap
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install bootstrap prerequisites
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@e3a25ae946aea8fd57da3bf2ffbf9f94ea84b8d9
        with:
          matrix-name: Ubuntu
          profiles: base,jq,python,zsh,lua,tmux,openssh-netcat-lsof,procps,cron,fd,ripgrep,hostname
          setup: none

      - name: Bootstrap and diagnose the configured default profile
        shell: bash
        env:
          # Shdeps authenticates with GH_TOKEN itself, and nothing on this
          # path scrubs it. The installed-profiles job sets
          # SHDEPS_ALLOW_GH_AUTH_TOKEN because its test harness strips
          # tokens unless that flag is set; beyond that, the flag only
          # lets Shdeps fall back to `gh auth token`. This job needs
          # neither.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          # Same floating control-plane release as test-command: the cold
          # image carries no Rust toolchain, so a source checkout can
          # never run here. The stacked runtime resolves `latest` once, so
          # init and update share one frozen release. (Each matrix job
          # resolves independently.) Shdeps separately resolves `latest`
          # for the client's own Dot, which runs the final doctor below.
          export DOT_STACK_DOT_RELEASE_TAG='latest'
          staging=$(mktemp -d /tmp/dotfiles-cold-bootstrap.XXXXXXXX)
          origin=$staging/origin.git
          fixture_home=$staging/home
          git init --quiet --bare "$origin"
          git push --quiet "$origin" "$GITHUB_SHA:refs/heads/main"
          git --git-dir="$origin" symbolic-ref HEAD refs/heads/main
          mkdir "$fixture_home"

          .local/lib/dotfiles/tests/stack-dot-runtime reproducible-cold-bootstrap -- \
            bash -s -- "$origin" "$fixture_home" "$GITHUB_SHA" <<'BASH'
          set -euo pipefail
          origin=$1
          fixture_home=$2
          expected=$3
          export HOME=$fixture_home
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME XDG_CACHE_HOME XDG_RUNTIME_DIR
          unset GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT
          export PATH="${DOT_STACK_DOT_BIN%/*}:$HOME/.local/bin:$PATH"
          export DOTFILES_BRANCH=main
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND='ssh -o BatchMode=yes -o ConnectTimeout=5'

          # The normal installer publishes this API before `dot init`. Expose
          # the resolved copy through the launcher's isolated test-host path so
          # Shdeps can replace the fixture's real client topology normally.
          launcher_home=${fixture_home%/*}/launcher-home
          mkdir -p "$launcher_home/.local/lib"
          ln -s "$DOT_STACK_DOT_ROOT/lib/dot/public" "$launcher_home/.local/lib/dot"
          export DOT_TEST_HOST_HOME=$launcher_home

          if ! dot init "file://$origin"; then
            echo 'Cold bootstrap failed; retrying initialization once' >&2
            dot init "file://$origin"
          fi
          init_status=$(dot init --status)
          [[ $init_status == *'initialization: complete'* ]]
          test "$(git --git-dir="$HOME/.dotfiles" rev-parse HEAD)" = "$expected"
          test "$(git --git-dir="$HOME/.dotfiles" config --bool core.bare)" = false
          test "$(git --git-dir="$HOME/.dotfiles" config core.worktree)" = "$HOME"
          dot update
          unset DOT_TEST_HOST_HOME
          # Diagnose through the Dot this bootstrap installed: the command a
          # freshly bootstrapped user runs next. The stacked runtime drove
          # init and update above, but it lives outside Dot's managed and
          # development locations, which doctor rightly reports as a
          # warning about the fixture rather than the client. Shdeps
          # resolved `latest` on its own during init/update, so this Dot is
          # usually the stacked release but can be newer if one was
          # published mid-job, exactly as for a real user.
          PATH=${PATH#"${DOT_STACK_DOT_BIN%/*}:"}
          hash -r
          public_dot=$(command -v dot)
          test "$public_dot" = "$HOME/.local/bin/dot"
          test "$public_dot" -ef "$HOME/.local/share/cgraf78/dot/dot"
          printf 'doctor-runtime\tdot=%s\tversion=%s\n' \
            "$public_dot" "$(dot --version)"
          dot doctor
          test "$(git --git-dir="$HOME/.dotfiles" rev-parse HEAD)" = "$expected"
          BASH
