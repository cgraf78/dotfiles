name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@663f83780f58f231e810d0c9eca642bbf859353b
    with:
      matrix-set: full
      setup: dotfiles
      test-command: .local/bin/dot-test
      termux-command: |-
        bash .local/lib/dot/tests/android-ci-smoke
