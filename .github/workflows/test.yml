name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@1db322ef8a998a904974d0c81fb94515d1b16973
    with:
      matrix-set: full
      setup: dotfiles
      test-command: .local/bin/dot-test

  termux:
    uses: cgraf78/actions/.github/workflows/termux-ci.yml@1db322ef8a998a904974d0c81fb94515d1b16973
    with:
      command: |-
        pkg install -y git
        bash .local/lib/dot/tests/android-ci-smoke
