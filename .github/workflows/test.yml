name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@b97bd729afec784785bd01ebd43321225ef47bb7
    with:
      # This repository owns only base and profile/control-plane tests. The
      # public capability repositories run their own focused suites, so this
      # job installs only the prerequisites for the base/control-plane client.
      setup: none
      profiles: base,jq,python,zsh,lua,tmux,openssh-netcat-lsof,procps,cron,fd,ripgrep,hostname,shellcheck
      matrix-set: full
      shellcheck-exclude-codes: SC1091
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: |-
        set -euo pipefail
        export DOTFILES_CANDIDATE_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
        .local/lib/dotfiles/tests/checkout-ci-candidate
        .local/lib/dotfiles/tests/run-ci-candidate-home \
          .local/lib/dotfiles/tests/stack-dot-runtime control-plane-run-ci -- \
            .local/lib/dotfiles/tests/run-ci
        if [[ ${RUNNER_OS:-} == Linux ]]; then
          for mode in update doctor test; do
            case "$mode" in
              update) group=profile-fixture-update ;;
              doctor) group=profile-doctor ;;
              test) group=installed-profile-dot-test ;;
            esac
            .local/lib/dotfiles/tests/run-ci-candidate-home \
              .local/lib/dotfiles/tests/stack-dot-runtime "$group" -- \
                .local/lib/dotfiles/tests/profile-fixture-integration "$mode"
          done
        fi
      # The final cutover keeps this Android smoke on the base-owned payload and
      # runs it through the exact D1 provider.
      termux-command: |-
        set -euo pipefail
        export DOTFILES_CANDIDATE_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
        test "$(git rev-parse HEAD)" = "$DOTFILES_CANDIDATE_SHA"
        .local/lib/dotfiles/tests/run-ci-candidate-home \
          .local/lib/dotfiles/tests/stack-dot-runtime control-plane-run-ci -- \
            bash -c '
              set -euo pipefail
              unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME XDG_CACHE_HOME XDG_RUNTIME_DIR
              export DOT_VERBOSE=1
              DOT_INIT_SKIP_PROVIDER=1 \
                PATH="$DOT_STACK_DOT_ROOT/bin:$HOME/.local/bin:$PATH" \
                "$DOT_STACK_DOT_BIN" update
              PATH="$DOT_STACK_DOT_ROOT/bin:$HOME/.local/bin:$PATH" \
                bash .local/lib/dotfiles/tests/android-ci-smoke
            '
      termux-host-command: |-
        set -euo pipefail
        export DOTFILES_CANDIDATE_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
        .local/lib/dotfiles/tests/checkout-ci-candidate
      termux-profiles: base,tmux,ripgrep,hostname

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before repository files are read.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@b97bd729afec784785bd01ebd43321225ef47bb7

  installed-profiles:
    name: Installed profile composition
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install profile test prerequisites
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@de3f6086e36a77eec8ee62f2c9871266e4b5c05c
        with:
          matrix-name: Ubuntu
          profiles: base,jq,python,zsh,lua,neovim,tmux,openssh-netcat-lsof,procps,cron,fd,ripgrep,shellcheck
          setup: none

      - name: Test unfiltered installed profiles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          export DOTFILES_CANDIDATE_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
          .local/lib/dotfiles/tests/checkout-ci-candidate
          .local/lib/dotfiles/tests/run-ci-candidate-home \
            .local/lib/dotfiles/tests/stack-dot-runtime installed-profile-dot-test -- \
              .local/lib/dotfiles/tests/profile-fixture-integration test

  cold-bootstrap:
    name: Cold Ubuntu default-profile bootstrap
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install bootstrap prerequisites
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@b97bd729afec784785bd01ebd43321225ef47bb7
        with:
          matrix-name: Ubuntu
          profiles: base,jq,python,zsh,lua,tmux,openssh-netcat-lsof,procps,cron,fd,ripgrep,hostname
          setup: none

      - name: Bootstrap and diagnose the configured default profile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          staging=$(mktemp -d /tmp/dotfiles-cold-bootstrap.XXXXXXXX)
          origin=$staging/origin.git
          fixture_home=$staging/home
          git init --quiet --bare "$origin"
          git push --quiet "$origin" "$GITHUB_SHA:refs/heads/main"
          git --git-dir="$origin" symbolic-ref HEAD refs/heads/main
          mkdir "$fixture_home"

          .local/lib/dotfiles/tests/stack-dot-runtime reproducible-cold-bootstrap -- \
            bash -s -- "$origin" "$fixture_home" "$GITHUB_SHA" <<'BASH'
          set -euo pipefail
          origin=$1
          fixture_home=$2
          expected=$3
          export HOME=$fixture_home
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME XDG_CACHE_HOME XDG_RUNTIME_DIR
          unset GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT
          export PATH="$DOT_STACK_DOT_ROOT/bin:$HOME/.local/bin:$PATH"
          export DOTFILES_BRANCH=main
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND='ssh -o BatchMode=yes -o ConnectTimeout=5'

          dot init "file://$origin"
          test "$(git --git-dir="$HOME/.dotfiles" rev-parse HEAD)" = "$expected"
          test "$(git --git-dir="$HOME/.dotfiles" config --bool core.bare)" = false
          test "$(git --git-dir="$HOME/.dotfiles" config core.worktree)" = "$HOME"
          dot update
          dot doctor
          test "$(git --git-dir="$HOME/.dotfiles" rev-parse HEAD)" = "$expected"
          BASH
