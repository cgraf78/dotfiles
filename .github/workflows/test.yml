name: Tests

on:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # protected default branch so retired aliases cannot hide CI drift.
    branches: [main]
  pull_request:
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@11a88248d44426f96cdf137e77846a62cf8b4671
    with:
      # CI restores shdeps between runs. Refresh the resolver before it
      # validates dependency releases and installed-tool smoke checks.
      force-dotfiles-update: true
      dotfiles-provider: true
      matrix-set: full
      setup: dotfiles
      shellcheck-exclude-codes: SC1091
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: |-
        # Pin retirement validation to the event's immutable predecessor.
        # Fetching a branch name here would race a newer main push and compare
        # this checkout with source it never contained.
        export DOT_VSCODE_KEYBINDING_BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before || github.sha }}"
        if [[ "$DOT_VSCODE_KEYBINDING_BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
          export DOT_VSCODE_KEYBINDING_BASE_SHA=""
        fi
        if [[ -z "$DOT_VSCODE_KEYBINDING_BASE_SHA" || "$DOT_VSCODE_KEYBINDING_BASE_SHA" == "$GITHUB_SHA" ]]; then
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          export DOT_VSCODE_KEYBINDING_BASE_SHA="$(git rev-parse "$GITHUB_SHA^")"
        else
          git fetch --no-tags --depth=1 origin "+$DOT_VSCODE_KEYBINDING_BASE_SHA:refs/remotes/origin/dot-keybinding-base"
        fi
        DOT_CORE_SKIP_SHELLCHECK=1 .local/bin/dot-test
        lsp_mise_backends=(
          github:neocmakelsp/neocmakelsp
          github:kristoff-it/superhtml
        )
        # The shared bootstrap skips the unsupported global mise toolset on
        # Alpine, so install only these musl-capable backends there. Elsewhere,
        # validate the complete lock after bootstrap and force one Ubuntu
        # reinstall to exercise the locked glibc release assets too.
        if [[ -f /etc/alpine-release ]]; then
          mise install --locked "${lsp_mise_backends[@]}"
        else
          mise install --locked --dry-run
          if [[ -r /etc/os-release ]] &&
            grep -q '^ID=ubuntu$' /etc/os-release &&
            ! grep -qi microsoft /proc/version; then
            mise install --locked --force "${lsp_mise_backends[@]}"
          fi
        fi
        command -v neocmakelsp >/dev/null
        neocmakelsp --version >/dev/null
        command -v superhtml >/dev/null
        superhtml version >/dev/null
      termux-command: |-
        set -euo pipefail
        HOME="$PWD" PATH="$PWD/.local/bin:$PATH" dot update
        HOME="$PWD" PATH="$PWD/.local/bin:$PATH" bash .local/lib/dotfiles/tests/android-ci-smoke
      termux-profiles: base,neovim

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@11a88248d44426f96cdf137e77846a62cf8b4671

  cold-bootstrap:
    name: Cold Ubuntu bootstrap
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install bootstrap prerequisites
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@11a88248d44426f96cdf137e77846a62cf8b4671
        with:
          matrix-name: Ubuntu
          setup: dotfiles

      - name: Create an exact origin and conventional user
        shell: bash
        run: |-
          set -euo pipefail

          staging=$(mktemp -d /tmp/dotfiles-cold-bootstrap.XXXXXXXX)
          chmod 0755 "$staging"
          origin="$staging/origin.git"
          git init --bare "$origin"
          git push "$origin" "$GITHUB_SHA:refs/heads/main"
          git --git-dir="$origin" symbolic-ref HEAD refs/heads/main
          echo "COLD_DOTFILES_ORIGIN=$origin" >>"$GITHUB_ENV"

          sudo useradd --create-home --shell /bin/bash dotfiles-ci
          echo 'dotfiles-ci ALL=(ALL) NOPASSWD:ALL' |
          sudo tee /etc/sudoers.d/dotfiles-ci >/dev/null
          sudo chmod 0440 /etc/sudoers.d/dotfiles-ci
          sudo visudo -cf /etc/sudoers.d/dotfiles-ci
          sudo chown -R dotfiles-ci:dotfiles-ci "$staging"

      - name: Bootstrap, update, install, and diagnose
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail

          sudo --preserve-env=CI,GH_TOKEN,GITHUB_TOKEN -H -u dotfiles-ci \
            bash -s -- \
            "$COLD_DOTFILES_ORIGIN" "$GITHUB_SHA" <<'BASH'
          set -euo pipefail
          origin=$1
          expected=$2

          test "$HOME" = /home/dotfiles-ci
          # sudo -H sets HOME but keeps the runner cwd, which this user cannot traverse.
          cd "$HOME"
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME XDG_CACHE_HOME XDG_RUNTIME_DIR
          unset GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT
          unset MISE_DATA_DIR MISE_STATE_DIR MISE_CACHE_DIR MISE_CONFIG_DIR

          retry() {
            local attempt rc delay
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              else
                rc=$?
              fi
              if [[ "$attempt" -eq 3 ]]; then
                return "$rc"
              fi
              delay=$((attempt * 15))
              echo "$* failed (attempt $attempt/3, exit $rc); retrying in ${delay}s..." >&2
              sleep "$delay"
            done
          }

          diagnose_init_identity() {
            local record="$HOME/.local/state/dot/init/transaction/record"
            local git_dir="$HOME/.dotfiles"
            local marker="$git_dir/dot-init-generation-v1"
            local record_git_dir record_worktree record_dev record_ino
            local record_nonce record_commit record_identity record_branch actual_identity
            local marker_nonce marker_commit marker_identity marker_header marker_lines
            local marker_nonce_count marker_commit_count marker_identity_count
            local branch head bare worktree origin_real origin_identity
            local record_authority=no git_authority=no marker_authority=no
            local record_git_dir_match=no record_worktree_match=no identity_match=no
            local record_identity_match=no record_branch_match=no record_commit_match=no
            local marker_header_match=no marker_shape_match=no
            local marker_nonce_match=no marker_commit_match=no marker_identity_match=no
            local origin_match=no origin_identity_match=no branch_match=no
            local head_match=no head_record_match=no head_valid=no bare_match=no
            local worktree_match=no
            local -a urls=()

            record_value() {
              sed -n "s/^$1=//p" "$record" 2>/dev/null
            }
            marker_value() {
              sed -n "s/^$1=//p" "$marker" 2>/dev/null
            }

            [[ -f $record && ! -L $record && -O $record ]] && record_authority=yes
            [[ -d $git_dir && ! -L $git_dir ]] && git_authority=yes
            [[ -f $marker && ! -L $marker && -O $marker ]] && marker_authority=yes
            record_git_dir=$(record_value git_dir || true)
            record_worktree=$(record_value worktree || true)
            record_dev=$(record_value git_dev || true)
            record_ino=$(record_value git_ino || true)
            record_nonce=$(record_value nonce || true)
            record_commit=$(record_value commit || true)
            record_identity=$(record_value identity || true)
            record_branch=$(record_value branch || true)
            actual_identity=$(stat -c '%d:%i' "$git_dir" 2>/dev/null || true)
            marker_header=$(sed -n '1p' "$marker" 2>/dev/null || true)
            marker_lines=$(wc -l <"$marker" 2>/dev/null || true)
            marker_lines=${marker_lines//[[:space:]]/}
            marker_nonce=$(marker_value nonce || true)
            marker_commit=$(marker_value commit || true)
            marker_identity=$(marker_value identity || true)
            marker_nonce_count=$(grep -c '^nonce=' "$marker" 2>/dev/null || true)
            marker_commit_count=$(grep -c '^commit=' "$marker" 2>/dev/null || true)
            marker_identity_count=$(grep -c '^identity=' "$marker" 2>/dev/null || true)
            mapfile -t urls < <(
              git --git-dir="$git_dir" config --get-all remote.origin.url 2>/dev/null || true
            )
            if [[ ${#urls[@]} -eq 1 && ${urls[0]} == file://* ]]; then
              origin_real=$(realpath "${urls[0]#file://}" 2>/dev/null || true)
              [[ -z $origin_real ]] || origin_identity=file://$origin_real
            fi
            branch=$(git --git-dir="$git_dir" symbolic-ref --short HEAD 2>/dev/null || true)
            head=$(git --git-dir="$git_dir" rev-parse HEAD 2>/dev/null || true)
            bare=$(git --git-dir="$git_dir" config --bool core.bare 2>/dev/null || true)
            worktree=$(git --git-dir="$git_dir" config core.worktree 2>/dev/null || true)

            [[ $record_git_dir == "$git_dir" ]] && record_git_dir_match=yes
            [[ $record_worktree == "$HOME" ]] && record_worktree_match=yes
            [[ "$record_dev:$record_ino" == "$actual_identity" ]] && identity_match=yes
            [[ $record_identity == "file://$origin" ]] && record_identity_match=yes
            [[ $record_branch == main ]] && record_branch_match=yes
            [[ $record_commit == "$expected" ]] && record_commit_match=yes
            [[ $marker_header == 'cgraf78 dot client generation v1' ]] && marker_header_match=yes
            if [[ $marker_lines == 4 && $marker_nonce_count == 1 &&
              $marker_commit_count == 1 && $marker_identity_count == 1 ]]; then
              marker_shape_match=yes
            fi
            [[ $marker_nonce == "$record_nonce" ]] && marker_nonce_match=yes
            [[ $marker_commit == "$record_commit" ]] && marker_commit_match=yes
            [[ $marker_identity == "$record_identity" ]] && marker_identity_match=yes
            [[ ${#urls[@]} -eq 1 && ${urls[0]} == "file://$origin" ]] && origin_match=yes
            [[ $origin_identity == "$record_identity" ]] && origin_identity_match=yes
            [[ $branch == main ]] && branch_match=yes
            [[ $head == "$expected" ]] && head_match=yes
            [[ $head == "$record_commit" ]] && head_record_match=yes
            [[ $head =~ ^[0-9a-fA-F]{40}$|^[0-9a-fA-F]{64}$ ]] && head_valid=yes
            [[ $bare == false ]] && bare_match=yes
            [[ $worktree == "$HOME" ]] && worktree_match=yes

            printf '%s\n' '--- dot init identity diagnostic ---'
            printf 'record.authority=%s git.authority=%s marker.authority=%s\n' \
              "$record_authority" "$git_authority" "$marker_authority"
            printf 'record.git_dir=%s record.worktree=%s git.identity=%s\n' \
              "$record_git_dir_match" "$record_worktree_match" "$identity_match"
            printf 'record.identity=%s record.branch=%s record.commit=%s\n' \
              "$record_identity_match" "$record_branch_match" "$record_commit_match"
            printf 'marker.header=%s marker.shape=%s marker.nonce=%s marker.commit=%s marker.identity=%s\n' \
              "$marker_header_match" "$marker_shape_match" \
              "$marker_nonce_match" "$marker_commit_match" "$marker_identity_match"
            printf 'origin.count=%s origin.match=%s origin.identity=%s branch=%s\n' \
              "${#urls[@]}" "$origin_match" "$origin_identity_match" "$branch_match"
            printf 'head.expected=%s head.record=%s head.valid=%s\n' \
              "$head_match" "$head_record_match" "$head_valid"
            printf 'core.bare=%s core.worktree=%s\n' "$bare_match" "$worktree_match"
            return 0
          }

          trace_init_resume() {
            local trace="$HOME/.local/state/dot/init-resume.trace"

            (
              unset GH_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN
              umask 077
              : >"$trace"
              exec 9>>"$trace"
              export BASH_XTRACEFD=9 SHELLOPTS
              export PS4='+${BASH_SOURCE##*/}:${LINENO}:${FUNCNAME[0]:-main}: '
              set -x
              "$HOME/.local/share/cgraf78/dot/bin/dot" init --yes \
                --branch main "file://$origin"
            ) >/dev/null 2>&1 || true
            printf '%s\n' '--- dot init resume trace (tail) ---'
            tail -n 400 "$trace" || true
            rm -f -- "$trace"
            return 0
          }

          test ! -e "$HOME/.dotfiles"
          test ! -e "$HOME/.local/share/shdeps"
          test ! -e "$HOME/.cache/mise"
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND='ssh -o BatchMode=yes -o ConnectTimeout=5'

          # The public shortcut owns standalone Dot installation and `dot init`
          # dispatch. Initialization is transactional and resumable, so retry
          # the complete boundary for transient provider/network failures; a
          # deterministic defect still fails after the bounded attempts.
          export DOTFILES_REPOSITORY="file://$origin"
          export DOTFILES_BRANCH=main
          export DOT_VERBOSE=1
          bootstrap_client() {
            curl -fsSL https://cgraf78.github.io/d | bash
          }
          if ! retry bootstrap_client; then
            diagnose_init_identity >&2
            trace_init_resume >&2
            "$HOME/.local/share/cgraf78/dot/bin/dot" init --status >&2 || true
            exit 1
          fi

          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          test ! -e "$HOME/.git"
          test "$(git --git-dir="$HOME/.dotfiles" config --bool core.bare)" = false
          test "$(git --git-dir="$HOME/.dotfiles" config core.worktree)" = "$HOME"
          test "$(git --git-dir="$HOME/.dotfiles" rev-parse HEAD)" = "$expected"

          retry dot update
          mise trust "$HOME/.config/mise/config.toml" >/dev/null || true
          export MISE_GITHUB_TOKEN="$GITHUB_TOKEN"
          retry mise install --locked
          for tool in actionlint ruff shellcheck shfmt zizmor; do
            command -v "$tool" >/dev/null
          done
          dot doctor

          test "$(git --git-dir="$HOME/.dotfiles" rev-parse HEAD)" = "$expected"
          BASH
