name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@9e0d9c7492170350e48a23b6a47c1ef9ae9fa003
    with:
      matrix-set: full
      setup: dotfiles
      test-command: .local/bin/dot-test
      termux-command: |-
        bash .local/lib/dot/tests/android-ci-smoke
