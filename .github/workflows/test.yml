name: Tests

on:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # protected default branch so retired aliases cannot hide CI drift.
    branches: [main]
  pull_request:
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@93aa1a87fecfca887d27886f89cc63d388419068
    with:
      # CI restores shdeps between runs. Refresh the resolver before it
      # validates dependency releases and installed-tool smoke checks.
      force-dotfiles-update: true
      matrix-set: full
      setup: dotfiles
      shellcheck-exclude-codes: SC1091
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: |-
        # Pin retirement validation to the event's immutable predecessor.
        # Fetching a branch name here would race a newer main push and compare
        # this checkout with source it never contained.
        export DOT_VSCODE_KEYBINDING_BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before || github.sha }}"
        if [[ "$DOT_VSCODE_KEYBINDING_BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
          export DOT_VSCODE_KEYBINDING_BASE_SHA=""
        fi
        if [[ -z "$DOT_VSCODE_KEYBINDING_BASE_SHA" || "$DOT_VSCODE_KEYBINDING_BASE_SHA" == "$GITHUB_SHA" ]]; then
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          export DOT_VSCODE_KEYBINDING_BASE_SHA="$(git rev-parse "$GITHUB_SHA^")"
        else
          git fetch --no-tags --depth=1 origin "+$DOT_VSCODE_KEYBINDING_BASE_SHA:refs/remotes/origin/dot-keybinding-base"
        fi
        # The fleet transition fixture executes the exact pre-cutover updater.
        # Keep its one historical revision in the fixture lock, then fetch it
        # only when a shallow checkout does not already contain that object.
        dot_cutover_baseline=$(sed -n 's/^revision=//p' \
          .local/lib/dotfiles/tests/cutover-baseline.lock)
        if ! git cat-file -e "$dot_cutover_baseline^{commit}" 2>/dev/null; then
          git fetch --no-tags --depth=1 origin \
            "+$dot_cutover_baseline:refs/remotes/origin/dot-cutover-baseline"
        fi
        # Bootstrap provisions Dot on the product path, but contract tests also
        # need one deterministic checkout before the dependency setup step.
        # Derive it from the same cutover lock instead of maintaining a second
        # revision.
        dot_test_revision=$(sed -n 's/^minimum_revision=//p' \
          .local/lib/dotfiles/dot-cutover.lock)
        [[ $dot_test_revision =~ ^[0-9a-f]{40}$ ]]
        dot_test_root=$RUNNER_TEMP/dot-under-test
        git init -q "$dot_test_root"
        git -C "$dot_test_root" remote add origin https://github.com/cgraf78/dot.git
        git -C "$dot_test_root" fetch --no-tags --depth=1 origin "$dot_test_revision"
        git -C "$dot_test_root" checkout -q --detach FETCH_HEAD
        [[ $(git -C "$dot_test_root" rev-parse HEAD) == "$dot_test_revision" ]]
        export DOT_TEST_DOT_ROOT=$dot_test_root
        DOT_CORE_SKIP_SHELLCHECK=1 .local/bin/dot-test
        DOT_REEXEC=1 .local/bin/dot-test -s fleet-transition
        lsp_mise_backends=(
          github:neocmakelsp/neocmakelsp
          github:kristoff-it/superhtml
        )
        # The shared bootstrap skips the unsupported global mise toolset on
        # Alpine, so install only these musl-capable backends there. Elsewhere,
        # validate the complete lock after bootstrap and force one Ubuntu
        # reinstall to exercise the locked glibc release assets too.
        if [[ -f /etc/alpine-release ]]; then
          mise install --locked "${lsp_mise_backends[@]}"
        else
          mise install --locked --dry-run
          if [[ -r /etc/os-release ]] &&
            grep -q '^ID=ubuntu$' /etc/os-release &&
            ! grep -qi microsoft /proc/version; then
            mise install --locked --force "${lsp_mise_backends[@]}"
          fi
        fi
        command -v neocmakelsp >/dev/null
        neocmakelsp --version >/dev/null
        command -v superhtml >/dev/null
        superhtml version >/dev/null
      termux-command: |-
        set -euo pipefail
        HOME="$PWD" PATH="$PWD/.local/bin:$PATH" .local/bin/dot update --skip-pull
        HOME="$PWD" PATH="$PWD/.local/bin:$PATH" bash .local/lib/dotfiles/legacy-dot/tests/android-ci-smoke
      termux-profiles: base,neovim

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@93aa1a87fecfca887d27886f89cc63d388419068

  cold-bootstrap:
    name: Cold Ubuntu bootstrap
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install bootstrap prerequisites
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@93aa1a87fecfca887d27886f89cc63d388419068
        with:
          matrix-name: Ubuntu
          setup: dotfiles

      - name: Create an exact origin and conventional user
        shell: bash
        run: |-
          set -euo pipefail

          staging=$(mktemp -d /tmp/dotfiles-cold-bootstrap.XXXXXXXX)
          chmod 0755 "$staging"
          cp "$GITHUB_WORKSPACE/.local/bin/dotbootstrap" "$staging/dotbootstrap"
          origin="$staging/origin.git"
          git init --bare "$origin"
          git push "$origin" "$GITHUB_SHA:refs/heads/main"
          git --git-dir="$origin" symbolic-ref HEAD refs/heads/main
          echo "COLD_BOOTSTRAP_SCRIPT=$staging/dotbootstrap" >>"$GITHUB_ENV"
          echo "COLD_DOTFILES_ORIGIN=$origin" >>"$GITHUB_ENV"

          sudo useradd --create-home --shell /bin/bash dotfiles-ci
          echo 'dotfiles-ci ALL=(ALL) NOPASSWD:ALL' |
          sudo tee /etc/sudoers.d/dotfiles-ci >/dev/null
          sudo chmod 0440 /etc/sudoers.d/dotfiles-ci
          sudo visudo -cf /etc/sudoers.d/dotfiles-ci
          sudo chown -R dotfiles-ci:dotfiles-ci "$staging"

      - name: Bootstrap, update, install, and diagnose
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail

          sudo --preserve-env=CI,GH_TOKEN,GITHUB_TOKEN -H -u dotfiles-ci \
            bash -s -- \
            "$COLD_BOOTSTRAP_SCRIPT" "$COLD_DOTFILES_ORIGIN" "$GITHUB_SHA" <<'BASH'
          set -euo pipefail
          bootstrap=$1
          origin=$2
          expected=$3

          test "$HOME" = /home/dotfiles-ci
          # sudo -H sets HOME but keeps the runner cwd, which this user cannot traverse.
          cd "$HOME"
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME XDG_CACHE_HOME XDG_RUNTIME_DIR
          unset GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT
          unset MISE_DATA_DIR MISE_STATE_DIR MISE_CACHE_DIR MISE_CONFIG_DIR

          retry() {
            local attempt rc delay
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              else
                rc=$?
              fi
              if [[ "$attempt" -eq 3 ]]; then
                return "$rc"
              fi
              delay=$((attempt * 15))
              echo "$* failed (attempt $attempt/3, exit $rc); retrying in ${delay}s..." >&2
              sleep "$delay"
            done
          }

          test ! -e "$HOME/.dotfiles"
          test ! -e "$HOME/.local/share/shdeps"
          test ! -e "$HOME/.cache/mise"
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND='ssh -o BatchMode=yes -o ConnectTimeout=5'

          # Preserve the clean-install signal: only the idempotent post-bootstrap
          # network phases below receive bounded retries.
          DOTBOOTSTRAP_DOTFILES_REPO="$origin" DOTFILES_BRANCH=main \
            bash -s init <"$bootstrap"

          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          test -e "$HOME/.dotbootstrap-done"
          test "$(git --git-dir="$HOME/.dotfiles" rev-parse HEAD)" = "$expected"

          retry dot update
          mise trust "$HOME/.config/mise/config.toml" >/dev/null || true
          export MISE_GITHUB_TOKEN="$GITHUB_TOKEN"
          retry mise install --locked
          for tool in actionlint ruff shellcheck shfmt zizmor; do
            command -v "$tool" >/dev/null
          done
          dot doctor

          test "$(git --git-dir="$HOME/.dotfiles" rev-parse HEAD)" = "$expected"
          BASH
