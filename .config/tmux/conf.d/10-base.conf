# ~/.config/tmux/tmux.conf

# === Defaults ===
run-shell 'shell=$(command -v zsh 2>/dev/null || printf "%s" "$SHELL"); tmux set-option -g default-shell "$shell"; tmux set-option -g default-command "exec $shell -l"'
set -s default-terminal "tmux-256color"
set -s escape-time 10

# Enable true color (24-bit) passthrough. Fixed indexes, like terminal-features
# below, so reloading replaces these entries instead of appending copies (a
# server that already holds copies keeps them until it restarts); index 0 keeps
# tmux's built-in linux console override.
set -s terminal-overrides[1] "xterm-256color:Tc"
set -s terminal-overrides[2] "*256col*:Tc"

# Pass through modifier+arrow sequences (Ctrl+Left/Right for word navigation).
# Requires a fresh tmux session (not just tmux source) to take effect.
set -g xterm-keys on
set -g extended-keys on
set -s user-keys[8] "\033[777009u"
# Termnav's Ctrl-V image-paste trigger, sent by WezTerm and carried inward
# between tmux layers; User14 below routes it.
set -s user-keys[14] "\033[777010u"
# The outer terminal answers Termnav's read-only DECRQM query with one of five
# standard states. Bind every legal reply so the commit barrier is independent
# of whether bracketed paste is unsupported, set, reset, or permanently fixed.
set -s user-keys[9] "\033[?2004;0\$y"
set -s user-keys[10] "\033[?2004;1\$y"
set -s user-keys[11] "\033[?2004;2\$y"
set -s user-keys[12] "\033[?2004;3\$y"
set -s user-keys[13] "\033[?2004;4\$y"

# Advertise WezTerm/xterm features that tmux cannot infer from terminfo.
# extkeys keeps CSI u key sequences intact; hyperlinks lets tmux re-emit OSC 8.
set -s terminal-features[3] "xterm-256color:extkeys:hyperlinks"
# A tmux started from a tmux pane (directly or over ssh) sees TERM=tmux-*.
# Without extkeys it never asks the outer tmux for extended keys, so the outer
# tmux collapses Ctrl-Shift chords (Ctrl-Shift-p, Ctrl-Shift-v) to plain Ctrl
# before the nested pane sees them.
set -s terminal-features[4] "tmux*:extkeys"

# Let applications handle Ctrl+Shift+Left/Right instead of tmux's default
# window-swapping bindings.
unbind-key -n C-S-Left
unbind-key -n C-S-Right


# Explicitly forward Shift+Enter as CSI u sequence to the active pane.
# Needed because terminal agents and other apps that don't request extended key
# mode won't receive it via the automatic extkeys passthrough.
bind-key -n S-Enter send-keys Escape '[13;2u'

set -g status-keys emacs
set -g mode-keys vi
set -g history-limit 100000
set -g set-clipboard on
set -g focus-events on
# Mouse mode: click to focus a pane, wheel into copy mode, drag to select.
set -g mouse on
set -g detach-on-destroy on
set -g update-environment "SSH_AUTH_SOCK VSCODE_IPC_HOOK_CLI"
# The server keeps the environment of the terminal that started it for its
# whole life. Started from a VS Code terminal, that includes VS Code's BROWSER
# helper (bin/helpers/browser.sh), which every later pane and agent then uses
# to open links in that one VS Code window, even after it is gone. Drop that
# helper and let shell startup choose the opener (env.d); a BROWSER of any
# other origin is the user's and stays. VS Code's TERM_PROGRAM needs nothing:
# tmux sets its own in panes and run-shell jobs. VSCODE_IPC_HOOK_CLI stays:
# update-environment refreshes it on attach so `code` reaches the attaching
# window.
%if "#{m:*/bin/helpers/browser.sh,#{BROWSER}}"
set-environment -gu BROWSER
%endif
setw -g aggressive-resize on

# Bell: propagate bells from background panes/windows to the terminal
set -g bell-action any
set -g visual-bell off

# Allow applications to send OSC escape sequences through tmux to the outer
# terminal (for example, Termnav user-variable routing).
set -g allow-passthrough on

# Terminal user variables are client-local and are not replayed when a new
# client attaches to an existing pane. Claim tmux ownership at attach time so
# Ctrl-Tab reaches this server before any shell or editor needs to redraw.
set-hook -g client-attached[100] {
  if-shell -F '#{==:#{client_control_mode},0}' {
    run-shell '~/.local/bin/termnav tmux context --tty #{q:client_tty} --client-termname #{q:client_termname}'
  }
}

# Termnav reconciles both sides of visual focus: a focused nested client claims
# its immediate parent pane, while an unfocused client dims its own active pane.
# The two signals compose one hop at a time through arbitrary local or SSH
# nesting without encoding hosts, session names, process names, or depth.
#
# Focus-out dims the local active pane and stops the parent publisher promptly;
# a detached client's publisher notices the client is gone on its next
# heartbeat and releases the parent. The bounded lease is the crash fallback,
# not the normal update path. Direct terminal clients have no parent route, so
# the helper exits immediately and leaves no resident process.
#
# Notification hooks can expand #{client_pid} and #{client_tty} for another
# client: tmux picks the session's most recently active client, not the client
# that raised the event, so a second client of a shared session would start the
# busier client's publisher. They pass #{hook_client} instead; termnav resolves
# that exact client and ignores control-mode clients. tmux 3.2 has no
# #{hook_client}, so that path keeps the exact identity and control-mode guard.
# A plain NAME=value line in a tmux config also exports its value into every
# pane's environment, so every helper variable in this file is %hidden.
%hidden tmux_focus_client="#{?hook_client,--client-name #{q:hook_client},--client-pid #{client_pid} --client-tty #{q:client_tty}}"
%hidden tmux_focus_guard='#{||:#{hook_client},#{==:#{client_control_mode},0}}'
%hidden tmux_focus_watch="run-shell -b 'test ! -x ~/.local/bin/termnav || exec ~/.local/bin/termnav tmux focus watch --tmux-socket #{q:socket_path} $tmux_focus_client'"
%hidden tmux_focus_stop="run-shell -b 'test ! -x ~/.local/bin/termnav || exec ~/.local/bin/termnav tmux focus stop --tmux-socket #{q:socket_path} $tmux_focus_client'"
%hidden tmux_focus_client_sync="run-shell -b 'test ! -x ~/.local/bin/termnav || exec ~/.local/bin/termnav tmux focus sync --tmux-socket #{q:socket_path} $tmux_focus_client'"
# Command hooks such as after-select-pane run with the invoking client.
%hidden tmux_focus_sync="run-shell -b 'test ! -x ~/.local/bin/termnav || exec ~/.local/bin/termnav tmux focus sync --tmux-socket #{q:socket_path} --client-pid #{client_pid} --client-tty #{q:client_tty}'"
set-hook -g client-attached[110] {
  if-shell -F "$tmux_focus_guard" "$tmux_focus_watch"
}
set-hook -g client-focus-in[110] {
  if-shell -F "$tmux_focus_guard" "$tmux_focus_watch"
}
set-hook -g client-focus-out[110] {
  if-shell -F "$tmux_focus_guard" "$tmux_focus_stop"
}
set-hook -g client-detached[110] {
  if-shell -F "$tmux_focus_guard" "$tmux_focus_stop"
}
# A pane-local dim override normally clears on focus-in. These hooks cover the
# rarer shared-session case where another client changes the selected pane in
# the meantime. The option guard keeps ordinary navigation process-free.
set-hook -g after-select-pane[110] {
  if-shell -F '#{&&:#{==:#{client_control_mode},0},#{!=:#{@termnav_client_unfocused},}}' "$tmux_focus_sync"
}
set-hook -g after-select-window[110] {
  if-shell -F '#{&&:#{==:#{client_control_mode},0},#{!=:#{@termnav_client_unfocused},}}' "$tmux_focus_sync"
}
set-hook -g client-session-changed[110] {
  if-shell -F "#{&&:$tmux_focus_guard,#{!=:#{@termnav_client_unfocused},}}" "$tmux_focus_client_sync"
}

# The status-right job below publishes each client's attention to its
# terminal, but tmux reruns it at most once a second and otherwise waits for
# the status interval. After a window or pane switch or a focus change the
# terminal's tab kept the old attention while the tmux tab already showed the
# new one, so these hooks publish the event's session at once. Notification
# hooks cover every route, including the next-window Termnav runs from its own
# tmux client, which fires no after-select-window for this client; and the
# session, unlike #{client_*}, is that of the event on tmux 3.2 too. The job
# runs in the background, so it reads the state after every hook here. Its
# output and status are discarded, since background run-shell prints them
# into a pane: an older term-pane-state without session publishing, or none,
# leaves the update to the status job.
# Focus hides only a pane's own mark; work and child leases count wherever you
# look. So a selection or focus change alters a snapshot only through a marked
# pane: one still marked anywhere in the session (the guard below), or one
# the acknowledgement hooks just cleared, which runs before these guards and
# so publishes itself. Both checks are pure formats, so navigation with
# nothing marked stays process-free. A client that changes session needs that
# whole session's snapshot.
%hidden tmux_attention_run="run-shell -b 'term-pane-state --socket #{q:socket_path} --session #{q:session_id} >/dev/null 2>&1 || true'"
%hidden tmux_attention_view="if-shell -F '#{&&:#{session_attached},#{W:#{P:#{?#{E:@pane_marked},1,}}}}' \"$tmux_attention_run\""
set-hook -g session-window-changed[140] "$tmux_attention_view"
set-hook -g window-pane-changed[140] "$tmux_attention_view"
set-hook -g client-focus-in[140] "$tmux_attention_view"
set-hook -g client-focus-out[140] "$tmux_attention_view"
set-hook -g client-session-changed[140] "if-shell -F '#{session_attached}' \"$tmux_attention_run\""

# Visiting a pane acknowledges its informational attention: a finished turn
# (kind done, or the legacy value 1) and a failed command's exit status. Clear
# on focus-out too: a pane that notified while you were in it was seen, and
# must not light up as you leave. Kinds that need an action (waiting, blocked)
# stay until the agent moves on, whose own hooks clear them; a visit clears
# them too once the pane no longer runs anything that could be that agent
# (@pane_keeps_sticky below), so a mark an agent left behind cannot resurface
# under the next program.
# Each hook's target is the pane being acknowledged. if-shell -F expands its
# condition for that target and queues its commands with the same target, so
# set-option needs no -t and no process is spawned on every focus change.
%hidden tmux_sticky_kept='#{&&:#{E:@pane_sticky},#{E:@pane_keeps_sticky}}'
# Clearing a mark changes what the terminal shows, so publish when there is
# one to clear (see the publishing hooks above).
%hidden tmux_acknowledge="if-shell -F '#{&&:#{session_attached},#{@term_notify_pending}}' \"$tmux_attention_run\" ; set-option -pu @term_notify_pending ; set-option -pu @term_notify_exit_status"
set-hook -g pane-focus-in[120] { if-shell -F "$tmux_sticky_kept" 'set-option -pu @term_notify_exit_status' "$tmux_acknowledge" }
set-hook -g pane-focus-out[120] { if-shell -F "$tmux_sticky_kept" 'set-option -pu @term_notify_exit_status' "$tmux_acknowledge" }
# tmux tracks pane focus server-wide: while any other attached client (an idle
# second machine, a terminal that never reports focus) keeps a pane focused,
# visiting it fires no pane-focus transition. Also acknowledge whatever a client
# selects or returns to, so a mark never outlives being looked at.
set-hook -g client-focus-in[120] { if-shell -F "$tmux_sticky_kept" 'set-option -pu @term_notify_exit_status' "$tmux_acknowledge" }
set-hook -g after-select-pane[120] { if-shell -F "$tmux_sticky_kept" 'set-option -pu @term_notify_exit_status' "$tmux_acknowledge" }
set-hook -g after-select-window[120] { if-shell -F "$tmux_sticky_kept" 'set-option -pu @term_notify_exit_status' "$tmux_acknowledge" }
set-hook -g client-session-changed[120] { if-shell -F "$tmux_sticky_kept" 'set-option -pu @term_notify_exit_status' "$tmux_acknowledge" }

# prefix a jumps to the next pane needing attention in any session, most
# severe first (red, then yellow, then green), each in session (as tmux lists
# them), tab and pane order. Arriving acknowledges a done or failed pane
# through the select hooks above, but waiting and blocked panes stay marked.
# The list therefore ignores focus, so it still holds the pane you are on, and
# the jump takes the entry after it: repeated presses cycle instead of
# bouncing between the first two. When that pane is last or not listed, the
# successor regex does not match and the first entry is taken. Pure formats
# find the target without forking a process; run-shell -C expands them into
# the tmux commands, which plain arguments would not.
# Each entry is :@window.%pane. A pane in the client's own session (or a
# window it shares with a grouped one) is selected there, named by the
# client's session id: a bare pane id, or a menu's own target, could resolve
# to the grouped session another client is looking at and move that client
# instead (the \$ keeps the id from reading as a variable). switch-client is
# skipped there, since it would fire client-session-changed and publish for
# nothing. A pane in another session needs switch-client, which takes the
# client that pressed the key or opened the menu to a session holding it, and
# the selects then run in that session (the leading :). tmux picks the most
# recently active session holding the pane, so when that one is grouped with
# a session another client is attached to, the two clients may then share it.
# The selects fire the hooks that acknowledge the pane, as before.
# Each expansion walks every pane of every session, so most panes, which carry
# no mark, are skipped after two plain option reads.
# A window linked into several sessions (grouped sessions share them all)
# would list its panes once per session, and a repeated entry can be its own
# successor, so a window counts only for the session its link list names
# first (older tmux's window_linked ignores grouped sessions, so read the
# list). The check matches the name exactly: @session_name_glob escapes the
# glob characters fnmatch would read in it. A name with a comma is ambiguous
# in that comma-separated list and may count twice when its window is shared.
# The pane menu runs the same command, from attention_jump (see Menus), and
# greys it out unless @attention_elsewhere holds.
set -g @pane_has_marks '#{||:#{@term_notify_pending},#{@termnav_child_attention}}'
set -g @session_name_glob '#{s/([][*?\\])/\\\1/:session_name}'
set -g @window_counted '#{||:#{==:#{window_linked_sessions_list},#{session_name}},#{m:#{E:@session_name_glob}#,*,#{window_linked_sessions_list}}}'
set -g @attention_entry ':#{window_id}.#{pane_id} '
set -g @attention_panes '#{S:#{W:#{?#{E:@window_counted},#{P:#{?#{E:@pane_has_marks},#{?#{E:@pane_jump_failed},#{E:@attention_entry},},}},}}}#{S:#{W:#{?#{E:@window_counted},#{P:#{?#{E:@pane_has_marks},#{?#{E:@pane_jump_waiting},#{E:@attention_entry},},}},}}}#{S:#{W:#{?#{E:@window_counted},#{P:#{?#{E:@pane_has_marks},#{?#{E:@pane_jump_done},#{E:@attention_entry},},}},}}}'
set -g @attention_next '#{s/ .*//:#{s/^(.* )?[^ ]*[.]#{pane_id} ([^ ]+) .*$/\2/:#{E:@attention_panes}}}'
set -g @attention_elsewhere '#{s/^[^ ]*[.]#{pane_id}$//:#{E:@attention_next}}'
set -g @attention_next_pane '#{s/^.*[.]//:#{E:@attention_next}}'
set -g @client_session_id '#{S:#{?#{==:#{session_name},#{client_session}},#{session_id},}}'
set -g @attention_next_here '#{m/r:(^| )#{s/^.([^.]*)[.].*$/\1/:#{E:@attention_next}}( |$),#{W:#{window_id} }}'
%hidden attention_jump="if-shell -F '#{E:@attention_elsewhere}' { \
  run-shell -C '#{?#{E:@attention_next_here},select-window -t \"\\#{E:@client_session_id}#{E:@attention_next}\" ; select-pane -t \"\\#{E:@client_session_id}#{E:@attention_next}\",switch-client -t \"#{E:@attention_next_pane}\" ; select-window -t \"#{E:@attention_next}\" ; select-pane -t \"#{E:@attention_next}\"}' \
} { \
  display-message 'Nothing else is waiting for attention' \
}"
bind -N "Jump to the next pane needing attention" a "$attention_jump"

# Start numbering at 1, close gaps on window close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# === Status Bar ===
set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left

# Colors (night-owl palette). The bar uses the editor line-highlight blue rather
# than the pane background so it reads as a tab strip instead of blending into
# the pane-border labels directly below it.
set -g status-style 'bg=#0b2942 fg=#8badc1'
set -g message-style 'bg=#1d3b53 fg=#d6deeb bold'
set -g mode-style 'bg=#1d3b53 fg=#d6deeb bold'
# Status messages render in the easily overlooked top row.
set -g display-time 2500

# Left: PREFIX indicator + session. ds sessions replace this with their own
# host-labelled copy, so keep shared mode indicators in the window tabs.
set -g status-left-length 80
set -g status-left '#{?client_prefix,#[fg=#011627 bg=#c792ea bold] PREFIX #[default] ,}#[fg=#82aaff][ #S ] #[default]'

# Right: other sessions wanting attention, then date + time. Per-pane paths
# live in the pane borders.
set -g status-right-length 120
# Each other session with a pane needing attention shows as its name and one
# dot in its most severe color, as in `build● notes●  Thu 12 Nov  14:03`:
# red sessions first, then yellow, then green, each in tmux's session order.
# The dots use prefix a's classes, which ignore focus: this client is not
# looking at another session, and the tab dots already cover its own. So a
# window shown in this session (a grouped peer shares them all) never counts
# for another one, and other windows count once, as for prefix a. One cheap
# pass over the other sessions' panes decides whether anything renders at
# all; only then does each of the three color passes scan a session's panes
# once (unmarked panes cost two option reads), and nothing renders while no
# other session needs attention.
# A name wider than 12 columns is cut to 11 and an ellipsis, and only then is
# each # doubled so the name cannot style the bar: q/h would escape first,
# and tmux 3.2 would count the doubled # in the cut.
# At most three sessions show, so they cannot crowd out the tabs, and +N
# counts the rest; the most severe are never the ones left out. The list is
# built once and cut by regexes alone, since formats cannot store a value:
# each entry ends in a unit separator (\037) and a record separator (\036)
# marks the end of the third, control characters tmux escapes in session
# names. Each of twelve steps turns the entry after the marker into an x, the
# remaining separators become spaces, and the run of x's becomes +N (+12+
# past twelve). The regexes avoid {n} intervals, since a } would end the
# format.
set -g @attention_separator "\037"
set -g @attention_marker "\036"
set -g @client_session_glob '#{s/([][*?\\])/\\\1/:client_session}'
set -g @window_counted_elsewhere '#{&&:#{E:@window_counted},#{!=:#{m:*#,#{E:@client_session_glob}#,*,#,#{window_linked_sessions_list}#,},1}}'
set -g @session_has_marks '#{W:#{?#{E:@window_counted_elsewhere},#{P:#{?#{E:@pane_has_marks},1,}},}}'
set -g @session_severity '#{s/^g+$/g/:#{s/^.*y.*$/y/:#{s/^.*r.*$/r/:#{W:#{?#{E:@window_counted_elsewhere},#{P:#{?#{E:@pane_has_marks},#{?#{E:@pane_jump_failed},r,#{?#{E:@pane_jump_waiting},y,#{?#{E:@pane_jump_done},g,}}},}},}}}}}'
set -g @session_attention_label '#[fg=#8badc1]#{s/(#)/\1\1/:#{?#{e|>|:#{w:session_name},12},#{=/11/…:session_name},#{session_name}}}'
set -g @other_session '#{!=:#{session_name},#{client_session}}'
set -g @other_sessions_marked '#{S:#{?#{E:@other_session},#{?#{E:@session_has_marks},.,},}}'
set -g @other_sessions_list '#{S:#{?#{E:@other_session},#{?#{==:#{E:@session_severity},r},#{E:@session_attention_label}#[fg=#ff5370]●#{@attention_separator},},}}#{S:#{?#{E:@other_session},#{?#{==:#{E:@session_severity},y},#{E:@session_attention_label}#[fg=#ffcb6b]●#{@attention_separator},},}}#{S:#{?#{E:@other_session},#{?#{==:#{E:@session_severity},g},#{E:@session_attention_label}#[fg=#22da6e]●#{@attention_separator},},}}'
set -g @other_sessions_shown '#{s/#{@attention_marker}$//:#{s/#{@attention_marker}x$/#[fg=#8badc1]+1 /:#{s/#{@attention_marker}xx$/#[fg=#8badc1]+2 /:#{s/#{@attention_marker}xxx$/#[fg=#8badc1]+3 /:#{s/#{@attention_marker}xxxx$/#[fg=#8badc1]+4 /:#{s/#{@attention_marker}xxxxx$/#[fg=#8badc1]+5 /:#{s/#{@attention_marker}xxxxxx$/#[fg=#8badc1]+6 /:#{s/#{@attention_marker}xxxxxxx$/#[fg=#8badc1]+7 /:#{s/#{@attention_marker}xxxxxxxx$/#[fg=#8badc1]+8 /:#{s/#{@attention_marker}xxxxxxxxx$/#[fg=#8badc1]+9 /:#{s/#{@attention_marker}xxxxxxxxxx$/#[fg=#8badc1]+10 /:#{s/#{@attention_marker}xxxxxxxxxxx$/#[fg=#8badc1]+11 /:#{s/#{@attention_marker}xxxxxxxxxxxx.*$/#[fg=#8badc1]+12+ /:#{s/#{@attention_separator}/ /:#{s/(#{@attention_marker}x*)[^#{@attention_separator}#{@attention_marker}]*#{@attention_separator}/\1x/:#{s/(#{@attention_marker}x*)[^#{@attention_separator}#{@attention_marker}]*#{@attention_separator}/\1x/:#{s/(#{@attention_marker}x*)[^#{@attention_separator}#{@attention_marker}]*#{@attention_separator}/\1x/:#{s/(#{@attention_marker}x*)[^#{@attention_separator}#{@attention_marker}]*#{@attention_separator}/\1x/:#{s/(#{@attention_marker}x*)[^#{@attention_separator}#{@attention_marker}]*#{@attention_separator}/\1x/:#{s/(#{@attention_marker}x*)[^#{@attention_separator}#{@attention_marker}]*#{@attention_separator}/\1x/:#{s/(#{@attention_marker}x*)[^#{@attention_separator}#{@attention_marker}]*#{@attention_separator}/\1x/:#{s/(#{@attention_marker}x*)[^#{@attention_separator}#{@attention_marker}]*#{@attention_separator}/\1x/:#{s/(#{@attention_marker}x*)[^#{@attention_separator}#{@attention_marker}]*#{@attention_separator}/\1x/:#{s/(#{@attention_marker}x*)[^#{@attention_separator}#{@attention_marker}]*#{@attention_separator}/\1x/:#{s/(#{@attention_marker}x*)[^#{@attention_separator}#{@attention_marker}]*#{@attention_separator}/\1x/:#{s/(#{@attention_marker}x*)[^#{@attention_separator}#{@attention_marker}]*#{@attention_separator}/\1x/:#{s/^([^#{@attention_separator}]*#{@attention_separator}[^#{@attention_separator}]*#{@attention_separator}[^#{@attention_separator}]*#{@attention_separator})/\1#{@attention_marker}/:#{E:@other_sessions_list}}}}}}}}}}}}}}}}}}}}}}}}}}}}'
set -g @other_sessions_attention '#{?#{E:@other_sessions_marked},#{E:@other_sessions_shown},}'
# tmux serializes each client-specific #() job. The existing status interval
# reconciles missed events even while another tmux window or SSH pane is hidden.
set -g status-right '#(term-pane-state --socket #{q:socket_path} --client #{q:client_name} --client-pid #{client_pid} --client-created #{client_created} 2>/dev/null)#{E:@other_sessions_attention} #[fg=#637777]%a %d %b  #[fg=#8badc1]%H:%M '
# tmux-tools' term-pane-mark publishes as soon as it changes a mark, rather
# than waiting for that job, where this option opts in; the hooks above
# publish on view changes.
set -g @term_pane_state_publish on

# Older configs started a server-owned helper that animated a working spinner
# in the tabs, and restarted it from an attach hook. Reloading does not remove
# hooks, so drop that one explicitly; the helper exits on its next check once
# its owner option is gone, so a reload retires it without a server restart.
set-hook -gu client-attached[130]
set -su @term_tab_spinner_owner
set -su @term_tab_spinner_frame

# Window tabs. Only the current tab is highlighted, in bright text with no
# fill; its format underlines the label and badges but not the padding
# spaces around them. The attention dots already say which background window wants
# you, so a window that rang the bell keeps the plain tab style; tmux's
# default status format skips a bell style set to default.
setw -g window-status-style 'fg=#8badc1'
setw -g window-status-current-style 'fg=#d6deeb bold'
setw -g window-status-bell-style default
setw -g window-status-separator ' '
# A pane is pending when its program asked for attention: tmux-tools'
# term-notify-sound (run by agent notification hooks) sets this pane option
# because tmux records a bell against a window, never the pane that rang. Its
# value is the kind of attention: done (a turn finished; the legacy value 1
# means the same), waiting (the agent needs an answer) or blocked (its turn
# died). tmux-tools' @term_notify_exit_status marks a failed shell command and
# only applies to kind done. The focus hooks above acknowledge done and failed
# marks on a visit; waiting and blocked are sticky and stay until the agent
# moves on.
# A pane back at a shell prompt cannot still be running the agent that set a
# sticky kind or @term_busy, so those marks stay hidden there, as busy always
# has; a done or failed mark still shows until you look.
set -g @pane_at_shell '#{m/r:^-?(zsh|bash|fish|sh)$,#{pane_current_command}}'
set -g @pane_sticky '#{m/r:^(waiting|blocked)$,#{@term_notify_pending}}'
set -g @pane_marked '#{&&:#{@term_notify_pending},#{||:#{!=:#{E:@pane_sticky},1},#{!=:#{E:@pane_at_shell},1}}}'
# Each marked pane has one effective state, the first of: red (a failed
# command or a blocked agent), yellow (waiting), green (any other kind). These
# marked predicates ignore focus; prefix a uses them to cycle.
set -g @pane_marked_failed '#{&&:#{E:@pane_marked},#{||:#{==:#{@term_notify_pending},blocked},#{&&:#{!=:#{E:@pane_sticky},1},#{>:#{@term_notify_exit_status},0}}}}'
set -g @pane_marked_waiting '#{&&:#{E:@pane_marked},#{==:#{@term_notify_pending},waiting}}'
# A pane you are focused on is already being looked at, so it never shows its
# attention; the termnav predicate is defined with the pane border options.
# That predicate ignores which window is current, and every window has an
# active pane, so also require the current window: an agent alone in a
# background window must still mark its tab.
set -g @pane_unseen '#{!=:#{&&:#{window_active},#{E:@termnav_pane_is_focused_leaf}},1}'
# tmux-tools' term-pane-state counts panes with these predicates, so they must
# keep its invariants: failed and waiting are disjoint subsets of pending.
set -g @pane_pending '#{&&:#{E:@pane_marked},#{E:@pane_unseen}}'
set -g @pane_failed '#{&&:#{E:@pane_marked_failed},#{E:@pane_unseen}}'
set -g @pane_waiting '#{&&:#{E:@pane_marked_waiting},#{E:@pane_unseen}}'
# A pane is busy while its agent works on a request: AgentGuard's lifecycle
# hooks set @term_busy through tmux-tools' term-pane-mark from a submitted
# prompt until the turn ends. A mark left by an agent killed mid-turn stays
# hidden at the shell prompt; it shows again under the next program in that
# pane until the next agent's turn ends. term-pane-state counts a busy pane as
# working only when it shows no attention, as the blue dot below does.
set -g @pane_busy '#{&&:#{@term_busy},#{!=:#{E:@pane_at_shell},1}}'
# Termnav leases a nested layer's summary on the pane that hosts it:
# @termnav_child_attention is expiry:working:pending:failed, where working
# counts only child panes without attention, and @termnav_child_waiting is
# expiry:N for the yellow subset of pending, written in the same command and
# removed when N is 0. The expiry is this host's epoch second. These dots
# accept exactly the leases tmux-tools' term-pane-state counts, so a tab and
# the published snapshot agree: a lease counts while it expires within the
# next 30 seconds, with counts of at most 100000 and failed <= pending, and a
# waiting count only beside such an attention lease and while it fits
# pending - failed. term-pane-state retires the rest on its next run. Green
# is what remains of pending after red and yellow.
# tmux ends a modifier list at its first colon, so the s/ field extractors
# match separators with dots; they only see leases that passed the shape
# check, and #{e|...} of anything else is empty, which reads as false.
set -g @child_clock '%s'
set -g @child_now '#{T:@child_clock}'
set -g @child_expiry '#{s/^([0-9]+).*$/\1/:#{@termnav_child_attention}}'
set -g @child_work '#{s/^[0-9]+.([0-9]+).*$/\1/:#{@termnav_child_attention}}'
set -g @child_pending '#{s/^[0-9]+.[0-9]+.([0-9]+).*$/\1/:#{@termnav_child_attention}}'
set -g @child_failures '#{s/^.*[^0-9]([0-9]+)$/\1/:#{@termnav_child_attention}}'
set -g @child_lease '#{&&:#{m/r:^[0-9]+:[0-9]+:[0-9]+:[0-9]+$,#{@termnav_child_attention}},#{&&:#{e|>|:#{E:@child_expiry},#{E:@child_now}},#{&&:#{e|<=|:#{E:@child_expiry},#{e|+|:#{E:@child_now},30}},#{&&:#{e|<=|:#{E:@child_work},100000},#{&&:#{e|<=|:#{E:@child_pending},100000},#{e|<=|:#{E:@child_failures},#{E:@child_pending}}}}}}}'
set -g @child_waits '#{s/^.*[^0-9]([0-9]+)$/\1/:#{@termnav_child_waiting}}'
set -g @child_waits_expiry '#{s/^([0-9]+).*$/\1/:#{@termnav_child_waiting}}'
set -g @child_working '#{&&:#{E:@child_lease},#{e|>|:#{E:@child_work},0}}'
set -g @child_failed '#{&&:#{E:@child_lease},#{e|>|:#{E:@child_failures},0}}'
set -g @child_waiting '#{&&:#{E:@child_lease},#{&&:#{m/r:^[0-9]+:[0-9]+$,#{@termnav_child_waiting}},#{&&:#{e|>|:#{E:@child_waits_expiry},#{E:@child_now}},#{&&:#{e|<=|:#{E:@child_waits_expiry},#{e|+|:#{E:@child_now},30}},#{&&:#{e|>|:#{E:@child_waits},0},#{e|<=|:#{E:@child_waits},#{e|-|:#{E:@child_pending},#{E:@child_failures}}}}}}}}'
set -g @child_done '#{&&:#{E:@child_lease},#{e|>|:#{e|-|:#{e|-|:#{E:@child_pending},#{E:@child_failures}},#{?#{E:@child_waiting},#{E:@child_waits},0}},0}}'
# Each pane's dots, local and leased. Keep local predicates separate: the
# publisher adds child counts once, while these display predicates include
# them for the containing tmux window too.
set -g @pane_display_failed '#{||:#{E:@pane_failed},#{E:@child_failed}}'
set -g @pane_display_waiting '#{||:#{E:@pane_waiting},#{E:@child_waiting}}'
set -g @pane_display_done '#{||:#{&&:#{E:@pane_pending},#{&&:#{!=:#{E:@pane_failed},1},#{!=:#{E:@pane_waiting},1}}},#{E:@child_done}}'
set -g @pane_display_busy '#{||:#{&&:#{E:@pane_busy},#{!=:#{E:@pane_pending},1}},#{E:@child_working}}'
# prefix a's classes: each pane once, by its most severe dot, ignoring focus.
set -g @pane_jump_failed '#{||:#{E:@pane_marked_failed},#{E:@child_failed}}'
set -g @pane_jump_waiting '#{&&:#{!=:#{E:@pane_jump_failed},1},#{||:#{E:@pane_marked_waiting},#{E:@child_waiting}}}'
set -g @pane_jump_done '#{&&:#{!=:#{E:@pane_jump_failed},1},#{&&:#{!=:#{E:@pane_jump_waiting},1},#{||:#{E:@pane_marked},#{E:@child_done}}}}'
# A tab shows one static dot per state present among its panes, most severe
# first: red, yellow, green, then blue for work with no attention. Unlike the
# bell flag, dots also show on the current window, where the agent beside your
# shell is waiting or working. The dots sit on the status-bar background so
# every color stays visible, and they turn the current tab's underline off.
# They come last, after the tab's closing space, so the highlighted region is
# just the tab label and its [Z] and [COPY] badges. The surrounding status
# format already owns tmux's single push-default slot.
set -g @window_dots '#{?#{P:#{?#{E:@pane_display_failed},1,}},#[fg=#ff5370]●,}#{?#{P:#{?#{E:@pane_display_waiting},1,}},#[fg=#ffcb6b]●,}#{?#{P:#{?#{E:@pane_display_done},1,}},#[fg=#22da6e]●,}#{?#{P:#{?#{E:@pane_display_busy},1,}},#[fg=#82aaff]●,}'
set -g @window_marker '#{?#{E:@window_dots},#[bg=#0b2942#,nounderscore]#{E:@window_dots}#[default],}'
setw -g window-status-format ' #I:#W#{?window_zoomed_flag, [Z],} #{E:@window_marker}'
setw -g window-status-current-format ' #[underscore]#I:#W#{?window_zoomed_flag, [Z],}#{?#{==:#{pane_mode},copy-mode}, [COPY],}#[nounderscore] #{E:@window_marker}'

# Pane and window labels. These formats share one notion of what a pane is
# running so the tab, the border, and nested tmux titles always agree.
#
# Sandboxes, SSH transports, and interpreters report a wrapper process name
# that says nothing about the app, so their labels come from the title the app
# set itself instead.
set -g @pane_wrapped '#{m/r:^(bwrap|termnav|ssh|mosh-client|et|node|python3?)$,#{pane_current_command}}'
# A title is meaningful only when the app chose it. tmux defaults pane titles to
# the hostname, and some apps echo their command or directory name. Keep these
# host comparisons out of pane-border-format itself: ds strips host literals
# from that option to avoid repeating its own host label.
set -g @pane_titled '#{&&:#{!=:#{pane_title},},#{&&:#{!=:#{pane_title},#{host}},#{&&:#{!=:#{pane_title},#{host_short}},#{&&:#{!=:#{pane_title},#{pane_current_command}},#{!=:#{pane_title},#{b:pane_current_path}}}}}}'
# Titles come from any process in the pane, including remote output, and tmux
# reads #[...] in drawn labels as styling. q/h doubles every # so a title can
# only ever render as text.
# The agents AgentGuard integrates; keep this list in step with AgentGuard's.
set -g @agent_names 'claude|codex|gemini|grok|muse|opencode'
# Some agents run a versioned binary whose name changes on every upgrade, such
# as muse-bin-1.4.3-R5018.1 or grok-1.0.50-linux-x86_64. Reduce an agent name
# followed by -bin and/or any version-like suffix (a digit, optionally after
# v or R) to the bare agent, so labels and tab names survive upgrades. The
# same rule covers macOS, which reports only 15 characters (muse-bin-1.4.3-).
# Other commands keep their full spelling.
set -g @pane_command '#{s/^(#{@agent_names})(-bin)?(-[vVrR]?[0-9].*)?$/\1/:pane_current_command}'
set -g @pane_app '#{?#{&&:#{E:@pane_wrapped},#{E:@pane_titled}},#{q/h;=/20/…:pane_title},#{E:@pane_command}}'
# Interactive apps (agents, editors, nested tmux) capture the mouse; shells and
# short-lived commands such as git, make, and less do not. That one signal names
# windows by what they host without flickering when a side shell runs a command.
# Shell widgets (fzf history search, fzf-tab completion) briefly enable mouse
# reporting while the shell stays the foreground command, so shells and pickers
# never count even when the flag is set.
# Some agents (muse) draw inline without mouse reporting or the alternate
# screen, leaving tmux no terminal signal, so known agents always count.
set -g @pane_agent '#{m/r:^(#{@agent_names})$,#{E:@pane_command}}'
# A sticky attention kind (waiting, blocked) outlives a visit only while the
# agent that set it may still run in the pane. An agent started through a
# sandbox or interpreter reports the wrapper's name instead of its own, so a
# wrapper keeps the mark too; a shell or any other program proves it is gone.
set -g @pane_keeps_sticky '#{||:#{E:@pane_agent},#{E:@pane_wrapped}}'
set -g @pane_interactive '#{?#{m/r:^-?(zsh|bash|fish|sh|fzf|less)$,#{pane_current_command}},0,#{||:#{mouse_any_flag},#{E:@pane_agent}}}'
# Every interactive app in the window, in pane order, regardless of focus.
set -g @window_apps '#{P:#{?#{E:@pane_interactive},#{E:@pane_app} ,}}'

# Windows name themselves after their interactive apps, or after the active
# pane's directory when only shells are open. A manual rename (prefix ,) turns
# automatic naming off for that window, so chosen names stay put. allow-rename
# stays off so apps cannot rename windows behind this rule's back.
setw -g automatic-rename on
setw -g automatic-rename-format '#{=/20/…:#{?#{!=:#{E:@window_apps},},#{s/ $//:#{E:@window_apps}},#{b:pane_current_path}}}'
set -g allow-rename off

# Publish host:session as the terminal title. A nested tmux reached over SSH
# then titles its parent pane, which is how the outer layer labels that pane
# and window with the remote host. Matches ds's own host label.
set -g set-titles on
set -g set-titles-string '#{?@hostname_alias,#{@hostname_alias},#{host_short}}:#S'

# Pane borders
set -g pane-border-status top
# A pane is the focused leaf only when it is active for this exact client, the
# client itself has terminal focus, and no focused nested tmux has claimed the
# pane as its parent. Border and label formats have the client context needed
# to evaluate the complete predicate independently for every attachment.
set -g @termnav_pane_is_focused_leaf '#{&&:#{pane_active},#{&&:#{m:*focused*,#{client_flags}},#{==:#{@termnav_child_focus},}}}'
# Interactive panes show the app plus its own title (an agent's task, an
# editor's file); shells show their directory. Keep inactive labels readable in
# terminals without VS Code's contrast correction.
# Home-relative directory. Compare whole path components so /home/chrisx is
# not shown as ~x, and show the plain path if the server has no HOME.
set -g @pane_dir '#{?#{HOME},#{?#{==:#{pane_current_path},#{HOME}},~,#{s|^#{HOME}/|~/|:pane_current_path}},#{pane_current_path}}'
set -g @pane_label '#{?#{E:@pane_interactive},#{E:@pane_app}#{?#{&&:#{!=:#{E:@pane_wrapped},1},#{E:@pane_titled}}, · #{q/h;=/40/…:pane_title},},#{pane_current_command} · #{E:@pane_dir}}'
# The pane's most severe dot, in the tab colors, leads its label; a failed
# command adds its exit status after the red dot. Visiting the pane
# acknowledges done and failed attention as described with the focus hooks.
# The marker never renders on the focused leaf (a nested layer's lease is not
# hidden by focus the way local attention is), so it always follows the dim
# label style and can restore that style explicitly after the marker.
set -g @pane_dot '#{?#{E:@pane_display_failed},#[fg=#ff5370#,bold]●#{?#{&&:#{E:@pane_failed},#{!=:#{@term_notify_pending},blocked}}, exit #{@term_notify_exit_status},},#{?#{E:@pane_display_waiting},#[fg=#ffcb6b#,bold]●,#{?#{E:@pane_display_done},#[fg=#22da6e#,bold]●,#{?#{E:@pane_display_busy},#[fg=#82aaff#,bold]●,}}}}'
set -g @pane_pending_marker '#{?#{E:@termnav_pane_is_focused_leaf},,#{?#{E:@pane_dot},#{E:@pane_dot}#[fg=#898989#,nobold] ,}}'
# Every label leads with the pane's command targets: window.pane, the readable
# target for commands such as `tmux send-keys -t 2.1`, and the stable %pane_id
# in parentheses, which survives renumbering and moves between windows.
set -g pane-border-format '#{?#{E:@termnav_pane_is_focused_leaf},,#[fg=#898989]} #I.#P (#{pane_id})  #{E:@pane_pending_marker}#{E:@pane_label} '
setw -g pane-border-style 'fg=#333333'
setw -g pane-active-border-style '#{?#{E:@termnav_pane_is_focused_leaf},fg=cyan#,bold,fg=#333333}'
# tmux 3.6b can spin in scrollbar drawing after a client resize (tmux#4932).
# Keep copy mode available without entering the affected rendering path.
set -g pane-scrollbars off

# New panes and windows start where the current pane is, so splitting from a
# shell in a repo opens another shell in that repo.
bind -N "Split top and bottom in the current directory" '"' split-window -v -c '#{pane_current_path}'
bind -N "Split side by side in the current directory" % split-window -h -c '#{pane_current_path}'
bind -N "Open a window in the current directory" c new-window -c '#{pane_current_path}'
# prefix X closes the whole window, panes and all, as tmux's prefix & does: the
# capital of prefix x (close the pane), asking first in the same way.
bind -N "Close this window and all its panes" X confirm-before -p "kill-window #W? (y/n)" kill-window

# Move panes between windows. prefix ! (tmux default) breaks the current pane
# out into its own window; prefix j sends it into a chosen window and prefix J
# pulls a chosen pane in beside it, so a pane can be popped out and put back.
# Both join side by side, which suits wide terminals. The tree starts at window
# level for sending, since the destination is a window, and fully expanded for
# pulling, where the live previews identify the pane.
bind -N "Send this pane to a chosen window" j choose-tree -Zw "join-pane -h -t '%%'"
bind -N "Pull a chosen pane into this window" J choose-tree -Z "join-pane -h -s '%%'"

# Dim inactive panes (night-owl palette, 40% dimmed)
set -g window-style 'bg=#010d17'
# Unlike border formats, tmux compiles pane content styles without a client
# context and does not reevaluate them when a pane user option changes. Keep the
# normal active style literal so tmux paints the chosen background. Termnav
# temporarily installs this configured inactive style as a pane-local override
# for unfocused leaves and focused-child containers, then restores the prior
# override when that pane becomes the focused leaf again.
set -g @termnav_inactive_style 'bg=#010d17'
set -g window-active-style 'bg=#021c30'

# Right/left navigate panes if vertical splits exist, otherwise switch windows
bind -N "Select the right pane or next window" Right if-shell -F '#{e|<:#{pane_width},#{window_width}}' 'select-pane -R' 'next-window'
bind -N "Select the left pane or previous window" Left  if-shell -F '#{e|<:#{pane_width},#{window_width}}' 'select-pane -L' 'previous-window'

# Move between tabs and panes across editor, nested-tmux, and remote layers.
# A chord goes inward when the pane's foreground app owns it: Vim, Neovim, and
# fzf always (fzf lists use Ctrl-j/k), and SSH, mosh, ET, or a nested tmux only
# while the inner side has mouse reporting on. Otherwise this tmux handles it,
# and at its edge Termnav routes the gesture to the parent layer. The *_native
# checks read tmux's own pane metadata; the ps fallbacks see an owner behind a
# wrapper or pipeline, trusting only the pane's foreground process group.
%hidden is_vim_native="#{m/r:^g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}"
%hidden is_terminal_app_native="#{||:#{m/r:^(g?(view|l?n?vim?x?|fzf)(diff)?|ssh|mosh|mosh-client|mosh-server|et)$,#{pane_current_command}},#{&&:#{mouse_any_flag},#{m/r:^(tmux|screen)(:.*)?$,#{pane_current_command}}}}"
%hidden is_terminal_app="ps -o state= -o ucomm= -o pgid= -o tpgid= -t '#{pane_tty}' | awk -v mouse='#{mouse_any_flag}' '\$1 !~ /^[TXZ]/ && \$(NF-1) == \$(NF) && (\$2 ~ /^(g?(view|l?n?vim?x?|fzf)(diff)?|ssh|mosh|mosh-client|mosh-server|et)$/ || (mouse == 1 && \$2 ~ /^(tmux|screen):?$/)) { found = 1 } END { exit !found }'"
%hidden is_pane_navigation_native="#{||:$is_vim_native,#{&&:#{mouse_any_flag},$is_terminal_app_native}}"
%hidden is_pane_navigation="ps -o state= -o ucomm= -o pgid= -o tpgid= -t '#{pane_tty}' | awk -v mouse='#{mouse_any_flag}' '\$1 !~ /^[TXZ]/ && \$(NF-1) == \$(NF) && (\$2 ~ /^g?(view|l?n?vim?x?|fzf)(diff)?$/ || (mouse == 1 && \$2 ~ /^(ssh|mosh|mosh-client|mosh-server|et|tmux|screen):?$/)) { found = 1 } END { exit !found }'"
%hidden navigate_origin_args="--client-pid #{client_pid} --client-tty #{q:client_tty} --client-created #{client_created} --client-termtype #{q:client_termtype} --source-socket #{q:socket_path} --source-pane #{pane_id} --source-session #{q:session_id}"
# Termnav exits 3 when no scope can perform a gesture, such as moving a pane
# or tab past the outermost edge. That is the expected no-op, but tmux reports
# any nonzero run-shell status as an error, so end every Termnav route with
# this to keep only real failures (and their exact status) visible.
%hidden navigate_declined_ok='|| { status=$?; [ "$status" -eq 3 ] || exit "$status"; }'
%hidden send_ctrl_tab="send-keys Escape '[9;5u'"
%hidden send_ctrl_shift_tab="send-keys Escape '[9;6u'"
%hidden send_alt_shift_left_bracket="send-keys Escape '{'"
%hidden send_alt_shift_right_bracket="send-keys Escape '}'"
# Boundary actions start at the parent; host-local pane movement starts in
# this tmux scope.
%hidden move_parent_tab_left="run-shell '~/.local/bin/termnav navigate tab-move left --parent $navigate_origin_args $navigate_declined_ok'"
%hidden move_parent_tab_right="run-shell '~/.local/bin/termnav navigate tab-move right --parent $navigate_origin_args $navigate_declined_ok'"
%hidden switch_tab_next="run-shell '~/.local/bin/termnav navigate tab-select next --parent $navigate_origin_args $navigate_declined_ok'"
%hidden switch_tab_previous="run-shell '~/.local/bin/termnav navigate tab-select previous --parent $navigate_origin_args $navigate_declined_ok'"
%hidden select_parent_pane_left="run-shell '~/.local/bin/termnav navigate pane-select left --parent $navigate_origin_args $navigate_declined_ok'"
%hidden select_parent_pane_down="run-shell '~/.local/bin/termnav navigate pane-select down --parent $navigate_origin_args $navigate_declined_ok'"
%hidden select_parent_pane_up="run-shell '~/.local/bin/termnav navigate pane-select up --parent $navigate_origin_args $navigate_declined_ok'"
%hidden select_parent_pane_right="run-shell '~/.local/bin/termnav navigate pane-select right --parent $navigate_origin_args $navigate_declined_ok'"
%hidden move_pane_left="run-shell '~/.local/bin/termnav navigate pane-move left $navigate_origin_args $navigate_declined_ok'"
%hidden move_pane_down="run-shell '~/.local/bin/termnav navigate pane-move down $navigate_origin_args $navigate_declined_ok'"
%hidden move_pane_up="run-shell '~/.local/bin/termnav navigate pane-move up $navigate_origin_args $navigate_declined_ok'"
%hidden move_pane_right="run-shell '~/.local/bin/termnav navigate pane-move right $navigate_origin_args $navigate_declined_ok'"
unbind-key -n M-Tab
unbind-key -n M-BTab
bind-key -N "Move the tab left across terminal layers" -n 'M-{' if-shell -F "$is_terminal_app_native" "$send_alt_shift_left_bracket" { if-shell "$is_terminal_app" "$send_alt_shift_left_bracket" { if-shell -F '#{==:#{session_windows},1}' "$move_parent_tab_left" { if-shell -F '#{>:#{window_index},#{base-index}}' 'swap-window -d -t :-' 'display-message -p ""' } } }
bind-key -N "Move the tab right across terminal layers" -n 'M-}' if-shell -F "$is_terminal_app_native" "$send_alt_shift_right_bracket" { if-shell "$is_terminal_app" "$send_alt_shift_right_bracket" { if-shell -F '#{==:#{session_windows},1}' "$move_parent_tab_right" { if-shell -F '#{<:#{window_index},#{e|+:#{base-index},#{e|-:#{session_windows},1}}}' 'swap-window -d -t :+' 'display-message -p ""' } } }

bind-key -N "Select the next tab across terminal layers" -n C-Tab if-shell -F "$is_pane_navigation_native" "$send_ctrl_tab" { if-shell "$is_pane_navigation" "$send_ctrl_tab" { if-shell -F '#{>:#{session_windows},1}' 'next-window' "$switch_tab_next" } }
bind-key -N "Select the previous tab across terminal layers" -n C-BTab if-shell -F "$is_pane_navigation_native" "$send_ctrl_shift_tab" { if-shell "$is_pane_navigation" "$send_ctrl_shift_tab" { if-shell -F '#{>:#{session_windows},1}' 'previous-window' "$switch_tab_previous" } }
bind-key -N "Navigate left across editor and terminal panes" -n 'C-h' if-shell -F "$is_pane_navigation_native" 'send-keys C-h' { if-shell "$is_pane_navigation" 'send-keys C-h' { if-shell -F '#{pane_at_left}' "$select_parent_pane_left" 'select-pane -L' } }
bind-key -N "Navigate down across editor and terminal panes" -n 'C-j' if-shell -F "$is_pane_navigation_native" 'send-keys C-j' { if-shell "$is_pane_navigation" 'send-keys C-j' { if-shell -F '#{pane_at_bottom}' "$select_parent_pane_down" 'select-pane -D' } }
bind-key -N "Navigate up across editor and terminal panes" -n 'C-k' if-shell -F "$is_pane_navigation_native" 'send-keys C-k' { if-shell "$is_pane_navigation" 'send-keys C-k' { if-shell -F '#{pane_at_top}' "$select_parent_pane_up" 'select-pane -U' } }
bind-key -N "Navigate right across editor and terminal panes" -n 'C-l' if-shell -F "$is_pane_navigation_native" 'send-keys C-l' { if-shell "$is_pane_navigation" 'send-keys C-l' { if-shell -F '#{pane_at_right}' "$select_parent_pane_right" 'select-pane -R' } }
bind-key -N "Move the pane left across terminal layers" -n 'M-H' if-shell -F "$is_pane_navigation_native" "send-keys Escape 'H'" { if-shell "$is_pane_navigation" "send-keys Escape 'H'" "$move_pane_left" }
bind-key -N "Move the pane down across terminal layers" -n 'M-J' if-shell -F "$is_pane_navigation_native" "send-keys Escape 'J'" { if-shell "$is_pane_navigation" "send-keys Escape 'J'" "$move_pane_down" }
bind-key -N "Move the pane up across terminal layers" -n 'M-K' if-shell -F "$is_pane_navigation_native" "send-keys Escape 'K'" { if-shell "$is_pane_navigation" "send-keys Escape 'K'" "$move_pane_up" }
bind-key -N "Move the pane right across terminal layers" -n 'M-L' if-shell -F "$is_pane_navigation_native" "send-keys Escape 'L'" { if-shell "$is_pane_navigation" "send-keys Escape 'L'" "$move_pane_right" }
bind-key -N "Return to the previous pane or editor split" -n 'C-\' if-shell -F "$is_pane_navigation_native" 'send-keys C-\\' { if-shell "$is_pane_navigation" 'send-keys C-\\' 'select-pane -l' }

# A URL the terminal cannot take falls back to $BROWSER in Termnav's run-shell
# job, which reads tmux's global environment, not shell startup files. Publish
# the opener shell startup (env.d) chooses from that environment, so the
# fallback opens links the way programs in the panes do. A marker separates
# the value from anything startup files print; -b keeps the shell off the load
# path, and #{default-shell} names it because tmux 3.5 gives run-shell jobs
# SHELL=/bin/sh.
run-shell -b "out=\$(#{q:default-shell} -c 'printf \"\\n__dot_browser__=%s\" \"\${BROWSER-}\"' </dev/null 2>/dev/null) || exit 0; browser=\${out####*__dot_browser__=}; case \$browser in *'
'*) exit 0 ;; esac; if [ -n \"\$browser\" ]; then tmux set-environment -g BROWSER \"\$browser\"; else tmux set-environment -gu BROWSER; fi"

# Ctrl-click follows the link under the pointer: Termnav opens a URL in the
# browser on the desktop running the terminal, or a file in a running Neovim,
# and says so when it cannot. A pane whose app has mouse reporting on keeps the
# click when it can act on it itself: Neovim uses the position for LSP-aware
# navigation, and a nested tmux or SSH session decides at its own layer.
# Termnav takes the click anyway when:
# - the pane runs a known agent (@pane_agent), so links and file paths in its
#   output behave as in a shell: Codex ignores the click, and Claude opens only
#   URLs, through $BROWSER on the host it runs on;
# - the pane is in a mode such as copy mode, which shows tmux's history rather
#   than the app's screen;
# - the cell carries an OSC 8 browser link. A URL opens on the same desktop
#   whichever layer resolves it, so the outermost tmux takes it instead of
#   relying on a nested layer's config and delivery. File links stay with the
#   app, which knows their host and directory. tmux before 3.4 has no
#   mouse_hyperlink, so this term is always false there.
# Drag skips the link term, so a drag that starts off a link is not split
# between tmux and the app as the pointer crosses linked cells; one that
# starts on a link goes to tmux for the press and to the app afterwards. A
# drag termnav owns does nothing. A fast second or third press keeps the
# click's owner, so the app never sees a lone press. Only 2-operand || keeps
# the formats valid on tmux 3.2.
set -g @click_browser_link '#{m/r:^(https?|mailto):,#{mouse_hyperlink}}'
set -g @pane_keeps_ctrl_mouse '#{?#{||:#{pane_in_mode},#{E:@pane_agent}},0,#{mouse_any_flag}}'
set -g @pane_keeps_ctrl_click '#{?#{E:@click_browser_link},0,#{E:@pane_keeps_ctrl_mouse}}'
bind-key -n C-MouseDown1Pane if-shell -F '#{E:@pane_keeps_ctrl_click}' 'send-keys -M' 'select-pane -t ='
bind-key -n C-MouseDrag1Pane if-shell -F '#{E:@pane_keeps_ctrl_mouse}' 'send-keys -M' 'select-pane -t ='
bind-key -n C-MouseDragEnd1Pane if-shell -F '#{E:@pane_keeps_ctrl_mouse}' 'send-keys -M' 'select-pane -t ='
bind-key -n C-SecondClick1Pane if-shell -F '#{E:@pane_keeps_ctrl_click}' 'send-keys -M' 'select-pane -t ='
bind-key -n C-TripleClick1Pane if-shell -F '#{E:@pane_keeps_ctrl_click}' 'send-keys -M' 'select-pane -t ='
bind-key -n C-MouseUp1Pane if-shell -F '#{E:@pane_keeps_ctrl_click}' 'send-keys -M' 'run-shell -b "~/.local/bin/termnav tmux follow-click --stdin <<\"__DOT_TMUX_CLICK__\"\n#{mouse_hyperlink}\n#{mouse_word}\n#{mouse_line}\n#{mouse_x}\n#{pane_current_path}\n#{client_tty}\n#{pane_id}\n#{mouse_y}\n#{pane_top}\n#{pane_left}\n#{socket_path}\n__DOT_TMUX_CLICK__"'
# User8 carries a commit inward between nested tmux layers. User9 through
# User13 consume every legal outer-terminal response to Termnav's DECRQM
# barrier. Foreground run-shell (no -b) pauses that client's input until the
# per-client FIFO directive is claimed and executed. If no directive is
# pending, terminal response keys are passed back to the originating pane so
# applications remain compatible with tmux releases that do not virtualize
# DECRQM. Per-client FIFO (seq-ordered) prevents cross-client consumption.
# A tmux socket is normally a simple /tmp path, but -L/-S and custom socket
# directories may contain shell metacharacters. q: keeps the expanded path one
# argv value when run-shell evaluates this command through the user's shell.
bind-key -n User8 run-shell '~/.local/bin/termnav relay commit --tmux-socket #{q:socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --client-created #{client_created}'
bind-key -n User9 run-shell '~/.local/bin/termnav relay commit --tmux-socket #{q:socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --client-created #{client_created} --passthrough-decrqm 0 --pane #{pane_id}'
bind-key -n User10 run-shell '~/.local/bin/termnav relay commit --tmux-socket #{q:socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --client-created #{client_created} --passthrough-decrqm 1 --pane #{pane_id}'
bind-key -n User11 run-shell '~/.local/bin/termnav relay commit --tmux-socket #{q:socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --client-created #{client_created} --passthrough-decrqm 2 --pane #{pane_id}'
bind-key -n User12 run-shell '~/.local/bin/termnav relay commit --tmux-socket #{q:socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --client-created #{client_created} --passthrough-decrqm 3 --pane #{pane_id}'
bind-key -n User13 run-shell '~/.local/bin/termnav relay commit --tmux-socket #{q:socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --client-created #{client_created} --passthrough-decrqm 4 --pane #{pane_id}'

# Ctrl-V image paste. After staging a clipboard image for a tmux pane, WezTerm
# sends User14, and each tmux layer routes it once:
# - a pane in a mode, or a window with synchronized panes, declines, so the
#   trigger and the transfer behind it never reach an application or several
#   panes at once;
# - SSH, ET or a nested tmux with mouse reporting on carries it inward. Unlike
#   pane navigation, a local editor or fzf never receives it: only a tmux
#   layer can run the receiver. Over SSH/ET, mouse reporting cannot tell a
#   remote tmux from a remote editor, which then gets the trigger as input
#   (a documented limitation; see the README);
# - mosh, and SSH or ET with mouse reporting off (no tmux on the far side),
#   decline with a message;
# - otherwise this tmux is innermost and opens Termnav's receiver in a popup
#   for the active pane and this exact client. It saves the image and pastes
#   its path into the pane.
# As for navigation, the *_native checks read tmux's pane metadata and the ps
# fallbacks see a transport behind a wrapper in the foreground process group.
# display-popup does not expand formats in its command, so run-shell expands
# them and passes the receiver as argv. tmux 3.2 has no popup titles.
%hidden is_image_paste_inward_native="#{&&:#{mouse_any_flag},#{m/r:^(ssh|et|tmux(:.*)?)$,#{pane_current_command}}}"
%hidden is_image_paste_inward="ps -o state= -o ucomm= -o pgid= -o tpgid= -t '#{pane_tty}' | awk -v mouse='#{mouse_any_flag}' '\$1 !~ /^[TXZ]/ && \$(NF-1) == \$(NF) && mouse == 1 && \$2 ~ /^(ssh|et|tmux:?)$/ { found = 1 } END { exit !found }'"
%hidden is_image_paste_mosh_native="#{m/r:^(mosh|mosh-client)$,#{pane_current_command}}"
%hidden is_image_paste_mosh="ps -o state= -o ucomm= -o pgid= -o tpgid= -t '#{pane_tty}' | awk -v mouse='#{mouse_any_flag}' '\$1 !~ /^[TXZ]/ && \$(NF-1) == \$(NF) && \$2 ~ /^(mosh|mosh-client)$/ { found = 1 } END { exit !found }'"
%hidden is_image_paste_remote_native="#{&&:#{!=:#{mouse_any_flag},1},#{m/r:^(ssh|et)$,#{pane_current_command}}}"
%hidden is_image_paste_remote="ps -o state= -o ucomm= -o pgid= -o tpgid= -t '#{pane_tty}' | awk -v mouse='#{mouse_any_flag}' '\$1 !~ /^[TXZ]/ && \$(NF-1) == \$(NF) && mouse != 1 && \$2 ~ /^(ssh|et)$/ { found = 1 } END { exit !found }'"
%hidden send_image_paste="send-keys -H 1b 5b 37 37 37 30 31 30 75"
%hidden image_paste_busy="display-message 'Image paste is off in copy mode and synchronized panes'"
%hidden image_paste_mosh="display-message 'Image paste does not work over mosh'"
%hidden image_paste_remote="display-message 'Image paste needs tmux on the remote host'"
# The receiver exits 1 after telling the user why nothing was pasted, and 130
# when interrupted; keep those quiet so tmux does not open its output view
# mode over the pane. Other statuses, such as a Termnav too old to know the
# command, stay visible. tmux's own errors also exit 1, so its stderr joins
# the output run-shell shows (the receiver itself writes only to the popup).
%hidden image_paste_receive_ok='|| { status=$?; [ "$status" -eq 1 ] || [ "$status" -eq 130 ] || exit "$status"; }'
%hidden image_paste_popup_title='#{?#{m/r:^3\.[0-2][a-z]*$,#{version}},,-T " Pasting image "}'
%hidden image_paste_receive="run-shell 'tmux display-popup -c #{q:client_name} -E -w 50 -h 5 $image_paste_popup_title ~/.local/bin/termnav paste-image receive --target-pane #{pane_id} --client-name #{q:client_name} --client-pid #{client_pid} --client-tty #{q:client_tty} 2>&1 $image_paste_receive_ok'"
%hidden image_paste_no_termnav="display-message 'Image paste needs termnav on this host'"
bind-key -n User14 if-shell -F '#{||:#{pane_in_mode},#{synchronize-panes}}' "$image_paste_busy" { if-shell -F "$is_image_paste_inward_native" "$send_image_paste" { if-shell -F "$is_image_paste_mosh_native" "$image_paste_mosh" { if-shell -F "$is_image_paste_remote_native" "$image_paste_remote" { if-shell "$is_image_paste_inward" "$send_image_paste" { if-shell "$is_image_paste_mosh" "$image_paste_mosh" { if-shell "$is_image_paste_remote" "$image_paste_remote" { if-shell 'test -x ~/.local/bin/termnav' "$image_paste_receive" "$image_paste_no_termnav" } } } } } } }

# === Copy Mode ===
# Double-click and triple-click call copy-pipe-and-cancel with no command.
# copy-command is that default, so those copies record clipboard history
# through clip. Enter and Ctrl-c pass the same command explicitly.
set -g copy-command 'clip capture --history-only'

# Don't copy on mouse release — stay in copy mode with selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Escape exits copy mode without copying.
bind -T copy-mode-vi Escape send-keys -X cancel

# Ctrl-c copies through tmux's OSC 52 path and records history. clip capture
# also mirrors to a local macOS, Wayland, or X11 clipboard, but deliberately
# succeeds on remote hosts where OSC 52 is the only available path.
bind -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel "clip capture --history-only"
# Keep Enter equivalent to Ctrl-c so keyboard and mouse-selected text both use
# the same remote-safe OSC 52 route and clipboard history.
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip capture --history-only"
# Vim-style select and yank over the same route. Ctrl-v keeps rectangle mode.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip capture --history-only"

# Match desktop-editor selection behavior without changing normal pane input.
# The first modified-arrow creates an anchor; further presses move the active
# end so the selection grows or shrinks naturally in either direction.
bind -T copy-mode-vi S-Left if -F '#{selection_active}' 'send-keys -X cursor-left' { send-keys -X begin-selection \; send-keys -X cursor-left }
bind -T copy-mode-vi S-Right if -F '#{selection_active}' 'send-keys -X cursor-right' { send-keys -X begin-selection \; send-keys -X cursor-right }
bind -T copy-mode-vi S-Up if -F '#{selection_active}' 'send-keys -X cursor-up' { send-keys -X begin-selection \; send-keys -X cursor-up }
bind -T copy-mode-vi S-Down if -F '#{selection_active}' 'send-keys -X cursor-down' { send-keys -X begin-selection \; send-keys -X cursor-down }
bind -T copy-mode-vi C-S-Left if -F '#{selection_active}' 'send-keys -X previous-word' { send-keys -X begin-selection \; send-keys -X previous-word }
bind -T copy-mode-vi C-S-Right if -F '#{selection_active}' 'send-keys -X next-word-end' { send-keys -X begin-selection \; send-keys -X next-word-end }

# Jump between commands. The shell prompt marks each prompt start (OSC 133;A,
# see 60-prompt.zsh/.bash), and tmux 3.4+ moves between marked lines; older
# releases report the copy-mode command as unknown. prefix k opens copy mode
# on the last command's prompt: the cursor starts on the second line of the
# two-line shell prompt, so stepping up a line onto the current prompt's mark
# first makes previous-prompt pass it. [ and ] step to the previous or next
# prompt.
bind -N "Scroll back to the last command" k copy-mode \; send-keys -X cursor-up \; send-keys -X previous-prompt
bind -T copy-mode-vi [ send-keys -X previous-prompt
bind -T copy-mode-vi ] send-keys -X next-prompt

# VS Code and WezTerm intercept Ctrl-v and paste from the client clipboard,
# which is the only reliable path on a remote host. This binding is the local
# fallback for terminals that pass Ctrl-v through to tmux.
bind -n C-v run 'clip paste --paste-pane #{pane_id}'
bind-key -N "Paste from the clipboard" -n C-v

# Left-click repositions cursor in copy mode (keeps mode active for long selections)
bind -T copy-mode-vi MouseDown1Pane if -F '#{selection_active}' 'send-keys -X cancel' 'send-keys -X clear-selection'
# Right-click exits copy mode without copying
bind -T copy-mode-vi MouseDown3Pane send-keys -X cancel

# Copy last command output to clipboard (pane-aware, works with splits). A
# run-shell job has no TMUX_PANE, so tmux would resolve the script's untargeted
# capture against the most recently active session, which another client may
# have just used; pass the pressing pane explicitly. The pane menu runs the
# same commands (see Menus).
%hidden copy_last_output="run-shell 'tmux-copy-last-output --pane #{pane_id} --client #{q:client_name}'"
%hidden copy_last_outputs="command-prompt -p 'Copy last N commands:' 'run-shell \"tmux-copy-last-output --pane #{pane_id} --client #{q:client_name} %1\"'"
bind -N "Copy the last command output" o "$copy_last_output"
bind -N "Copy the last N command outputs" O "$copy_last_outputs"

# prefix A pastes the last command output of this shell pane into the window's
# agent and focuses it: the usual next step after a test fails in a side shell.
# The agent is the first agent pane in pane order, found by a pure format like
# @pending_panes. Bracketed paste (-p) lets the agent take it as one pasted
# block rather than typed lines. An agent pane has no command blocks of its own,
# so pressing it there only explains why. tmux-copy-last-output exits 3 after
# reporting an empty result itself; any other failure, such as an older
# tmux-copy-last-output without --print, is reported here because run-shell
# drops stderr. An agent pane left in copy mode would take the paste
# unbracketed, as typed lines, so its mode is cancelled first. TMUX_PANE, as
# for prefix o, keeps the capture and any message on the pressing pane's
# session.
set -g @agent_panes '#{P:#{?#{E:@pane_agent},#{pane_id} ,}}'
bind -N "Paste the last command output into this window's agent" A if-shell -F '#{E:@pane_agent}' {
  display-message 'Press prefix A in a shell pane beside the agent'
} {
  if-shell -F '#{E:@agent_panes}' {
    run-shell 'export TMUX_PANE=#{pane_id}; out=$(tmux-copy-last-output --print); status=$?; if [ "$status" -ne 0 ]; then [ "$status" -eq 3 ] || tmux display-message "tmux-copy-last-output --print failed with status $status"; exit 0; fi; agent="#{s/ .*//:#{E:@agent_panes}}"; tmux send-keys -t "$agent" -X cancel 2>/dev/null; printf "%s" "$out" | tmux load-buffer -b agent-paste - && tmux paste-buffer -p -d -b agent-paste -t "$agent" && tmux select-pane -t "$agent"'
  } {
    display-message 'No agent in this window'
  }
}

# Retire the old manual tmux-tools exporter on already-running servers. Merely
# deleting its bind command would leave a stale prefix+S binding active after
# dot update reloads this file. prefix+R, which once restored, now reloads.
unbind S
bind -N "Reload the tmux configuration" R source-file "$HOME/.config/tmux/tmux.conf" \; display-message 'tmux config reloaded'

# === Clipboard History ===
# Pick from clip history and paste into current pane: prefix+P
# Each picker owns its private handoff and pastes into the captured source pane.
# Capture source identity before creating the popup: the popup's own shell
# has no pane_id, so expanding it there silently loses the paste destination.
# Empty history and fzf cancellation are expected. Propagating 3 or 130 makes tmux
# enter its output view mode, consuming the next keys meant for the program.
# The pane menu runs the same command (see Menus).
%hidden clip_pick_quiet_ok='|| { status=$?; [ "$status" -eq 3 ] || [ "$status" -eq 130 ] || exit "$status"; }'
%hidden clip_pick_paste="run-shell 'tmux display-popup -c #{q:client_name} -E -w 80% -h 60% \"clip pick --paste-pane #{pane_id}\" $clip_pick_quiet_ok'"
bind -N "Pick and paste from clipboard history" P "$clip_pick_paste"

# === Task Windows ===
# prefix n opens a window for a new task in the current pane's directory: an
# agent on the left (60%) and a shell on the right, named automatically like
# any other window. A menu picks the agent in a fixed order with one key each.
# The agent is typed into the left pane's shell rather than run as the pane's
# command, so quitting it leaves a shell instead of closing the pane. "other"
# asks for any command line (codex resume, claude --resume).
# This takes tmux's default prefix n (next window), and prefix p (previous
# window) goes with it: C-Tab and C-S-Tab switch windows.
# tmux commands take no parameters, so each item spells out the same steps.
# display-menu expands formats in each item's command when it builds the menu,
# so ## keeps #{pane_current_path} for when the command runs: a directory name
# with a quote or $ is then passed as data, never parsed as command text.
# The command line goes in as %1, never %%: tmux 3.8 escapes %% for single
# quotes, which would leave '\'' in a command line with an apostrophe. The
# shell pane splits from #{pane_start_path}, the directory the agent pane was
# given: a new pane's #{pane_current_path} can read empty (or, before tmux 3.7,
# the server's directory) until its process has started.
# The pane and window menus open this menu too. Inside another menu its ##
# escapes would be expanded once more, too early, so they run it through
# run-shell -C from @task_menu: that expands only the option's name and parses
# its text unexpanded, as this binding does.
%hidden task_menu='display-menu -T "#[align=centre]New task window" \
  claude c { new-window -c "##{pane_current_path}" ; send-keys -l claude ; send-keys Enter ; split-window -h -l 40% -c "##{pane_start_path}" ; select-pane -L } \
  codex x { new-window -c "##{pane_current_path}" ; send-keys -l codex ; send-keys Enter ; split-window -h -l 40% -c "##{pane_start_path}" ; select-pane -L } \
  muse m { new-window -c "##{pane_current_path}" ; send-keys -l muse ; send-keys Enter ; split-window -h -l 40% -c "##{pane_start_path}" ; select-pane -L } \
  "shell only" s { new-window -c "##{pane_current_path}" ; split-window -h -l 40% -c "##{pane_start_path}" ; select-pane -L } \
  "other..." o { command-prompt -p "Command:" { new-window -c "##{pane_current_path}" ; send-keys -l "%1" ; send-keys Enter ; split-window -h -l 40% -c "##{pane_start_path}" ; select-pane -L } }'
bind -N "Open a task window: an agent beside a shell" n "$task_menu"
set -g @task_menu "$task_menu"
unbind p
# The menu was prefix N at first; dot update reloads this file rather than
# restarting the server, so drop that binding explicitly, as with prefix S.
unbind N

# === Scratch Popups ===
# prefix g opens a throwaway shell in a popup over the current pane, starting
# in its directory, for a quick check (git status, gh, sl) without splitting
# the agent's window; exiting the shell closes it. prefix G runs lazygit there
# the same way, when it is installed. Nothing persists after a popup closes.
bind -N "Open a scratch shell popup in this directory" g display-popup -E -d '#{pane_current_path}' -w 80% -h 75%
bind -N "Open lazygit in a popup in this directory" G if-shell 'command -v lazygit >/dev/null 2>&1' {
  display-popup -E -d '#{pane_current_path}' -w 90% -h 90% lazygit
} {
  display-message 'lazygit is not installed'
}

# === Menus and Command Palette ===
# Option-Space opens a command palette: tmux-tools' tmux-command-palette lists
# every key binding that has a note (bind -N, the list prefix ? shows) in an
# fzf popup, description first and key second, and Enter runs the chosen one.
# After the popup closes it types the chosen key for this client (send-keys -K,
# tmux 3.4), so the binding acts on the pane the palette came from and its
# prompts open over that pane; older tmux turns the prefix on and names the
# key instead. As for image paste, the key goes inward to an SSH, mosh or ET
# session or a nested tmux with mouse reporting on, so the innermost tmux opens
# its own palette; a pane in a mode such as copy mode keeps it at this layer.
# Until tmux-tools provides the helper, the key says so.
%hidden is_nested_layer_native="#{m/r:^(ssh|mosh|mosh-client|et|tmux(:.*)?)$,#{pane_current_command}}"
%hidden is_palette_inward_native="#{&&:#{mouse_any_flag},$is_nested_layer_native}"
%hidden is_palette_inward="ps -o state= -o ucomm= -o pgid= -o tpgid= -t '#{pane_tty}' | awk -v mouse='#{mouse_any_flag}' '\$1 !~ /^[TXZ]/ && \$(NF-1) == \$(NF) && mouse == 1 && \$2 ~ /^(ssh|mosh|mosh-client|et|tmux:?)$/ { found = 1 } END { exit !found }'"
%hidden open_command_palette="if-shell 'command -v tmux-command-palette >/dev/null 2>&1' \"run-shell 'tmux-command-palette --client #{q:client_name}'\" \"display-message 'The command palette needs tmux-command-palette from tmux-tools'\""
bind -N "Open the command palette" -n M-Space if-shell -F '#{pane_in_mode}' "$open_command_palette" { if-shell -F "$is_palette_inward_native" 'send-keys M-Space' { if-shell "$is_palette_inward" 'send-keys M-Space' "$open_command_palette" } }

# Ctrl-Shift-B is a one-key prefix for the next tmux in: over a pane running
# a nested tmux or a remote session (ssh, mosh, ET), the pane's command as for
# the palette above, it types this layer's prefix, C-b, into the pane, which
# the tmux inside reads as its own prefix. Over anything else it turns on this
# tmux's own prefix instead, so an agent never receives a stray C-b (Claude
# Code reads it as "move the task to the background"). Unlike the palette it
# ignores mouse reporting: a remote tmux that has not asked for the mouse
# still takes the prefix. The terminal must send the chord as an extended key
# that differs from C-b, and WezTerm, iTerm2 and VS Code send the CSI u form
# ESC [ 98 ; 6 u, which tmux 3.2 through 3.8 all read as C-S-b: WezTerm and
# iTerm2 through the shared terminal settings, VS Code through a terminal
# keybinding that replaces its build task there. Left alone, WezTerm sends
# ESC [ 27 ; 5 ; 66 ~ while tmux has extended keys on (tmux 3.4 reads that as
# C-b, 3.6 onwards as a separate C-B) and plain C-b otherwise.
bind-key -N "Send the prefix to a nested or remote tmux, else start this one's" -n C-S-b if-shell -F "$is_nested_layer_native" send-prefix 'switch-client -T prefix'

# Right-click menus replace tmux's default pane, window and session menus,
# keeping their useful items and adding this config's own actions. Each menu's
# title and items are defined once, in a %hidden variable (tmux 3.2; hidden
# keeps them out of every pane's environment), and spliced into each binding
# that opens it, which tmux parses as a command list when given one string.
# Only the position differs, and the mouse target (-t=) of a click.
# - A label starting with - is greyed out and cannot be chosen; a label that
#   expands to nothing hides its item (the word, line and link items exist only
#   under the pointer, the scroll items only in copy mode).
# - display-menu expands formats in each item when it builds the menu, so items
#   take values such as #{pane_id} from the menu's pane or window, and ## keeps
#   formats that may expand to arbitrary text (a directory, a window name) for
#   the item's command to expand when it runs. Prompts and confirmations show
#   formats for the current window and pane, and on tmux 3.2 also run their
#   command without the menu's target, so those commands name their target,
#   quoted. The N-outputs prompt keeps #{pane_id} out of its template, where
#   %N would read as an answer. The renames take their answer through a
#   string template's %%%, which tmux escapes for double quotes: tmux 3.2
#   reparses a menu's { } template with the answer pasted in.
# - The items the key bindings share (copy, paste, attention, the palette) are
#   the bindings' own commands, spliced from their variables.
# - -O keeps a menu open when the button comes up off its items: one click
#   opens it and another chooses, and press, drag and release still works.
# Each menu's items use the keys of the matching prefix bindings where they
# exist, and Space opens the palette.
# Copies are recorded in clip history as copy-pipe does it, quietly: output from
# run-shell would put the pane in view mode.
%hidden clip_record_copy="run-shell -b 'command -v clip >/dev/null 2>&1 || exit 0; tmux show-buffer | clip capture --history-only >/dev/null 2>&1 || :'"
# Text under the pointer goes into the word, line and link items as data: q:
# escapes it for the double quotes it sits in, and \~ keeps a leading ~ from
# expanding to the home directory. These items are written as strings rather
# than { } blocks: tmux 3.3 and later reprint a block without the -- that
# keeps text such as -removed from reading as a flag.
%hidden pointer_word='#{s|^~|\\\\~|:#{q:mouse_word}}'
%hidden pointer_line='#{s|^~|\\\\~|:#{q:mouse_line}}'
%hidden pointer_link='#{s|^~|\\\\~|:#{q:mouse_hyperlink}}'
%hidden pane_menu_title='#[align=centre]#{window_index}.#{pane_index} (#{pane_id})'
%hidden pane_menu_items="\
  '#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go to the top,}' < { send-keys -X history-top } \
  '#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go to the bottom,}' > { send-keys -X history-bottom } \
  '' \
  '#{?mouse_word,Search for #[underscore]#{=/9/...:mouse_word},}' C-r \"if-shell -F '#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}' 'copy-mode -t=' ; send-keys -X -t= search-backward \\\"$pointer_word\\\"\" \
  '#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}' C-y \"copy-mode -q ; send-keys -l -- \\\"$pointer_word\\\"\" \
  '#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}' c \"copy-mode -q ; set-buffer -w -- \\\"$pointer_word\\\" ; $clip_record_copy\" \
  '#{?mouse_line,Copy the line,}' l \"copy-mode -q ; set-buffer -w -- \\\"$pointer_line\\\" ; $clip_record_copy\" \
  '' \
  '#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}' C-h \"copy-mode -q ; send-keys -l -- \\\"$pointer_link\\\"\" \
  '#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}' h \"copy-mode -q ; set-buffer -w -- \\\"$pointer_link\\\" ; $clip_record_copy\" \
  '' \
  'Copy the last command output' o { $copy_last_output } \
  'Copy the last N command outputs...' O { command-prompt -p 'Copy last N commands:' 'run-shell \"tmux-copy-last-output --pane ##{pane_id} --client ##{q:client_name} %1\"' } \
  'Paste from clipboard history...' P { $clip_pick_paste } \
  '' \
  'Split side by side' % { split-window -h -c \"##{pane_current_path}\" } \
  'Split top and bottom' '\"' { split-window -v -c \"##{pane_current_path}\" } \
  '#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}' z { resize-pane -Z } \
  '#{?#{>:#{window_panes},1},,-}Move to a new window' ! { break-pane } \
  '' \
  '#{?#{E:@attention_elsewhere},,-}Jump to the next pane needing attention' a { $attention_jump } \
  'New task window...' n { run-shell -C \"##{@task_menu}\" } \
  'Open a scratch shell' g { display-popup -E -d \"##{pane_current_path}\" -w 80% -h 75% } \
  'Open the command palette...' Space { $open_command_palette } \
  '' \
  'Close the pane...' x { confirm-before -p \"kill-pane #{pane_index}? (y/n)\" \"kill-pane -t '#{pane_id}'\" }"
# A right-click selects the pane first, as the pass-through below does, so the
# palette and the task-window menu, which act on the current pane, act on the
# pane clicked.
# The menu opens below the pointer, or above it when it does not fit below. A
# menu over the pointer closes when the button comes up, or runs the item
# under it if the pointer moved first, and -y M shifts a menu that does not
# fit below up over the pointer (tmux 3.2 does so sooner). -y names the row
# below the menu, so this puts the menu's top or bottom border on the
# pointer's row; only a terminal too short for either still gets a menu over
# the pointer. tmux places menus in client rows before 3.8 and in window rows
# since, and the two differ when the window is taller than the client, so the
# menu opens below only when it fits in both: window rows (pane_top plus the
# pane-relative mouse_y) and client rows (popup_mouse_y).
%hidden pane_menu_y='#{?#{&&:#{e|<=:#{e|+:#{e|+:#{pane_top},#{mouse_y}},#{popup_height}},#{window_height}},#{e|<=:#{e|+:#{popup_mouse_y},#{popup_height}},#{client_height}}},#{e|+:#{popup_mouse_y},#{popup_height}},#{e|+:#{popup_mouse_y},1}}'
%hidden pane_menu_at_pointer="select-pane -t= ; display-menu -O -t= -x M -y \"$pane_menu_y\" -T '$pane_menu_title' $pane_menu_items"
# A pane whose program uses the mouse (Neovim, a nested tmux, an SSH session
# reporting mouse) gets the plain right-click, as do modes other than copy mode
# that use the mouse themselves; Option-right-click always opens the menu.
set -g @pane_keeps_right_click '#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}'
bind -N "Open the pane menu unless the program uses the mouse" -n MouseDown3Pane if-shell -F -t= '#{E:@pane_keeps_right_click}' { select-pane -t= ; send-keys -M } "$pane_menu_at_pointer"
bind -N "Open the pane menu, even over a program using the mouse" -n M-MouseDown3Pane "$pane_menu_at_pointer"
bind -N "Open the pane menu" > "display-menu -O -x P -y P -T '$pane_menu_title' $pane_menu_items"

# A right-click on a tab selects it first, as a right-click on a pane
# selects the pane: since tmux 3.8 a menu belongs to its target window, so a
# menu for a background tab would draw on that hidden window. Prompts and the
# task-window menu then show and act on the tab clicked. Move left and right
# stop at the ends, as Alt-Shift-[ and ] do; they name both windows, then
# select the moved one, which stays the current window.
%hidden window_menu_title='#[align=centre]#{window_index}:#{window_name}'
%hidden window_menu_items="\
  '#{?#{>:#{window_index},#{base-index}},,-}Move left' l { swap-window -d -s '#{window_id}' -t ':#{e|-:#{window_index},1}' ; select-window -t '#{window_id}' } \
  '#{?#{<:#{window_index},#{e|+:#{base-index},#{e|-:#{session_windows},1}}},,-}Move right' r { swap-window -d -s '#{window_id}' -t ':#{e|+:#{window_index},1}' ; select-window -t '#{window_id}' } \
  '' \
  'Rename...' , { command-prompt -I \"##W\" \"rename-window -t '#{window_id}' -- \\\"%%%\\\"\" } \
  '#{?automatic-rename,-,}Name automatically' a { set-window-option -u -t '#{window_id}' automatic-rename } \
  '' \
  'New window' c { new-window -c \"##{pane_current_path}\" } \
  'New window after this one' w { new-window -a -c \"##{pane_current_path}\" } \
  'New task window...' n { run-shell -C \"##{@task_menu}\" } \
  '' \
  'Open the command palette...' Space { $open_command_palette } \
  '' \
  'Close the window...' X { confirm-before -p \"kill-window ##W? (y/n)\" \"kill-window -t '#{window_id}'\" }"
bind -N "Open the window menu for the tab clicked" -n MouseDown3Status "select-window -t= ; display-menu -O -t= -x W -y W -T '$window_menu_title' $window_menu_items"
bind -N "Open the window menu for the tab clicked" -n M-MouseDown3Status "select-window -t= ; display-menu -O -t= -x W -y W -T '$window_menu_title' $window_menu_items"
bind -N "Open the window menu" < "display-menu -O -x W -y W -T '$window_menu_title' $window_menu_items"

# The session menu on the status bar's session name stays close to tmux's. It
# is always the client's own session, so its rename needs no target (a
# session id starts with $, which tmux would read as a variable).
%hidden session_menu_items="\
  '#{?#{!=:#{S:x},x},,-}Next session' n { switch-client -n } \
  '#{?#{!=:#{S:x},x},,-}Previous session' p { switch-client -p } \
  '' \
  'Renumber windows' N { move-window -r } \
  'Rename...' '\$' { command-prompt -I \"##S\" \"rename-session -- \\\"%%%\\\"\" } \
  '' \
  'New session' s { new-session -c \"##{pane_current_path}\" } \
  'New window' w { new-window -c \"##{pane_current_path}\" } \
  '' \
  'Open the command palette...' Space { $open_command_palette }"
bind -N "Open the session menu" -n MouseDown3StatusLeft "display-menu -O -t= -x M -y W -T '#[align=centre]#{session_name}' $session_menu_items"
bind -N "Open the session menu" -n M-MouseDown3StatusLeft "display-menu -O -t= -x M -y W -T '#[align=centre]#{session_name}' $session_menu_items"

# === Text Extraction ===
# prefix+Tab fuzzy-picks a path, URL, hash, or word from the pane: Enter copies
# and Tab inserts it at the prompt. shdeps installs extrakto as a plain
# checkout, so source its entrypoint directly rather than through TPM.
# The stock OSC 52 mode passes its selected text directly to set-buffer -w.
# fg/bg clipboard hooks reread the global buffer and can copy another client's
# text. Keep those modes out of the cycle; this deliberately excludes extracted
# copies from clip history. Stock extrakto still chooses its client implicitly.
set -g @extrakto_clip_mode tmux_osc52
set -g @extrakto_clip_mode_order 'tmux_osc52 buffer'
# Retire our old custom hook on existing servers when dot update reloads.
set -gu @extrakto_clip_tool
run-shell 'test ! -x ~/.local/share/laktak/extrakto/extrakto.tmux || exec ~/.local/share/laktak/extrakto/extrakto.tmux'
# The plugin owns its configurable key and command; add only its help note.
run-shell 'if [ -x ~/.local/share/laktak/extrakto/extrakto.tmux ]; then key=$(tmux show-option -gqv @extrakto_key); key=${key:-Tab}; case "$key" in [Nn][Oo][Nn][Ee]) ;; *) tmux bind-key -N "Extract text from pane history" "$key" ;; esac; fi'

# === Automatic Session Persistence ===
# shdeps installs TPM and its plugins as checkouts below this shared owner
# directory. Keep continuum last so its status-right autosave hook survives.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux-plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-dir '~/.local/share/tmux/resurrect/$HOSTNAME'

# Protect snapshots even when shdeps did not need to update the plugin checkout.
run-shell 'base="$HOME/.local/share/tmux/resurrect"; host="$base/$(hostname)"; (umask 077 && mkdir -p "$host") && chmod 0700 "$base" "$host"'

set -g @resurrect-hook-post-save-layout 'ds resurrect save'
set -g @resurrect-hook-pre-restore-all 'ds resurrect begin'
set -g @resurrect-hook-post-restore-all 'ds resurrect restore'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '0'
# tmux-tools owns the generic default-server coordinator. Dotfiles owns only
# this policy: isolated sockets stay inert, while the normal server saves every
# five minutes and publishes restore ownership for consumers such as DS.
set -g @tmux-tools-continuum-save-interval '5'
set -g @tmux-tools-resurrect-auto-restore 'off'

# TPM must load after every plugin option.
run-shell 'test ! -x ~/.local/share/tmux-plugins/tpm/tpm || exec ~/.local/share/tmux-plugins/tpm/tpm'
run-shell '~/.local/bin/tmux-continuum-default-server'
