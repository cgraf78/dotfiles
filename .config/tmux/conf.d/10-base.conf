# ~/.config/tmux/tmux.conf

# === Defaults ===
run-shell 'shell=$(command -v zsh 2>/dev/null || printf "%s" "$SHELL"); tmux set-option -g default-shell "$shell"; tmux set-option -g default-command "exec $shell -l"'
set -s default-terminal "tmux-256color"
set -s escape-time 10

# Enable true color (24-bit) passthrough. Fixed indexes, like terminal-features
# below, so reloading replaces these entries instead of appending copies (a
# server that already holds copies keeps them until it restarts); index 0 keeps
# tmux's built-in linux console override.
set -s terminal-overrides[1] "xterm-256color:Tc"
set -s terminal-overrides[2] "*256col*:Tc"

# Pass through modifier+arrow sequences (Ctrl+Left/Right for word navigation).
# Requires a fresh tmux session (not just tmux source) to take effect.
set -g xterm-keys on
set -g extended-keys on
set -s user-keys[8] "\033[777009u"
# The outer terminal answers Termnav's read-only DECRQM query with one of five
# standard states. Bind every legal reply so the commit barrier is independent
# of whether bracketed paste is unsupported, set, reset, or permanently fixed.
set -s user-keys[9] "\033[?2004;0\$y"
set -s user-keys[10] "\033[?2004;1\$y"
set -s user-keys[11] "\033[?2004;2\$y"
set -s user-keys[12] "\033[?2004;3\$y"
set -s user-keys[13] "\033[?2004;4\$y"

# Advertise WezTerm/xterm features that tmux cannot infer from terminfo.
# extkeys keeps CSI u key sequences intact; hyperlinks lets tmux re-emit OSC 8.
set -s terminal-features[3] "xterm-256color:extkeys:hyperlinks"
# A tmux started from a tmux pane (directly or over ssh) sees TERM=tmux-*.
# Without extkeys it never asks the outer tmux for extended keys, so the outer
# tmux collapses Ctrl-Shift chords (Ctrl-Shift-p, Ctrl-Shift-v) to plain Ctrl
# before the nested pane sees them.
set -s terminal-features[4] "tmux*:extkeys"

# Let applications handle Ctrl+Shift+Left/Right instead of tmux's default
# window-swapping bindings.
unbind-key -n C-S-Left
unbind-key -n C-S-Right


# Explicitly forward Shift+Enter as CSI u sequence to the active pane.
# Needed because terminal agents and other apps that don't request extended key
# mode won't receive it via the automatic extkeys passthrough.
bind-key -n S-Enter send-keys Escape '[13;2u'

set -g status-keys emacs
set -g mode-keys vi
set -g history-limit 100000
set -g set-clipboard on
set -g focus-events on
# Mouse mode: click to focus a pane, wheel into copy mode, drag to select.
set -g mouse on
set -g detach-on-destroy on
set -g update-environment "SSH_AUTH_SOCK VSCODE_IPC_HOOK_CLI"
setw -g aggressive-resize on

# Bell: propagate bells from background panes/windows to the terminal
set -g bell-action any
set -g visual-bell off

# Allow applications to send OSC escape sequences through tmux to the outer
# terminal (for example, Termnav user-variable routing).
set -g allow-passthrough on

# Terminal user variables are client-local and are not replayed when a new
# client attaches to an existing pane. Claim tmux ownership at attach time so
# Ctrl-Tab reaches this server before any shell or editor needs to redraw.
set-hook -g client-attached[100] {
  if-shell -F '#{==:#{client_control_mode},0}' {
    run-shell '~/.local/bin/termnav tmux context --tty #{q:client_tty} --client-termname #{q:client_termname}'
  }
}

# Termnav reconciles both sides of visual focus: a focused nested client claims
# its immediate parent pane, while an unfocused client dims its own active pane.
# The two signals compose one hop at a time through arbitrary local or SSH
# nesting without encoding hosts, session names, process names, or depth.
#
# Focus-out dims the local active pane and stops the parent publisher promptly;
# detach still releases the parent when the client is already gone. The bounded
# lease is the crash fallback, not the normal update path. Direct terminal
# clients have no parent route, so the helper exits immediately and leaves no
# resident process.
tmux_focus_watch="run-shell -b 'test ! -x ~/.local/bin/termnav || exec ~/.local/bin/termnav tmux focus watch --tmux-socket #{q:socket_path} --client-pid #{client_pid} --client-tty #{q:client_tty}'"
tmux_focus_stop="run-shell -b 'test ! -x ~/.local/bin/termnav || exec ~/.local/bin/termnav tmux focus stop --tmux-socket #{q:socket_path} --client-pid #{client_pid} --client-tty #{q:client_tty}'"
tmux_focus_sync="run-shell -b 'test ! -x ~/.local/bin/termnav || exec ~/.local/bin/termnav tmux focus sync --tmux-socket #{q:socket_path} --client-pid #{client_pid} --client-tty #{q:client_tty}'"
set-hook -g client-attached[110] {
  if-shell -F '#{==:#{client_control_mode},0}' "$tmux_focus_watch"
}
set-hook -g client-focus-in[110] {
  if-shell -F '#{==:#{client_control_mode},0}' "$tmux_focus_watch"
}
set-hook -g client-focus-out[110] {
  if-shell -F '#{==:#{client_control_mode},0}' "$tmux_focus_stop"
}
set-hook -g client-detached[110] {
  if-shell -F '#{==:#{client_control_mode},0}' "$tmux_focus_stop"
}
# A pane-local dim override normally clears on focus-in. These hooks cover the
# rarer shared-session case where another client changes the selected pane in
# the meantime. The option guard keeps ordinary navigation process-free.
set-hook -g after-select-pane[110] {
  if-shell -F '#{&&:#{==:#{client_control_mode},0},#{!=:#{@termnav_client_unfocused},}}' "$tmux_focus_sync"
}
set-hook -g after-select-window[110] {
  if-shell -F '#{&&:#{==:#{client_control_mode},0},#{!=:#{@termnav_client_unfocused},}}' "$tmux_focus_sync"
}
set-hook -g client-session-changed[110] {
  if-shell -F '#{&&:#{==:#{client_control_mode},0},#{!=:#{@termnav_client_unfocused},}}' "$tmux_focus_sync"
}

# Visiting a pending pane acknowledges it. Clear on focus-out too: a pane that
# notified while you were in it was seen, and must not light up as you leave.
# Each hook's target is the pane being looked at, so set-option needs no -t and
# no process is spawned on every focus change.
set-hook -g pane-focus-in[120] 'set-option -pu @term_notify_pending'
set-hook -g pane-focus-out[120] 'set-option -pu @term_notify_pending'
# tmux tracks pane focus server-wide: while any other attached client (an idle
# second machine, a terminal that never reports focus) keeps a pane focused,
# visiting it fires no pane-focus transition. Also acknowledge whatever a client
# selects or returns to, so a mark never outlives being looked at.
set-hook -g client-focus-in[120] 'set-option -pu @term_notify_pending'
set-hook -g after-select-pane[120] 'set-option -pu @term_notify_pending'
set-hook -g after-select-window[120] 'set-option -pu @term_notify_pending'
set-hook -g client-session-changed[120] 'set-option -pu @term_notify_pending'

# prefix a jumps to the first pending pane in this session, in tab then pane
# order. Arriving acknowledges it through the select hooks above, so pressing
# again moves on to the next one. A pure format finds it without forking a
# process; run-shell -C expands that format into the target before running the
# tmux commands, which plain command arguments would not.
set -g @pending_panes '#{W:#{P:#{?@term_notify_pending,#{pane_id} ,}}}'
bind -N "Jump to the next pane needing attention" a if-shell -F '#{E:@pending_panes}' {
  run-shell -C 'select-window -t "#{s/ .*//:#{E:@pending_panes}}" ; select-pane -t "#{s/ .*//:#{E:@pending_panes}}"'
} {
  display-message 'Nothing is waiting for attention'
}

# Start numbering at 1, close gaps on window close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# === Status Bar ===
set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left

# Colors (night-owl palette). The bar uses the editor line-highlight blue rather
# than the pane background so it reads as a tab strip instead of blending into
# the pane-border labels directly below it.
set -g status-style 'bg=#0b2942 fg=#8badc1'
set -g message-style 'bg=#1d3b53 fg=#d6deeb bold'
set -g mode-style 'bg=#1d3b53 fg=#d6deeb bold'
# Status messages render in the easily overlooked top row.
set -g display-time 2500

# Left: PREFIX indicator + session. ds sessions replace this with their own
# host-labelled copy, so keep shared mode indicators in the window tabs.
set -g status-left-length 80
set -g status-left '#{?client_prefix,#[fg=#011627 bg=#c792ea bold] PREFIX #[default] ,}#[fg=#82aaff][ #S ] #[default]'

# Right: date + time. Per-pane paths live in the pane borders.
set -g status-right-length 120
set -g status-right '#[fg=#637777]%a %d %b  #[fg=#8badc1]%H:%M '

# Window tabs. Bell marks a background window whose agent or command rang the
# terminal bell; it clears when the window is selected.
setw -g window-status-style 'fg=#8badc1'
setw -g window-status-current-style 'bg=#82aaff fg=#011627 bold'
setw -g window-status-bell-style 'bg=#f78c6c fg=#011627 bold'
setw -g window-status-separator ' '
# A pane is pending when its program asked for attention: cmdblocks'
# term-notify-sound (run by agent notification hooks) sets this pane option
# because tmux records a bell against a window, never the pane that rang. The
# focus hooks below clear it once you visit the pane.
# A pane you are focused on is already being looked at, so it never shows as
# pending; the termnav predicate is defined with the pane border options. That
# predicate ignores which window is current, and every window has an active
# pane, so also require the current window: an agent alone in a background
# window must still mark its tab.
set -g @pane_pending '#{&&:#{@term_notify_pending},#{!=:#{&&:#{window_active},#{E:@termnav_pane_is_focused_leaf}},1}}'
# A pane is busy while its agent works on a request: AgentGuard's lifecycle
# hooks set @term_busy through cmdblocks' term-pane-mark from a submitted prompt
# until the turn ends. A pane back at a shell prompt cannot still be working,
# so a mark left by an agent killed mid-turn stays hidden there; it shows again
# under the next program in that pane until the next agent's turn ends.
set -g @pane_busy '#{&&:#{@term_busy},#{!=:#{m/r:^-?(zsh|bash|fish|sh)$,#{pane_current_command}},1}}'
# ● on a tab while any of its panes is pending, otherwise ⋯ while any is busy,
# so a glance at the tabs separates agents that need you from agents still
# working and idle ones. Unlike the bell flag, these also show on the current
# window, where the agent beside your shell is waiting or working.
set -g @window_marker '#{?#{P:#{?#{E:@pane_pending},1,}}, ●,#{?#{P:#{?#{E:@pane_busy},1,}}, ⋯,}}'
setw -g window-status-format ' #I:#W#{E:@window_marker}#{?window_zoomed_flag, [Z],} '
setw -g window-status-current-format ' #I:#W#{E:@window_marker}#{?window_zoomed_flag, [Z],}#{?#{==:#{pane_mode},copy-mode}, [COPY],} '

# Pane and window labels. These formats share one notion of what a pane is
# running so the tab, the border, and nested tmux titles always agree.
#
# Sandboxes, SSH transports, and interpreters report a wrapper process name
# that says nothing about the app, so their labels come from the title the app
# set itself instead.
set -g @pane_wrapped '#{m/r:^(bwrap|termnav|ssh|mosh-client|et|node|python3?)$,#{pane_current_command}}'
# A title is meaningful only when the app chose it. tmux defaults pane titles to
# the hostname, and some apps echo their command or directory name. Keep these
# host comparisons out of pane-border-format itself: ds strips host literals
# from that option to avoid repeating its own host label.
set -g @pane_titled '#{&&:#{!=:#{pane_title},},#{&&:#{!=:#{pane_title},#{host}},#{&&:#{!=:#{pane_title},#{host_short}},#{&&:#{!=:#{pane_title},#{pane_current_command}},#{!=:#{pane_title},#{b:pane_current_path}}}}}}'
# Titles come from any process in the pane, including remote output, and tmux
# reads #[...] in drawn labels as styling. q/h doubles every # so a title can
# only ever render as text.
# The agents AgentGuard integrates; keep this list in step with AgentGuard's.
set -g @agent_names 'claude|codex|gemini|grok|muse|opencode'
# Some agents run a versioned binary whose name changes on every upgrade, such
# as muse-bin-1.4.3-R5018.1 or grok-1.0.50-linux-x86_64. Reduce an agent name
# followed by -bin and/or any version-like suffix (a digit, optionally after
# v or R) to the bare agent, so labels and tab names survive upgrades. The
# same rule covers macOS, which reports only 15 characters (muse-bin-1.4.3-).
# Other commands keep their full spelling.
set -g @pane_command '#{s/^(#{@agent_names})(-bin)?(-[vVrR]?[0-9].*)?$/\1/:pane_current_command}'
set -g @pane_app '#{?#{&&:#{E:@pane_wrapped},#{E:@pane_titled}},#{q/h;=/20/…:pane_title},#{E:@pane_command}}'
# Interactive apps (agents, editors, nested tmux) capture the mouse; shells and
# short-lived commands such as git, make, and less do not. That one signal names
# windows by what they host without flickering when a side shell runs a command.
# Shell widgets (fzf history search, fzf-tab completion) briefly enable mouse
# reporting while the shell stays the foreground command, so shells and pickers
# never count even when the flag is set.
# Some agents (muse) draw inline without mouse reporting or the alternate
# screen, leaving tmux no terminal signal, so known agents always count.
set -g @pane_agent '#{m/r:^(#{@agent_names})$,#{E:@pane_command}}'
set -g @pane_interactive '#{?#{m/r:^-?(zsh|bash|fish|sh|fzf|less)$,#{pane_current_command}},0,#{||:#{mouse_any_flag},#{E:@pane_agent}}}'
# Every interactive app in the window, in pane order, regardless of focus.
set -g @window_apps '#{P:#{?#{E:@pane_interactive},#{E:@pane_app} ,}}'

# Windows name themselves after their interactive apps, or after the active
# pane's directory when only shells are open. A manual rename (prefix ,) turns
# automatic naming off for that window, so chosen names stay put. allow-rename
# stays off so apps cannot rename windows behind this rule's back.
setw -g automatic-rename on
setw -g automatic-rename-format '#{=/20/…:#{?#{!=:#{E:@window_apps},},#{s/ $//:#{E:@window_apps}},#{b:pane_current_path}}}'
set -g allow-rename off

# Publish host:session as the terminal title. A nested tmux reached over SSH
# then titles its parent pane, which is how the outer layer labels that pane
# and window with the remote host. Matches ds's own host label.
set -g set-titles on
set -g set-titles-string '#{?@hostname_alias,#{@hostname_alias},#{host_short}}:#S'

# Pane borders
set -g pane-border-status top
# A pane is the focused leaf only when it is active for this exact client, the
# client itself has terminal focus, and no focused nested tmux has claimed the
# pane as its parent. Border and label formats have the client context needed
# to evaluate the complete predicate independently for every attachment.
set -g @termnav_pane_is_focused_leaf '#{&&:#{pane_active},#{&&:#{m:*focused*,#{client_flags}},#{==:#{@termnav_child_focus},}}}'
# Interactive panes show the app plus its own title (an agent's task, an
# editor's file); shells show their directory. Keep inactive labels readable in
# terminals without VS Code's contrast correction.
# Home-relative directory. Compare whole path components so /home/chrisx is
# not shown as ~x, and show the plain path if the server has no HOME.
set -g @pane_dir '#{?#{HOME},#{?#{==:#{pane_current_path},#{HOME}},~,#{s|^#{HOME}/|~/|:pane_current_path}},#{pane_current_path}}'
set -g @pane_label '#{?#{E:@pane_interactive},#{E:@pane_app}#{?#{&&:#{!=:#{E:@pane_wrapped},1},#{E:@pane_titled}}, · #{q/h;=/40/…:pane_title},},#{pane_current_command} · #{E:@pane_dir}}'
# An orange ● leads the label of a pending pane. It only ever renders on a
# pane that is not the focused leaf, whose label is the dim style, so it can
# restore that style explicitly after the marker.
set -g @pane_pending_marker '#{?#{E:@pane_pending},#[fg=#f78c6c#,bold]●#[fg=#898989#,nobold] ,}'
# Every label leads with the pane's command targets: window.pane, the readable
# target for commands such as `tmux send-keys -t 2.1`, and the stable %pane_id
# in parentheses, which survives renumbering and moves between windows.
set -g pane-border-format '#{?#{E:@termnav_pane_is_focused_leaf},,#[fg=#898989]} #I.#P (#{pane_id})  #{E:@pane_pending_marker}#{E:@pane_label} '
setw -g pane-border-style 'fg=#333333'
setw -g pane-active-border-style '#{?#{E:@termnav_pane_is_focused_leaf},fg=cyan#,bold,fg=#333333}'
# tmux 3.6b can spin in scrollbar drawing after a client resize (tmux#4932).
# Keep copy mode available without entering the affected rendering path.
set -g pane-scrollbars off

# New panes and windows start where the current pane is, so splitting from a
# shell in a repo opens another shell in that repo.
bind -N "Split top and bottom in the current directory" '"' split-window -v -c '#{pane_current_path}'
bind -N "Split side by side in the current directory" % split-window -h -c '#{pane_current_path}'
bind -N "Open a window in the current directory" c new-window -c '#{pane_current_path}'
# prefix X closes the whole window, panes and all, as tmux's prefix & does: the
# capital of prefix x (close the pane), asking first in the same way.
bind -N "Close this window and all its panes" X confirm-before -p "kill-window #W? (y/n)" kill-window

# Move panes between windows. prefix ! (tmux default) breaks the current pane
# out into its own window; prefix j sends it into a chosen window and prefix J
# pulls a chosen pane in beside it, so a pane can be popped out and put back.
# Both join side by side, which suits wide terminals. The tree starts at window
# level for sending, since the destination is a window, and fully expanded for
# pulling, where the live previews identify the pane.
bind -N "Send this pane to a chosen window" j choose-tree -Zw "join-pane -h -t '%%'"
bind -N "Pull a chosen pane into this window" J choose-tree -Z "join-pane -h -s '%%'"

# Dim inactive panes (night-owl palette, 40% dimmed)
set -g window-style 'bg=#010d17'
# Unlike border formats, tmux compiles pane content styles without a client
# context and does not reevaluate them when a pane user option changes. Keep the
# normal active style literal so tmux emits the exact Night Owl blue. Termnav
# temporarily installs this configured inactive style as a pane-local override
# for unfocused leaves and focused-child containers, then restores the prior
# override when that pane becomes the focused leaf again.
set -g @termnav_inactive_style 'bg=#010d17'
set -g window-active-style 'bg=#011627'

# Right/left navigate panes if vertical splits exist, otherwise switch windows
bind -N "Select the right pane or next window" Right if-shell -F '#{e|<:#{pane_width},#{window_width}}' 'select-pane -R' 'next-window'
bind -N "Select the left pane or previous window" Left  if-shell -F '#{e|<:#{pane_width},#{window_width}}' 'select-pane -L' 'previous-window'

# Move between tabs and panes across editor, nested-tmux, and remote layers.
# A chord goes inward when the pane's foreground app owns it: Vim, Neovim, and
# fzf always (fzf lists use Ctrl-j/k), and SSH, mosh, ET, or a nested tmux only
# while the inner side has mouse reporting on. Otherwise this tmux handles it,
# and at its edge Termnav routes the gesture to the parent layer. The *_native
# checks read tmux's own pane metadata; the ps fallbacks see an owner behind a
# wrapper or pipeline, trusting only the pane's foreground process group.
is_vim_native="#{m/r:^g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}"
is_terminal_app_native="#{||:#{m/r:^(g?(view|l?n?vim?x?|fzf)(diff)?|ssh|mosh|mosh-client|mosh-server|et)$,#{pane_current_command}},#{&&:#{mouse_any_flag},#{m/r:^(tmux|screen)(:.*)?$,#{pane_current_command}}}}"
is_terminal_app="ps -o state= -o ucomm= -o pgid= -o tpgid= -t '#{pane_tty}' | awk -v mouse='#{mouse_any_flag}' '\$1 !~ /^[TXZ]/ && \$(NF-1) == \$(NF) && (\$2 ~ /^(g?(view|l?n?vim?x?|fzf)(diff)?|ssh|mosh|mosh-client|mosh-server|et)$/ || (mouse == 1 && \$2 ~ /^(tmux|screen):?$/)) { found = 1 } END { exit !found }'"
is_pane_navigation_native="#{||:$is_vim_native,#{&&:#{mouse_any_flag},$is_terminal_app_native}}"
is_pane_navigation="ps -o state= -o ucomm= -o pgid= -o tpgid= -t '#{pane_tty}' | awk -v mouse='#{mouse_any_flag}' '\$1 !~ /^[TXZ]/ && \$(NF-1) == \$(NF) && (\$2 ~ /^g?(view|l?n?vim?x?|fzf)(diff)?$/ || (mouse == 1 && \$2 ~ /^(ssh|mosh|mosh-client|mosh-server|et|tmux|screen):?$/)) { found = 1 } END { exit !found }'"
navigate_origin_args="--client-pid #{client_pid} --client-tty #{q:client_tty} --client-created #{client_created} --client-termtype #{q:client_termtype} --source-socket #{q:socket_path} --source-pane #{pane_id} --source-session #{q:session_id}"
# Termnav exits 3 when no scope can perform a gesture, such as moving a pane
# or tab past the outermost edge. That is the expected no-op, but tmux reports
# any nonzero run-shell status as an error, so end every Termnav route with
# this to keep only real failures (and their exact status) visible.
navigate_declined_ok='|| { status=$?; [ "$status" -eq 3 ] || exit "$status"; }'
send_ctrl_tab="send-keys Escape '[9;5u'"
send_ctrl_shift_tab="send-keys Escape '[9;6u'"
send_alt_shift_left_bracket="send-keys Escape '{'"
send_alt_shift_right_bracket="send-keys Escape '}'"
# Boundary actions start at the parent; host-local pane movement starts in
# this tmux scope.
move_parent_tab_left="run-shell '~/.local/bin/termnav navigate tab-move left --parent $navigate_origin_args $navigate_declined_ok'"
move_parent_tab_right="run-shell '~/.local/bin/termnav navigate tab-move right --parent $navigate_origin_args $navigate_declined_ok'"
switch_tab_next="run-shell '~/.local/bin/termnav navigate tab-select next --parent $navigate_origin_args $navigate_declined_ok'"
switch_tab_previous="run-shell '~/.local/bin/termnav navigate tab-select previous --parent $navigate_origin_args $navigate_declined_ok'"
select_parent_pane_left="run-shell '~/.local/bin/termnav navigate pane-select left --parent $navigate_origin_args $navigate_declined_ok'"
select_parent_pane_down="run-shell '~/.local/bin/termnav navigate pane-select down --parent $navigate_origin_args $navigate_declined_ok'"
select_parent_pane_up="run-shell '~/.local/bin/termnav navigate pane-select up --parent $navigate_origin_args $navigate_declined_ok'"
select_parent_pane_right="run-shell '~/.local/bin/termnav navigate pane-select right --parent $navigate_origin_args $navigate_declined_ok'"
move_pane_left="run-shell '~/.local/bin/termnav navigate pane-move left $navigate_origin_args $navigate_declined_ok'"
move_pane_down="run-shell '~/.local/bin/termnav navigate pane-move down $navigate_origin_args $navigate_declined_ok'"
move_pane_up="run-shell '~/.local/bin/termnav navigate pane-move up $navigate_origin_args $navigate_declined_ok'"
move_pane_right="run-shell '~/.local/bin/termnav navigate pane-move right $navigate_origin_args $navigate_declined_ok'"
unbind-key -n M-Tab
unbind-key -n M-BTab
bind-key -N "Move the tab left across terminal layers" -n 'M-{' if-shell -F "$is_terminal_app_native" "$send_alt_shift_left_bracket" { if-shell "$is_terminal_app" "$send_alt_shift_left_bracket" { if-shell -F '#{==:#{session_windows},1}' "$move_parent_tab_left" { if-shell -F '#{>:#{window_index},#{base-index}}' 'swap-window -d -t :-' 'display-message -p ""' } } }
bind-key -N "Move the tab right across terminal layers" -n 'M-}' if-shell -F "$is_terminal_app_native" "$send_alt_shift_right_bracket" { if-shell "$is_terminal_app" "$send_alt_shift_right_bracket" { if-shell -F '#{==:#{session_windows},1}' "$move_parent_tab_right" { if-shell -F '#{<:#{window_index},#{e|+:#{base-index},#{e|-:#{session_windows},1}}}' 'swap-window -d -t :+' 'display-message -p ""' } } }

bind-key -N "Select the next tab across terminal layers" -n C-Tab if-shell -F "$is_pane_navigation_native" "$send_ctrl_tab" { if-shell "$is_pane_navigation" "$send_ctrl_tab" { if-shell -F '#{>:#{session_windows},1}' 'next-window' "$switch_tab_next" } }
bind-key -N "Select the previous tab across terminal layers" -n C-BTab if-shell -F "$is_pane_navigation_native" "$send_ctrl_shift_tab" { if-shell "$is_pane_navigation" "$send_ctrl_shift_tab" { if-shell -F '#{>:#{session_windows},1}' 'previous-window' "$switch_tab_previous" } }
bind-key -N "Navigate left across editor and terminal panes" -n 'C-h' if-shell -F "$is_pane_navigation_native" 'send-keys C-h' { if-shell "$is_pane_navigation" 'send-keys C-h' { if-shell -F '#{pane_at_left}' "$select_parent_pane_left" 'select-pane -L' } }
bind-key -N "Navigate down across editor and terminal panes" -n 'C-j' if-shell -F "$is_pane_navigation_native" 'send-keys C-j' { if-shell "$is_pane_navigation" 'send-keys C-j' { if-shell -F '#{pane_at_bottom}' "$select_parent_pane_down" 'select-pane -D' } }
bind-key -N "Navigate up across editor and terminal panes" -n 'C-k' if-shell -F "$is_pane_navigation_native" 'send-keys C-k' { if-shell "$is_pane_navigation" 'send-keys C-k' { if-shell -F '#{pane_at_top}' "$select_parent_pane_up" 'select-pane -U' } }
bind-key -N "Navigate right across editor and terminal panes" -n 'C-l' if-shell -F "$is_pane_navigation_native" 'send-keys C-l' { if-shell "$is_pane_navigation" 'send-keys C-l' { if-shell -F '#{pane_at_right}' "$select_parent_pane_right" 'select-pane -R' } }
bind-key -N "Move the pane left across terminal layers" -n 'M-H' if-shell -F "$is_pane_navigation_native" "send-keys Escape 'H'" { if-shell "$is_pane_navigation" "send-keys Escape 'H'" "$move_pane_left" }
bind-key -N "Move the pane down across terminal layers" -n 'M-J' if-shell -F "$is_pane_navigation_native" "send-keys Escape 'J'" { if-shell "$is_pane_navigation" "send-keys Escape 'J'" "$move_pane_down" }
bind-key -N "Move the pane up across terminal layers" -n 'M-K' if-shell -F "$is_pane_navigation_native" "send-keys Escape 'K'" { if-shell "$is_pane_navigation" "send-keys Escape 'K'" "$move_pane_up" }
bind-key -N "Move the pane right across terminal layers" -n 'M-L' if-shell -F "$is_pane_navigation_native" "send-keys Escape 'L'" { if-shell "$is_pane_navigation" "send-keys Escape 'L'" "$move_pane_right" }
bind-key -N "Return to the previous pane or editor split" -n 'C-\' if-shell -F "$is_pane_navigation_native" 'send-keys C-\\' { if-shell "$is_pane_navigation" 'send-keys C-\\' 'select-pane -l' }

# Ctrl-click follows the link under the pointer: Termnav opens a URL in the
# browser, or a file in a running Neovim, and says so when none is running. A
# pane whose app has mouse reporting on receives the click itself instead.
bind-key -n C-MouseDown1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'select-pane -t ='
bind-key -n C-MouseDrag1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'display-message -p ""'
bind-key -n C-MouseUp1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'run-shell -b "~/.local/bin/termnav tmux follow-click --stdin <<\"__DOT_TMUX_CLICK__\"\n#{mouse_hyperlink}\n#{mouse_word}\n#{mouse_line}\n#{mouse_x}\n#{pane_current_path}\n#{client_tty}\n#{pane_id}\n#{mouse_y}\n#{pane_top}\n#{pane_left}\n__DOT_TMUX_CLICK__"'
# User8 carries a commit inward between nested tmux layers. User9 through
# User13 consume every legal outer-terminal response to Termnav's DECRQM
# barrier. Foreground run-shell (no -b) pauses that client's input until the
# per-client FIFO directive is claimed and executed. If no directive is
# pending, terminal response keys are passed back to the originating pane so
# applications remain compatible with tmux releases that do not virtualize
# DECRQM. Per-client FIFO (seq-ordered) prevents cross-client consumption.
# A tmux socket is normally a simple /tmp path, but -L/-S and custom socket
# directories may contain shell metacharacters. q: keeps the expanded path one
# argv value when run-shell evaluates this command through the user's shell.
bind-key -n User8 run-shell '~/.local/bin/termnav relay commit --tmux-socket #{q:socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --client-created #{client_created}'
bind-key -n User9 run-shell '~/.local/bin/termnav relay commit --tmux-socket #{q:socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --client-created #{client_created} --passthrough-decrqm 0 --pane #{pane_id}'
bind-key -n User10 run-shell '~/.local/bin/termnav relay commit --tmux-socket #{q:socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --client-created #{client_created} --passthrough-decrqm 1 --pane #{pane_id}'
bind-key -n User11 run-shell '~/.local/bin/termnav relay commit --tmux-socket #{q:socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --client-created #{client_created} --passthrough-decrqm 2 --pane #{pane_id}'
bind-key -n User12 run-shell '~/.local/bin/termnav relay commit --tmux-socket #{q:socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --client-created #{client_created} --passthrough-decrqm 3 --pane #{pane_id}'
bind-key -n User13 run-shell '~/.local/bin/termnav relay commit --tmux-socket #{q:socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --client-created #{client_created} --passthrough-decrqm 4 --pane #{pane_id}'

# === Copy Mode ===
# Double-click and triple-click call copy-pipe-and-cancel with no command.
# copy-command is that default, so those copies record clipboard history
# through clip. Enter and Ctrl-c pass the same command explicitly.
set -g copy-command 'clip capture'

# Don't copy on mouse release — stay in copy mode with selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Escape exits copy mode without copying.
bind -T copy-mode-vi Escape send-keys -X cancel

# Ctrl-c copies through tmux's OSC 52 path and records history. clip capture
# also mirrors to a local macOS, Wayland, or X11 clipboard, but deliberately
# succeeds on remote hosts where OSC 52 is the only available path.
bind -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel "clip capture"
# Keep Enter equivalent to Ctrl-c so keyboard and mouse-selected text both use
# the same remote-safe OSC 52 route and clipboard history.
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip capture"
# Vim-style select and yank over the same route. Ctrl-v keeps rectangle mode.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip capture"

# Match desktop-editor selection behavior without changing normal pane input.
# The first modified-arrow creates an anchor; further presses move the active
# end so the selection grows or shrinks naturally in either direction.
bind -T copy-mode-vi S-Left if -F '#{selection_active}' 'send-keys -X cursor-left' { send-keys -X begin-selection \; send-keys -X cursor-left }
bind -T copy-mode-vi S-Right if -F '#{selection_active}' 'send-keys -X cursor-right' { send-keys -X begin-selection \; send-keys -X cursor-right }
bind -T copy-mode-vi S-Up if -F '#{selection_active}' 'send-keys -X cursor-up' { send-keys -X begin-selection \; send-keys -X cursor-up }
bind -T copy-mode-vi S-Down if -F '#{selection_active}' 'send-keys -X cursor-down' { send-keys -X begin-selection \; send-keys -X cursor-down }
bind -T copy-mode-vi C-S-Left if -F '#{selection_active}' 'send-keys -X previous-word' { send-keys -X begin-selection \; send-keys -X previous-word }
bind -T copy-mode-vi C-S-Right if -F '#{selection_active}' 'send-keys -X next-word-end' { send-keys -X begin-selection \; send-keys -X next-word-end }

# Jump between commands. The shell prompt marks each prompt start (OSC 133;A,
# see 60-prompt.zsh/.bash), and tmux 3.4+ moves between marked lines; older
# releases report the copy-mode command as unknown. prefix k opens copy mode
# on the last command's prompt: the cursor starts on the second line of the
# two-line shell prompt, so stepping up a line onto the current prompt's mark
# first makes previous-prompt pass it. [ and ] step to the previous or next
# prompt.
bind -N "Scroll back to the last command" k copy-mode \; send-keys -X cursor-up \; send-keys -X previous-prompt
bind -T copy-mode-vi [ send-keys -X previous-prompt
bind -T copy-mode-vi ] send-keys -X next-prompt

# VS Code and WezTerm intercept Ctrl-v and paste from the client clipboard,
# which is the only reliable path on a remote host. This binding is the local
# fallback for terminals that pass Ctrl-v through to tmux.
bind -n C-v run "bash -o pipefail -c 'clip paste | tmux load-buffer -' && tmux paste-buffer -p"
bind-key -N "Paste from the clipboard" -n C-v

# Left-click repositions cursor in copy mode (keeps mode active for long selections)
bind -T copy-mode-vi MouseDown1Pane if -F '#{selection_active}' 'send-keys -X cancel' 'send-keys -X clear-selection'
# Right-click exits copy mode without copying
bind -T copy-mode-vi MouseDown3Pane send-keys -X cancel

# Copy last command output to clipboard (pane-aware, works with splits). A
# run-shell job has no TMUX_PANE, so tmux would resolve the script's untargeted
# capture against the most recently active session, which another client may
# have just used; pass the pressing pane explicitly.
bind -N "Copy the last command output" o run-shell 'TMUX_PANE=#{pane_id} tmux-copy-last-output'
bind -N "Copy the last N command outputs" O command-prompt -p 'Copy last N commands:' 'run-shell "TMUX_PANE=#{pane_id} tmux-copy-last-output %1"'

# prefix A pastes the last command output of this shell pane into the window's
# agent and focuses it: the usual next step after a test fails in a side shell.
# The agent is the first agent pane in pane order, found by a pure format like
# @pending_panes. Bracketed paste (-p) lets the agent take it as one pasted
# block rather than typed lines. An agent pane has no command blocks of its own,
# so pressing it there only explains why. tmux-copy-last-output exits 3 after
# reporting an empty result itself; any other failure, such as a cmdblocks
# release without --print, is reported here because run-shell drops stderr.
# An agent pane left in copy mode would take the paste unbracketed, as typed
# lines, so its mode is cancelled first. TMUX_PANE, as for prefix o, keeps the
# capture and any message on the pressing pane's session.
set -g @agent_panes '#{P:#{?#{E:@pane_agent},#{pane_id} ,}}'
bind -N "Paste the last command output into this window's agent" A if-shell -F '#{E:@pane_agent}' {
  display-message 'Press prefix A in a shell pane beside the agent'
} {
  if-shell -F '#{E:@agent_panes}' {
    run-shell 'export TMUX_PANE=#{pane_id}; out=$(tmux-copy-last-output --print); status=$?; if [ "$status" -ne 0 ]; then [ "$status" -eq 3 ] || tmux display-message "tmux-copy-last-output --print failed with status $status"; exit 0; fi; agent="#{s/ .*//:#{E:@agent_panes}}"; tmux send-keys -t "$agent" -X cancel 2>/dev/null; printf "%s" "$out" | tmux load-buffer -b agent-paste - && tmux paste-buffer -p -d -b agent-paste -t "$agent" && tmux select-pane -t "$agent"'
  } {
    display-message 'No agent in this window'
  }
}

# Retire the old manual tmux-tools exporter on already-running servers. Merely
# deleting its bind command would leave a stale prefix+S binding active after
# dot update reloads this file. prefix+R, which once restored, now reloads.
unbind S
bind -N "Reload the tmux configuration" R source-file "$HOME/.config/tmux/tmux.conf" \; display-message 'tmux config reloaded'

# === Clipboard History ===
# Pick from clip history and paste into current pane: prefix+P
# Two phases: popup writes selection to file, then run-shell pastes after popup closes.
bind -N "Pick and paste from clipboard history" P display-popup -E -w 80% -h 60% 'clip pick > "$(tmux-clip-paste --path)" 2>/dev/null' \; run-shell tmux-clip-paste

# === Task Windows ===
# prefix n opens a window for a new task in the current pane's directory: an
# agent on the left (60%) and a shell on the right, named automatically like
# any other window. A menu picks the agent in a fixed order with one key each.
# The agent is typed into the left pane's shell rather than run as the pane's
# command, so quitting it leaves a shell instead of closing the pane. "other"
# asks for any command line (codex resume, claude --resume).
# This takes tmux's default prefix n (next window), and prefix p (previous
# window) goes with it: C-Tab and C-S-Tab switch windows.
# tmux commands take no parameters, so each item spells out the same steps.
# display-menu expands formats in each item's command when it builds the menu,
# so ## keeps #{pane_current_path} for when the command runs: a directory name
# with a quote or $ is then passed as data, never parsed as command text.
# The command line goes in as %1, never %%: tmux 3.8 escapes %% for single
# quotes, which would leave '\'' in a command line with an apostrophe. The
# shell pane splits from #{pane_start_path}, the directory the agent pane was
# given: a new pane's #{pane_current_path} can read empty (or, before tmux 3.7,
# the server's directory) until its process has started.
bind -N "Open a task window: an agent beside a shell" n display-menu -T "#[align=centre]New task window" \
  claude c { new-window -c "##{pane_current_path}" ; send-keys -l claude ; send-keys Enter ; split-window -h -l 40% -c "##{pane_start_path}" ; select-pane -L } \
  codex x { new-window -c "##{pane_current_path}" ; send-keys -l codex ; send-keys Enter ; split-window -h -l 40% -c "##{pane_start_path}" ; select-pane -L } \
  muse m { new-window -c "##{pane_current_path}" ; send-keys -l muse ; send-keys Enter ; split-window -h -l 40% -c "##{pane_start_path}" ; select-pane -L } \
  "shell only" s { new-window -c "##{pane_current_path}" ; split-window -h -l 40% -c "##{pane_start_path}" ; select-pane -L } \
  "other..." o { command-prompt -p "Command:" { new-window -c "##{pane_current_path}" ; send-keys -l "%1" ; send-keys Enter ; split-window -h -l 40% -c "##{pane_start_path}" ; select-pane -L } }
unbind p
# The menu was prefix N at first; dot update reloads this file rather than
# restarting the server, so drop that binding explicitly, as with prefix S.
unbind N

# === Scratch Popups ===
# prefix g opens a throwaway shell in a popup over the current pane, starting
# in its directory, for a quick check (git status, gh, sl) without splitting
# the agent's window; exiting the shell closes it. prefix G runs lazygit there
# the same way, when it is installed. Nothing persists after a popup closes.
bind -N "Open a scratch shell popup in this directory" g display-popup -E -d '#{pane_current_path}' -w 80% -h 75%
bind -N "Open lazygit in a popup in this directory" G if-shell 'command -v lazygit >/dev/null 2>&1' {
  display-popup -E -d '#{pane_current_path}' -w 90% -h 90% lazygit
} {
  display-message 'lazygit is not installed'
}

# === Text Extraction ===
# prefix+Tab fuzzy-picks a path, URL, hash, or word from the pane: Enter copies
# and Tab inserts it at the prompt. shdeps installs extrakto as a plain
# checkout, so source its entrypoint directly rather than through TPM.
# Copies join clipboard history through clip, then also go out over OSC 52,
# which is the only clipboard route back to the terminal from a remote host.
set -g @extrakto_clip_tool 'clip capture && tmux show-buffer | tmux load-buffer -w -'
run-shell 'test ! -x ~/.local/share/laktak/extrakto/extrakto.tmux || exec ~/.local/share/laktak/extrakto/extrakto.tmux'
# The plugin owns its configurable key and command; add only its help note.
run-shell 'if [ -x ~/.local/share/laktak/extrakto/extrakto.tmux ]; then key=$(tmux show-option -gqv @extrakto_key); key=${key:-Tab}; case "$key" in [Nn][Oo][Nn][Ee]) ;; *) tmux bind-key -N "Extract text from pane history" "$key" ;; esac; fi'

# === Automatic Session Persistence ===
# shdeps installs TPM and its plugins as checkouts below this shared owner
# directory. Keep continuum last so its status-right autosave hook survives.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux-plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-dir '~/.local/share/tmux/resurrect/$HOSTNAME'

# Protect snapshots even when shdeps did not need to update the plugin checkout.
run-shell 'base="$HOME/.local/share/tmux/resurrect"; host="$base/$(hostname)"; (umask 077 && mkdir -p "$host") && chmod 0700 "$base" "$host"'

set -g @resurrect-hook-post-save-layout 'ds resurrect save'
set -g @resurrect-hook-pre-restore-all 'ds resurrect begin'
set -g @resurrect-hook-post-restore-all 'ds resurrect restore'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '0'
# tmux-tools owns the generic default-server coordinator. Dotfiles owns only
# this policy: isolated sockets stay inert, while the normal server saves every
# five minutes and publishes restore ownership for consumers such as DS.
set -g @tmux-tools-continuum-save-interval '5'
set -g @tmux-tools-resurrect-auto-restore 'off'

# TPM must load after every plugin option.
run-shell 'test ! -x ~/.local/share/tmux-plugins/tpm/tpm || exec ~/.local/share/tmux-plugins/tpm/tpm'
run-shell '~/.local/bin/tmux-continuum-default-server'
