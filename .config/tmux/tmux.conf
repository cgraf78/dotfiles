# ~/.config/tmux/tmux.conf

# === Defaults ===
run-shell 'shell=$(command -v zsh 2>/dev/null || printf "%s" "$SHELL"); tmux set-option -g default-shell "$shell"; tmux set-option -g default-command "exec $shell -l"'
set -s default-terminal "tmux-256color"
set -s escape-time 10

# Enable true color (24-bit) passthrough
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",*256col*:Tc"

# Pass through modifier+arrow sequences (Ctrl+Left/Right for word navigation).
# Requires a fresh tmux session (not just tmux source) to take effect.
set -g xterm-keys on
set -g extended-keys on
set -s user-keys[0] "\033[777001u"
set -s user-keys[1] "\033[777002u"
set -s user-keys[2] "\033[777003u"
set -s user-keys[3] "\033[777004u"
set -s user-keys[4] "\033[777005u"
set -s user-keys[5] "\033[777006u"
set -s user-keys[6] "\033[777007u"
set -s user-keys[7] "\033[777008u"
set -s user-keys[8] "\033[777009u"
# The outer terminal answers Termnav's read-only DECRQM query with one of five
# standard states. Bind every legal reply so the commit barrier is independent
# of whether bracketed paste is unsupported, set, reset, or permanently fixed.
set -s user-keys[9] "\033[?2004;0\$y"
set -s user-keys[10] "\033[?2004;1\$y"
set -s user-keys[11] "\033[?2004;2\$y"
set -s user-keys[12] "\033[?2004;3\$y"
set -s user-keys[13] "\033[?2004;4\$y"

# Advertise WezTerm/xterm features that tmux cannot infer from terminfo.
# extkeys keeps CSI u key sequences intact; hyperlinks lets tmux re-emit OSC 8.
set -s terminal-features[3] "xterm-256color:extkeys:hyperlinks"

# Let applications handle Ctrl+Shift+Left/Right. tmux binds these by default
# to swap windows, which blocks VSCode-style word selection in nvim.
unbind-key -n C-S-Left
unbind-key -n C-S-Right


# Explicitly forward Shift+Enter as CSI u sequence to the active pane.
# Needed because terminal agents and other apps that don't request extended key
# mode won't receive it via the automatic extkeys passthrough.
bind-key -n S-Enter send-keys Escape '[13;2u'

# === Essentials ===
set -g mouse on
set -g status-keys emacs
set -g mode-keys vi
set -g history-limit 100000
set -g set-clipboard on
set -g focus-events on
set -g detach-on-destroy on
set -g update-environment "SSH_AUTH_SOCK VSCODE_IPC_HOOK_CLI"
setw -g aggressive-resize on

# Bell: propagate bells from background panes/windows to the terminal
set -g bell-action any
set -g visual-bell off

# Allow applications to send OSC escape sequences through tmux to the outer
# terminal (for example, Termnav user-variable routing).
set -g allow-passthrough on

# Terminal user variables are client-local and are not replayed when a new
# client attaches to an existing pane. Claim tmux ownership at attach time so
# Ctrl-Tab reaches this server before any shell or editor needs to redraw.
set-hook -g client-attached[100] {
  if-shell -F '#{==:#{client_control_mode},0}' {
    run-shell '~/.local/bin/termnav-tmux-context --tty #{q:client_tty} --client-termname #{q:client_termname}'
  }
}

# Start numbering at 1, close gaps on window close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# === Status Bar ===
set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left

# Colors (night-owl palette)
set -g status-style 'bg=#011627 fg=#5f7e97'
set -g message-style 'bg=#0b2942 fg=#d6deeb bold'
set -g mode-style 'bg=#1d3b53 fg=#d6deeb bold'

# Left: PREFIX indicator + session
set -g status-left-length 80
set -g status-left '#{?client_prefix,#[fg=#011627 bg=#c792ea bold] PREFIX #[default] ,}#[fg=#82aaff][ #S ] #[default]'

# Right: path + time
set -g status-right-length 120
set -g status-right '#[fg=#5f7e97]#{pane_current_path}  %H:%M '

# Window tabs
setw -g window-status-style 'bg=#011627 fg=#5f7e97'
setw -g window-status-current-style 'bg=#1d3b53 fg=#d6deeb bold'
setw -g window-status-separator ' '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '

# Disable terminal title changes
set -g set-titles off
set -g allow-rename off
setw -g automatic-rename off

# Pane borders
set -g pane-border-status top
# Keep inactive labels readable in terminals without VS Code's contrast correction.
set -g pane-border-format '#{?pane_active,,#[fg=#898989]} #I.#P (#{pane_id})  #{pane_current_command} '
setw -g pane-border-style 'fg=#333333'
setw -g pane-active-border-style 'fg=cyan,bold'

# Dim inactive panes (night-owl palette, 40% dimmed)
set -g window-style 'bg=#010d17'
set -g window-active-style 'bg=#011627'

# Right/left navigate panes if vertical splits exist, otherwise switch windows
bind Right if-shell -F '#{e|<:#{pane_width},#{window_width}}' 'select-pane -R' 'next-window'
bind Left  if-shell -F '#{e|<:#{pane_width},#{window_width}}' 'select-pane -L' 'previous-window'

# Foreground app detectors shared by direct key bindings. tmux's native command
# is a zero-process fast path for direct editor and transport panes. Pipelines
# can report a producer as the process-group leader (`fd | fzf` reports `fd`),
# so native misses retain one process-group scan to find fzf or wrapped apps.
is_vim_native="#{m/r:^g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}"
is_terminal_app_native="#{||:#{m/r:^(g?(view|l?n?vim?x?|fzf)(diff)?|ssh|mosh|mosh-client|mosh-server|et)$,#{pane_current_command}},#{&&:#{mouse_any_flag},#{m/r:^(tmux|screen)(:.*)?$,#{pane_current_command}}}}"
is_vim="ps -o state= -o ucomm= -o pgid= -o tpgid= -t '#{pane_tty}' | awk '\$3 == \$4 && \$1 !~ /^[TXZ]/ && \$2 ~ /^g?(view|l?n?vim?x?|fzf)(diff)?$/ { found = 1 } END { exit !found }'"
is_terminal_app="ps -o state= -o ucomm= -o pgid= -o tpgid= -t '#{pane_tty}' | awk -v mouse='#{mouse_any_flag}' '\$1 !~ /^[TXZ]/ && \$(NF-1) == \$(NF) && (\$2 ~ /^(g?(view|l?n?vim?x?|fzf)(diff)?|ssh|mosh|mosh-client|mosh-server|et)$/ || (mouse == 1 && \$2 ~ /^(tmux|screen):?$/)) { found = 1 } END { exit !found }'"
# Pane navigation needs stronger ownership evidence than Ctrl+Tab: forwarding
# Ctrl+h into a plain remote shell produces backspace. Inner tmux, screen, and
# terminal apps propagate mouse mode through the transport, so combine that
# focus signal with the same foreground-process rules used by tab navigation.
is_pane_navigation_native="#{||:$is_vim_native,#{&&:#{mouse_any_flag},$is_terminal_app_native}}"
is_pane_navigation="ps -o state= -o ucomm= -o pgid= -o tpgid= -t '#{pane_tty}' | awk -v mouse='#{mouse_any_flag}' '\$1 !~ /^[TXZ]/ && \$(NF-1) == \$(NF) && (\$2 ~ /^g?(view|l?n?vim?x?|fzf)(diff)?$/ || (mouse == 1 && \$2 ~ /^(ssh|mosh|mosh-client|mosh-server|et|tmux|screen):?$/)) { found = 1 } END { exit !found }'"
is_nested_tmux_client="case '#{client_termname}' in tmux*|screen*) exit 0 ;; *) exit 1 ;; esac"
# mouse_any_flag alone is not enough to decide a chord belongs to the
# foreground app: any TUI (Claude Code, codex, htop -m, ...) can turn on
# mouse reporting for its own scrolling/clicking without wanting to own
# Ctrl+Tab. Only trust the flag when the foreground process is itself an
# opaque nested multiplexer (bare tmux/screen, not over ssh — transports are
# already covered by is_terminal_app) whose *inner* content we can't inspect.
# The process fallback accepts tmux's ucomm suffix ("tmux: client") and finds
# it behind wrappers such as ds while keeping ordinary tmuxinator commands out.
send_ctrl_tab="send-keys Escape '[9;5u'"
send_ctrl_shift_tab="send-keys Escape '[9;6u'"
send_alt_shift_left_bracket="send-keys Escape '{'"
send_alt_shift_right_bracket="send-keys Escape '}'"
switch_wezterm_tab_next="run-shell -b '~/.local/bin/wezterm-switch-tab next #{client_tty}'"
switch_wezterm_tab_previous="run-shell -b '~/.local/bin/wezterm-switch-tab previous #{client_tty}'"
switch_parent_tab_next="run-shell -b '~/.local/bin/wezterm-switch-tab --parent next #{client_tty}'"
switch_parent_tab_previous="run-shell -b '~/.local/bin/wezterm-switch-tab --parent previous #{client_tty}'"
switch_tab_next="run-shell -b '~/.local/bin/termnav-switch-tab next --client-pid #{client_pid} --client-tty #{q:client_tty} --client-termtype #{q:client_termtype}'"
switch_tab_previous="run-shell -b '~/.local/bin/termnav-switch-tab previous --client-pid #{client_pid} --client-tty #{q:client_tty} --client-termtype #{q:client_termtype}'"
move_wezterm_tab_left="run-shell -b '~/.local/bin/wezterm-move-tab left #{client_tty}'"
move_wezterm_tab_right="run-shell -b '~/.local/bin/wezterm-move-tab right #{client_tty}'"
move_parent_tab_left="run-shell -b '~/.local/bin/termnav-relay send move left --client-pid #{client_pid} --client-tty #{q:client_tty} 2>/dev/null; if [ $? -eq 3 ]; then ~/.local/bin/wezterm-move-tab --parent left #{client_tty}; fi'"
move_parent_tab_right="run-shell -b '~/.local/bin/termnav-relay send move right --client-pid #{client_pid} --client-tty #{q:client_tty} 2>/dev/null; if [ $? -eq 3 ]; then ~/.local/bin/wezterm-move-tab --parent right #{client_tty}; fi'"
select_parent_pane_left="run-shell -b '~/.local/bin/termnav-relay send pane left --client-pid #{client_pid} --client-tty #{q:client_tty} 2>/dev/null; if [ $? -eq 3 ]; then ~/.local/bin/wezterm-select-pane --parent left #{client_tty}; fi'"
select_parent_pane_down="run-shell -b '~/.local/bin/termnav-relay send pane down --client-pid #{client_pid} --client-tty #{q:client_tty} 2>/dev/null; if [ $? -eq 3 ]; then ~/.local/bin/wezterm-select-pane --parent down #{client_tty}; fi'"
select_parent_pane_up="run-shell -b '~/.local/bin/termnav-relay send pane up --client-pid #{client_pid} --client-tty #{q:client_tty} 2>/dev/null; if [ $? -eq 3 ]; then ~/.local/bin/wezterm-select-pane --parent up #{client_tty}; fi'"
select_parent_pane_right="run-shell -b '~/.local/bin/termnav-relay send pane right --client-pid #{client_pid} --client-tty #{q:client_tty} 2>/dev/null; if [ $? -eq 3 ]; then ~/.local/bin/wezterm-select-pane --parent right #{client_tty}; fi'"

# Ctrl+Tab mirrors app tab-switching for tmux windows. Prefix+Left/Right above
# stays available for pane-aware navigation. Unbind Alt+Tab so sourcing this
# config clears any older experimental binding from a live tmux server. Forward
# the chord when nvim/fzf owns the foreground pane, or when mouse reporting
# proves that a nested tmux/screen or remote application wants raw input. A
# plain SSH/mosh/ET shell stays at this tmux layer instead of swallowing the chord.
# If this tmux session has one window, pass the triggering client's
# identity to termnav. It walks locally nested tmux parents before selecting the
# outer VS Code or WezTerm client. Parent selection requires the exact active
# pane, then uses activity and focused-client state; unresolved ties fail closed
# instead of guessing. Move chords retain their existing host policy because VS
# Code exposes no command to reorder terminal tabs (drag-only).
unbind-key -n M-Tab
unbind-key -n M-BTab
bind-key -n C-Tab if-shell -F "$is_pane_navigation_native" "$send_ctrl_tab" { if-shell "$is_pane_navigation" "$send_ctrl_tab" { if-shell -F '#{>:#{session_windows},1}' 'next-window' "$switch_tab_next" } }
bind-key -n C-BTab if-shell -F "$is_pane_navigation_native" "$send_ctrl_shift_tab" { if-shell "$is_pane_navigation" "$send_ctrl_shift_tab" { if-shell -F '#{>:#{session_windows},1}' 'previous-window' "$switch_tab_previous" } }
bind-key -n User0 if-shell -F '#{>:#{session_windows},1}' 'next-window' { if-shell "$is_nested_tmux_client" "$switch_parent_tab_next" "$switch_wezterm_tab_next" }
bind-key -n User1 if-shell -F '#{>:#{session_windows},1}' 'previous-window' { if-shell "$is_nested_tmux_client" "$switch_parent_tab_previous" "$switch_wezterm_tab_previous" }
bind-key -n 'M-{' if-shell -F "$is_terminal_app_native" "$send_alt_shift_left_bracket" { if-shell "$is_terminal_app" "$send_alt_shift_left_bracket" { if-shell -F '#{==:#{session_windows},1}' { if-shell -F '#{m:xterm.js*,#{client_termtype}}' 'display-message -p ""' { if-shell "$is_nested_tmux_client" "$move_parent_tab_left" "$move_wezterm_tab_left" } } { if-shell -F '#{>:#{window_index},#{base-index}}' 'swap-window -d -t :-' 'display-message -p ""' } } }
bind-key -n 'M-}' if-shell -F "$is_terminal_app_native" "$send_alt_shift_right_bracket" { if-shell "$is_terminal_app" "$send_alt_shift_right_bracket" { if-shell -F '#{==:#{session_windows},1}' { if-shell -F '#{m:xterm.js*,#{client_termtype}}' 'display-message -p ""' { if-shell "$is_nested_tmux_client" "$move_parent_tab_right" "$move_wezterm_tab_right" } } { if-shell -F '#{<:#{window_index},#{e|+:#{base-index},#{e|-:#{session_windows},1}}}' 'swap-window -d -t :+' 'display-message -p ""' } } }
bind-key -n User2 if-shell -F '#{==:#{session_windows},1}' { if-shell "$is_nested_tmux_client" "$move_parent_tab_left" "$move_wezterm_tab_left" } { if-shell -F '#{>:#{window_index},#{base-index}}' 'swap-window -d -t :-' 'display-message -p ""' }
bind-key -n User3 if-shell -F '#{==:#{session_windows},1}' { if-shell "$is_nested_tmux_client" "$move_parent_tab_right" "$move_wezterm_tab_right" } { if-shell -F '#{<:#{window_index},#{e|+:#{base-index},#{e|-:#{session_windows},1}}}' 'swap-window -d -t :+' 'display-message -p ""' }

# vim-tmux-navigator: seamless Ctrl+h/j/k/l between tmux panes and nvim splits.
# At a remote tmux edge, send a semantic request through the initiating SSH
# client's owner-only relay. Each host handles its nearest tmux scope or passes
# the request to its own parent at any depth. The top terminal returns the
# standard DECRQM response bound below; no terminal-specific integration is
# required.
# The relay is the ordered primary; WezTerm is only invoked when the relay
# reports declined (exit 3). Transport errors (exit 1) do nothing.
# The WezTerm request remains as a compatibility fallback for connections made
# before relay support was installed.
bind-key -n 'C-h' if-shell -F "$is_pane_navigation_native" 'send-keys C-h' { if-shell "$is_pane_navigation" 'send-keys C-h' { if-shell -F '#{pane_at_left}' "$select_parent_pane_left" 'select-pane -L' } }
bind-key -n 'C-j' if-shell -F "$is_pane_navigation_native" 'send-keys C-j' { if-shell "$is_pane_navigation" 'send-keys C-j' { if-shell -F '#{pane_at_bottom}' "$select_parent_pane_down" 'select-pane -D' } }
bind-key -n 'C-k' if-shell -F "$is_pane_navigation_native" 'send-keys C-k' { if-shell "$is_pane_navigation" 'send-keys C-k' { if-shell -F '#{pane_at_top}' "$select_parent_pane_up" 'select-pane -U' } }
bind-key -n 'C-l' if-shell -F "$is_pane_navigation_native" 'send-keys C-l' { if-shell "$is_pane_navigation" 'send-keys C-l' { if-shell -F '#{pane_at_right}' "$select_parent_pane_right" 'select-pane -R' } }
bind-key -n User4 select-pane -L
bind-key -n User5 select-pane -D
bind-key -n User6 select-pane -U
bind-key -n User7 select-pane -R
# User8 carries a commit inward between nested tmux layers. User9 through
# User13 consume every legal outer-terminal response to Termnav's DECRQM
# barrier. Foreground run-shell (no -b) pauses that client's input until the
# per-client FIFO directive is claimed and executed. If no directive is
# pending, terminal response keys are passed back to the originating pane so
# applications remain compatible with tmux releases that do not virtualize
# DECRQM. Per-client FIFO (seq-ordered) prevents cross-client consumption.
bind-key -n User8 run-shell '~/.local/bin/termnav-relay commit --tmux-socket #{socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid}'
bind-key -n User9 run-shell '~/.local/bin/termnav-relay commit --tmux-socket #{socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --passthrough-decrqm 0 --pane #{pane_id}'
bind-key -n User10 run-shell '~/.local/bin/termnav-relay commit --tmux-socket #{socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --passthrough-decrqm 1 --pane #{pane_id}'
bind-key -n User11 run-shell '~/.local/bin/termnav-relay commit --tmux-socket #{socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --passthrough-decrqm 2 --pane #{pane_id}'
bind-key -n User12 run-shell '~/.local/bin/termnav-relay commit --tmux-socket #{socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --passthrough-decrqm 3 --pane #{pane_id}'
bind-key -n User13 run-shell '~/.local/bin/termnav-relay commit --tmux-socket #{socket_path} --client-tty #{q:client_tty} --client-pid #{client_pid} --passthrough-decrqm 4 --pane #{pane_id}'

# Ctrl-click means "follow this item". The forward-vs-handle decision keys off
# #{mouse_any_flag}: tmux sets it whenever the pane's foreground application has
# turned on mouse reporting. That is the precise "this app wants the raw mouse
# event" signal, and it is true for nvim (LSP/Buck goto under the click), for a
# nested tmux (which requests mouse events from its parent), and for an ssh/mosh
# pane whose remote tmux/nvim enabled mouse -- the DECSET propagates up through
# the transport transparently, so the flag is set even several layers deep.
#
# When the flag is set we send-keys -M, handing the event to that inner layer.
# Each layer re-applies this same binding, so the click recurses down to the
# innermost mouse-aware program and is handled there natively (correct click
# coordinates, correct pane capture, correct nvim target) -- for arbitrary
# nesting depth, local or remote, with no host detection required. Only when no
# application wants the mouse (a bare shell, flag unset) does this outer tmux
# extract the link itself and route it through the nvim opener.
#
# Pass click fields through a quoted here-doc instead of inline VAR=value
# assignments. Screen text can start with tabs/spaces or contain shell-looking
# tokens; here-doc input keeps it as data until tmux-follow-click parses it.
bind-key -n C-MouseDown1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'select-pane -t ='
bind-key -n C-MouseDrag1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'display-message -p ""'
bind-key -n C-MouseUp1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'run-shell -b "~/.local/bin/tmux-follow-click --stdin <<\"__DOT_TMUX_CLICK__\"\n#{mouse_hyperlink}\n#{mouse_word}\n#{mouse_line}\n#{mouse_x}\n#{pane_current_path}\n#{client_tty}\n#{pane_id}\n#{mouse_y}\n#{pane_top}\n#{pane_left}\n__DOT_TMUX_CLICK__"'

# === Copy Mode ===
# Don't copy on mouse release — stay in copy mode with selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Escape exits copy mode without copying.
bind -T copy-mode-vi Escape send-keys -X cancel

# Ctrl-c copies through tmux's OSC 52 path and records history. clip capture
# also mirrors to a local macOS, Wayland, or X11 clipboard, but deliberately
# succeeds on remote hosts where OSC 52 is the only available path.
bind -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel "clip capture"
# Keep Enter equivalent to Ctrl-c so keyboard and mouse-selected text both use
# the same remote-safe OSC 52 route and clipboard history.
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip capture"

# Match desktop-editor selection behavior without changing normal pane input.
# The first modified-arrow creates an anchor; further presses move the active
# end so the selection grows or shrinks naturally in either direction.
bind -T copy-mode-vi S-Left if -F '#{selection_active}' 'send-keys -X cursor-left' { send-keys -X begin-selection \; send-keys -X cursor-left }
bind -T copy-mode-vi S-Right if -F '#{selection_active}' 'send-keys -X cursor-right' { send-keys -X begin-selection \; send-keys -X cursor-right }
bind -T copy-mode-vi S-Up if -F '#{selection_active}' 'send-keys -X cursor-up' { send-keys -X begin-selection \; send-keys -X cursor-up }
bind -T copy-mode-vi S-Down if -F '#{selection_active}' 'send-keys -X cursor-down' { send-keys -X begin-selection \; send-keys -X cursor-down }
bind -T copy-mode-vi C-S-Left if -F '#{selection_active}' 'send-keys -X previous-word' { send-keys -X begin-selection \; send-keys -X previous-word }
bind -T copy-mode-vi C-S-Right if -F '#{selection_active}' 'send-keys -X next-word-end' { send-keys -X begin-selection \; send-keys -X next-word-end }

# VS Code and WezTerm intercept Ctrl-v and paste from the client clipboard,
# which is the only reliable path on a remote host. This binding is the local
# fallback for terminals that pass Ctrl-v through to tmux.
bind -n C-v run "bash -o pipefail -c 'clip paste | tmux load-buffer -' && tmux paste-buffer -p"

# Ctrl-Shift-v opens yank history in nvim. Forward a private sequence
# explicitly so this doesn't fall through to tmux's plain Ctrl-v paste binding.
bind -n C-S-v send-keys Escape '[778899~'

# Left-click repositions cursor in copy mode (keeps mode active for long selections)
bind -T copy-mode-vi MouseDown1Pane if -F '#{selection_active}' 'send-keys -X cancel' 'send-keys -X clear-selection'
# Right-click exits copy mode without copying
bind -T copy-mode-vi MouseDown3Pane send-keys -X cancel

# Copy last command output to clipboard (pane-aware, works with splits)
bind o run-shell 'tmux-copy-last-output'
bind O command-prompt -p 'Copy last N commands:' 'run-shell "tmux-copy-last-output %1"'

# Open file in nvim pane (used by terminal hyperlink click handlers)
bind e command-prompt -p 'nvim-open:' { run-shell 'nvim-tmux-open link "%%"' }

# Retire the old manual tmux-tools exporter/restorer on already-running
# servers. Merely deleting their bind commands would leave stale prefix+S/R
# bindings active after dot update reloads this file.
unbind S
unbind R

# === Clipboard History ===
# Pick from clip history and paste into current pane: prefix+P
# Two phases: popup writes selection to file, then run-shell pastes after popup closes.
bind P display-popup -E -w 80% -h 60% 'clip pick > "$(tmux-clip-paste --path)" 2>/dev/null' \; run-shell tmux-clip-paste

# === Automatic Session Persistence ===
# shdeps installs TPM and its plugins as checkouts below this shared owner
# directory. Keep continuum last so its status-right autosave hook survives.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux-plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-dir '~/.local/share/tmux/resurrect/$HOSTNAME'

# Protect snapshots even when shdeps did not need to update the plugin checkout.
run-shell 'base="$HOME/.local/share/tmux/resurrect"; host="$base/$(hostname)"; (umask 077 && mkdir -p "$host") && chmod 0700 "$base" "$host"'

set -g @resurrect-hook-post-save-layout 'ds resurrect save'
set -g @resurrect-hook-pre-restore-all 'ds resurrect begin'
set -g @resurrect-hook-post-restore-all 'ds resurrect restore'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '0'
# tmux-tools owns the generic default-server coordinator. Dotfiles owns only
# this policy: isolated sockets stay inert, while the normal server saves every
# five minutes and publishes restore ownership for consumers such as DS.
set -g @tmux-tools-continuum-save-interval '5'
set -g @tmux-tools-resurrect-auto-restore 'off'

# TPM must load after every plugin option.
run-shell 'test ! -x ~/.local/share/tmux-plugins/tpm/tpm || exec ~/.local/share/tmux-plugins/tpm/tpm'
run-shell '~/.local/bin/tmux-continuum-default-server'
