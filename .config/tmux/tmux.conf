# ~/.config/tmux/tmux.conf

# This config needs tmux 3.3 or newer. An older server, such as a host's own
# older tmux started before the one this config installs, loads none of it:
# its status line and a message as each client attaches say why, and it runs
# with tmux's defaults. The guard uses only plain globs and two-operand ||,
# which every tmux with %if (2.7 and later) reads, and it matches only
# versions recognisably below the floor, so an unreleased or unknown version
# loads everything. The marker below is the floor's one statement; tests
# derive every other one from it.
# tmux minimum: 3.3
%if "#{||:#{m:[0-2].*,#{version}},#{||:#{m:3.[0-2],#{version}},#{||:#{m:3.[0-2][a-z],#{version}},#{||:#{m:3.[0-2]-*,#{version}},#{||:#{m:next-[0-2].*,#{version}},#{||:#{m:next-3.[0-2],#{version}},#{||:#{m:next-3.[0-2][a-z],#{version}},#{m:next-3.[0-2]-*,#{version}}}}}}}}}"
set -g status-left-length 100
set -g status-left "#[reverse] This tmux config needs tmux 3.3 or newer; this is #{version} #[default] "
set-hook -g client-attached 'display-message "This tmux config needs tmux 3.3 or newer; this is #{version}. Nothing else was loaded."'
%else
# Load capability fragments in lexical order. Missing optional fragments are
# ignored so the base profile remains independently usable.
source-file -q "$HOME/.config/tmux/conf.d/*.conf"
%endif
