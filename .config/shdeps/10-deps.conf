# Dependency registry for dotfiles — everything except toolchains.
# Format: name  method  [cmd]  [aliases]  [filter]
#
# method:     pkg | github | github:repo | github:release | cargo | go | uv | npm | custom
# cmd:        command to check (defaults to name if omitted or -).
#             Supports mgr:name qualifiers (e.g. apt:batcat).
# aliases:    For pkg: per-manager package name overrides as mgr:name pairs,
#             comma-separated (e.g. apt:fd-find,dnf:fd-find). Use NONE to
#             skip on a platform (e.g. apt:NONE). Use - for no overrides.
# filter:     comma-separated filter tokens with os: or host: prefixes.
#             os: matches platform (linux, macos, wsl). Prefix ! to exclude.
#             host: matches hostname (hostname -s, case-insensitive).
#
# Prerequisites: git (all platforms), brew (macOS) must be pre-installed.
# Adding a new system package: just add "name  pkg" — no code changes.
# Language toolchains live in 00-toolchains.conf and install first.
#
# Entries below are grouped by method for readability. Within a method
# they're alphabetical; cross-method order within this file does not
# affect behavior since shdeps dispatches by method cohort.
#
# Platform strategy (os:macos / os:!macos):
#
#   Many tools appear twice: once as `pkg os:macos` (brew, signed
#   binaries) and once as `github os:!macos` (prefer a matching prebuilt
#   release binary, otherwise fall back to a repo checkout). On macOS, brew is
#   preferred because Homebrew formulae produce signed binaries that pass
#   Gatekeeper; unsigned downloads (mise aqua/ubi, GitHub releases) get killed
#   at runtime.
#
#   On Linux, brew is unavailable. Tools with a `github` counterpart let
#   shdeps choose the best GitHub-backed method for that host. Tools with only
#   `os:macos` and no GitHub counterpart are managed by mise (aqua/ubi) on
#   Linux — see ~/.config/mise/config.toml.
#
#   `os:!macos` is used for Linux system packages that macOS ships
#   natively or doesn't need (e.g. cron, diffutils, zsh).

# name                                     method           cmd           aliases                                        filter
# ────                                     ──────           ───           ───────                                        ──────

# ┌─────────────────────────────────────────────────────────────────────
# │ System packages — brew/apt/dnf/pacman/zypper/apk
# └─────────────────────────────────────────────────────────────────────

# -- Shell & terminal ------------------------------------------------
atuin                                      pkg
autossh                                    pkg              -             apk:NONE
bash-completion                            pkg              -             brew:bash-completion@2
zsh                                        pkg              -             -                                              os:!macos

# -- Core CLI tools --------------------------------------------------
bat                                        pkg              android:bat,apt:batcat
diffutils                                  pkg              cmp           -                                              os:!macos
eza                                        pkg
fd                                         pkg              android:fd,apt:fdfind android:fd,apt:fd-find,dnf:fd-find
fzf                                        pkg
htop                                       pkg
hyperfine                                  pkg
jq                                         pkg
ncdu                                       pkg
ripgrep                                    pkg              rg
tree                                       pkg
unzip                                      pkg
zip                                        pkg
zoxide                                     pkg

# -- Git & version control -------------------------------------------
gh                                         pkg              -             pacman:github-cli,apk:github-cli
git-absorb                                 pkg              -             zypper:NONE
git-delta                                  pkg              delta         apk:delta
difftastic                                 pkg              difft         -                                              os:macos,os:android
gitleaks                                   pkg              -             -                                              os:macos
jj                                         pkg              -             -                                              os:macos
lazygit                                    pkg              -             -                                              os:macos,os:android

# -- Editors & dev environment ---------------------------------------
direnv                                     pkg              -             -                                              os:macos,os:android
mise                                       pkg              -             -                                              os:macos,os:android

# -- System utilities (Linux only) -----------------------------------
cron                                       pkg              crontab       android:cronie,dnf:cronie,pacman:cronie,zypper:cronie,apk:dcron os:!macos

# -- Monitoring & TUI ------------------------------------------------
bottom                                     pkg              btm           -                                              os:macos
dust                                       pkg              -             -                                              os:macos,os:android
gum                                        pkg              -             -                                              os:macos,os:android

# -- C/C++ toolchain -------------------------------------------------
clang-format                               pkg              -             android:clang,dnf:clang-tools-extra,pacman:clang,zypper:NONE,apk:NONE
clangd                                     pkg              -             android:clang,brew:llvm,dnf:clang-tools-extra,pacman:clang,zypper:NONE,apk:NONE
rustfmt                                    pkg              -             android:rust,brew:rust,pacman:rust,zypper:rust,apk:rust
tree-sitter-cli                            pkg              tree-sitter   android:tree-sitter,brew:tree-sitter,apt:tree-sitter-cli,dnf:tree-sitter-cli,pacman:tree-sitter-cli,zypper:tree-sitter-cli,apk:tree-sitter-cli

# -- Formatters & linters (pkg on macOS, mise/custom on Linux) -------
