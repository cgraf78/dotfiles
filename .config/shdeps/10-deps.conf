dockerfmt                                  pkg              -             -                                              os:macos
editorconfig-checker                       pkg              -             -                                              os:macos
gofumpt                                    pkg              -             -                                              os:macos
goimports                                  pkg              -             -                                              os:macos
golangci-lint                              pkg              -             -                                              os:macos
hadolint                                   pkg              -             -                                              os:macos
superhtml                                  pkg              -             -                                              os:macos
yq                                         pkg              -             -                                              os:macos

# -- Language servers (brew on macOS, Mason/mise on Linux) ------------
docker-language-server                     pkg              -             -                                              os:macos
gopls                                      pkg              -             -                                              os:macos
neocmakelsp                                pkg              -             -                                              os:macos

# ┌─────────────────────────────────────────────────────────────────────
# │ GitHub projects — release asset when compatible, repo checkout otherwise
# │
# │ Entries with `os:!macos` are the Linux/WSL counterparts for tools installed
# │ via brew on macOS. Brew keeps those binaries signed for Gatekeeper, while
# │ Linux/WSL can use shdeps' GitHub resolver to prefer a release asset and
# │ fall back to a repo checkout when upstream has no compatible asset.
# └─────────────────────────────────────────────────────────────────────
