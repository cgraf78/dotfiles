# Dependency registry for dotfiles — toolchains.
# Format: name  method  [cmd]  [aliases]  [filter]
#
# method:     pkg | github | github:repo | github:release | cargo | go | uv | npm | custom
# cmd:        command to check (defaults to name if omitted or -).
#             Supports mgr:name qualifiers (e.g. apt:batcat).
# aliases:    For pkg: per-manager package name overrides as mgr:name pairs,
#             comma-separated (e.g. apt:fd-find,dnf:fd-find). Use NONE to
#             skip on a platform (e.g. apt:NONE). Use - for no overrides.
# filter:     comma-separated filter tokens with os: or host: prefixes.
#             os: matches platform (linux, macos, wsl). Prefix ! to exclude.
#             host: matches hostname (hostname -s, case-insensitive).
#
# Prerequisites: git (all platforms), brew (macOS) must be pre-installed.
# Adding a new system package: just add "name  pkg" to 10-deps.conf — no
# code changes.
#
# This file loads first (00-*). shdeps installs `pkg` deps before non-pkg
# deps, so the language toolchains here are available on PATH before any
# `cargo`/`go`/`uv` method dep in 10-deps.conf runs on first install.
# `astral-sh/uv` is listed here rather than with other GitHub-managed deps so
# its binary installs before any uv method dep later in the stack. The bare
# `github` method lets shdeps prefer a release asset when one matches this host
# while still falling back to a repo checkout if upstream stops publishing one.

# name                                    method           cmd           aliases                                        filter
# ────                                    ──────           ───           ───────                                        ──────

# Rust — brings `cargo`. Rust components have manager-specific package
# boundaries: brew/pacman bundle rustc + cargo + rustfmt + clippy in `rust`,
# Debian/Alpine split clippy into `rust-clippy`, and Fedora's Rust source
# package exposes a `clippy` subpackage. rust-analyzer also needs
# standard-library sources; Linux package managers commonly split those into
# `rust-src`. Also, rust-toolchain is needed to ensure a default Rust toolchain
# is active. On platforms that install rustup as a shim (apt, brew CI runners),
# no toolchain is selected by default.
cargo                                     pkg              -             android:rust,brew:rust,pacman:rust
clippy                                    pkg              cargo-clippy  android:rust,apt:rust-clippy,brew:rust,pacman:rust,zypper:rust,apk:rust-clippy
rust-src                                  pkg              -             android:rust,brew:NONE,apt:rust-src,dnf:rust-src,pacman:rust-src,zypper:NONE,apk:rust-src os:!macos
rust-toolchain                            custom

# Go toolchain. Debian/Ubuntu call the package `golang-go`; RHEL/CentOS/Fedora
# call it `golang`. brew and pacman use the default `go`.
go                                        pkg              -             android:golang,apt:golang-go,dnf:golang

# Python — prefer one shared interpreter from the native package manager.
# python-minimum runs after built-in installers to enforce the 3.11 floor; it
# tries a native versioned package before falling back to a per-user uv build.
python                                    pkg              python3       apt:python3,dnf:python3,zypper:python3,apk:python3
python-venv                               pkg              -             android:NONE,brew:NONE,apt:python3-venv,dnf:NONE,pacman:NONE,zypper:NONE,apk:NONE

# uv — Astral's Python CLI tool installer. Use native packages on macOS and
# Android; upstream release assets cover the remaining platforms.
uv                                        pkg              -             -                                              os:macos,os:android
astral-sh/uv                              github           uv            -                                              os:!macos,os:!android
python-minimum                            custom           python3
