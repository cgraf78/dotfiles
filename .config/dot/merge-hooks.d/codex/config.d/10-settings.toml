project_doc_fallback_filenames = ["AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md"]

# Base defaults (formerly the `default` profile). Bare `codex` uses these base
# keys directly. Named profiles live in standalone ~/.codex/<name>.config.toml
# overlays rendered from the codex/profiles/<name>.d fragments; `--profile NAME`
# loads config.toml first, then layers the matching overlay on top, so base
# [hooks]/[mcp_servers]/[tui] still apply under every profile (including the
# allow_all alias).
model = "gpt-5.5"
model_reasoning_effort = "medium"
model_verbosity = "medium"

[features]
hooks = true
# Opted-in feature toggles, tracked here so they survive Codex's own config
# rewrites and apply across all profiles. Codex's `= false` defaults are omitted
# on purpose; they add churn without changing behavior.
memories = true
goals = true
terminal_resize_reflow = true


[tui]
status_line = [
  "current-dir",
  "git-branch",
  "model-with-reasoning",
  "context-remaining",
  "used-tokens",
  "five-hour-limit",
  "weekly-limit",
  "fast-mode",
  "thread-title",
]
status_line_use_colors = true

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "CODEX_GITHUB_PERSONAL_ACCESS_TOKEN"

# Lifecycle hooks use the shared agent-hook-* scripts. Codex does not
# consistently export a Codex-specific env var to hook subprocesses, so the
# managed commands set AGENTGUARD_NAME and AGENTGUARD_SESSION_ID at the config
# boundary.
# Depending on the Codex runtime, lifecycle hooks may include SessionEnd while
# attention hooks arrive as PermissionRequest. Wire every supported shared
# agent-hook-* entry here so base Codex config stays agentguard-complete.
# Depending on the Codex runtime, shell commands arrive as either Bash or
# exec_command tool calls; both carry shell text and need the same guards.
# File edits likewise arrive as Edit/Write or apply_patch, depending on
# whether the runtime exposes Claude-compatible or Codex API tool names.

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "env AGENTGUARD_NAME=codex AGENTGUARD_SESSION_ID=\"${CODEX_THREAD_ID:-}\" agent-hook-session-start"
timeout = 10

[[hooks.PreToolUse]]
matcher = "Bash|exec_command|functions[.]exec_command"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "env AGENTGUARD_NAME=codex AGENTGUARD_SESSION_ID=\"${CODEX_THREAD_ID:-}\" agent-hook-pre-bash"
timeout = 600

[[hooks.PreToolUse]]
matcher = "Edit|Write|apply_patch|functions[.]apply_patch"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "env AGENTGUARD_NAME=codex AGENTGUARD_SESSION_ID=\"${CODEX_THREAD_ID:-}\" agent-hook-pre-edit"
timeout = 10

[[hooks.PreToolUse]]
matcher = "mcp__"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "env AGENTGUARD_NAME=codex AGENTGUARD_SESSION_ID=\"${CODEX_THREAD_ID:-}\" agent-hook-pre-mcp"
timeout = 10

[[hooks.PostToolUse]]
matcher = "Edit|Write|apply_patch|functions[.]apply_patch"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "env AGENTGUARD_NAME=codex AGENTGUARD_SESSION_ID=\"${CODEX_THREAD_ID:-}\" agent-hook-post-edit"
timeout = 60

[[hooks.PostToolUse]]
matcher = "Bash|exec_command|functions[.]exec_command"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "env AGENTGUARD_NAME=codex AGENTGUARD_SESSION_ID=\"${CODEX_THREAD_ID:-}\" agent-hook-post-bash"
timeout = 120

[[hooks.PostToolUse]]
matcher = "mcp__"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "env AGENTGUARD_NAME=codex AGENTGUARD_SESSION_ID=\"${CODEX_THREAD_ID:-}\" agent-hook-post-mcp"
timeout = 10

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "env AGENTGUARD_NAME=codex AGENTGUARD_SESSION_ID=\"${CODEX_THREAD_ID:-}\" agent-hook-stop"

[[hooks.SessionEnd]]
[[hooks.SessionEnd.hooks]]
type = "command"
command = "env AGENTGUARD_NAME=codex AGENTGUARD_SESSION_ID=\"${CODEX_THREAD_ID:-}\" agent-hook-session-end"
timeout = 30

[[hooks.PermissionRequest]]
[[hooks.PermissionRequest.hooks]]
type = "command"
command = "env AGENTGUARD_NAME=codex AGENTGUARD_SESSION_ID=\"${CODEX_THREAD_ID:-}\" agent-hook-notification"

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "env AGENTGUARD_NAME=codex AGENTGUARD_SESSION_ID=\"${CODEX_THREAD_ID:-}\" agent-hook-prompt-submit"
timeout = 10
