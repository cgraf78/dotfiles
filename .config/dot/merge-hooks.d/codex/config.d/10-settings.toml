project_doc_fallback_filenames = ["AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md"]

# Base defaults (formerly the `default` profile). Bare `codex` uses these base
# keys directly. Named profiles live in standalone ~/.codex/<name>.config.toml
# overlays rendered from the codex/profiles/<name>.d fragments; `--profile NAME`
# loads config.toml first, then layers the matching overlay on top, so base
# [hooks]/[mcp_servers]/[tui] still apply under every profile (including the
# allow_all alias).
model = "gpt-5.5"
model_reasoning_effort = "medium"
model_verbosity = "medium"

[features]
# Opted-in feature toggles, tracked here so they survive Codex's own config
# rewrites and apply across all profiles. Codex's `= false` defaults are omitted
# on purpose; they add churn without changing behavior.
# AgentGuard's dependency-owned fragment enables native hooks separately, so
# this local policy file does not duplicate that provider-owned setting.
memories = true
goals = true
terminal_resize_reflow = true


[tui]
status_line = [
  "current-dir",
  "git-branch",
  "model-with-reasoning",
  "context-remaining",
  "used-tokens",
  "five-hour-limit",
  "weekly-limit",
  "fast-mode",
  "thread-title",
]
status_line_use_colors = true

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "CODEX_GITHUB_PERSONAL_ACCESS_TOKEN"
