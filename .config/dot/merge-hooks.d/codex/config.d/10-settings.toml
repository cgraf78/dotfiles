# Base settings shared by bare `codex` and named profiles. Model policy belongs
# only in the explicitly selected overlays under codex/profiles/<name>.d;
# config.toml leaves Codex free to preserve or choose the machine-local model,
# reasoning, verbosity, provider, and service tier.
project_doc_fallback_filenames = ["AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md"]

[features]
# Opted-in feature toggles, tracked here so they survive Codex's own config
# rewrites and apply across all profiles. Codex's `= false` defaults are omitted
# on purpose; they add churn without changing behavior.
# AgentGuard's dependency-owned fragment enables native hooks separately, so
# this local policy file does not duplicate that provider-owned setting.
memories = true
goals = true
terminal_resize_reflow = true


[tui]
status_line = [
  "current-dir",
  "git-branch",
  "model-with-reasoning",
  "context-remaining",
  "used-tokens",
  "five-hour-limit",
  "weekly-limit",
  "fast-mode",
  "thread-title",
]
status_line_use_colors = true

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "CODEX_GITHUB_PERSONAL_ACCESS_TOKEN"
