# Global mise config — tools that mise manages at the user level.
#
# Loaded by mise automatically from $XDG_CONFIG_HOME/mise/config.toml.
# The dot merge hook runs `mise install --locked` on every `dot update`, so
# additions here are picked up even when the mise package itself does not change.
#
# Global developer toolset migrated from shdeps. Prefer the
# `aqua:<owner>/<repo>` backend when a tool ships prebuilt
# github-release binaries — it avoids compilation (cargo) and
# package-manager egress (npm) that bite on locked-down hosts.
# Aqua handles asset naming, checksum verification, and execute
# bits correctly out of the box; the `ubi:` backend assumes a `v`
# tag prefix that some projects (e.g. selene) don't use. Use the
# raw `github:` backend only when upstream assets are predictable and the
# committed lock covers every configured platform.
#
# `rvben/rumdl` uses `ubi:` instead of `aqua:` because aqua's
# baked-in registry entry enables SLSA attestation verification,
# and its workflow-path regex (`rvben/rumdl/\.github/workflows/
# release\.yml`) doesn't match the relative path
# (`.github/workflows/release.yml`) in rumdl's published
# provenance. Aqua rejects the install. The real fix is a
# regex update in aquaproj/aqua-registry; until that ships, route rumdl
# through `ubi:`. Integrity is still enforced by the committed lock hashes.

[tools]
# GitHub release binaries via aqua.
"aqua:astral-sh/ruff" = "latest"
"aqua:bazelbuild/buildtools/buildifier" = "latest"
"aqua:biomejs/biome" = "latest"
"aqua:crate-ci/typos" = "latest"
"aqua:golangci/golangci-lint" = "latest"
"aqua:google/yamlfmt" = "latest"
"aqua:hadolint/hadolint" = "latest"
"aqua:JohnnyMorganz/StyLua" = "latest"
"aqua:Kampfkarren/selene" = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:LuaLS/lua-language-server" = "latest"
"aqua:artempyanykh/marksman" = "latest"
"aqua:mrtazz/checkmake" = "latest"
"aqua:mvdan/gofumpt" = "latest"
"aqua:mvdan/sh" = "latest"
"aqua:rhysd/actionlint" = "latest"
"aqua:rust-lang/rust-analyzer" = "latest"
"aqua:tamasfe/taplo" = "latest"
"aqua:zizmorcore/zizmor" = "latest"

# NeoCMakeLSP publishes portable Linux archives but has no Aqua registry entry.
# Let mise lock those releases directly instead of falling back from a missing
# Shdeps asset to a source checkout. Homebrew remains the native macOS owner;
# Android is excluded because upstream publishes no Bionic binary.
"github:neocmakelsp/neocmakelsp" = { version = "latest", os = ["linux"] }

# SuperHTML likewise has no Aqua registry entry. Lock its portable Linux archive
# directly while retaining Homebrew as the macOS owner.
"github:kristoff-it/superhtml" = { version = "latest", os = ["linux"] }

# Pin `tmux` via mise so every machine gets the same reliable build regardless
# of what the distro ships. 3.6b includes the bracketed-paste fix introduced in
# 3.6a, while 3.7b is implicated in server CPU busy loops after attached SSH
# clients disconnect.
"aqua:tmux/tmux-builds" = "3.6b"

# See the note above for why rumdl uses `ubi:` instead of `aqua:`.
"ubi:reteps/dockerfmt" = "latest"
"ubi:rvben/rumdl" = "latest"
