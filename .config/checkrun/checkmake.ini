# Global checkmake fallback. Applied via `--config` when no per-repo
# `checkmake.ini` is found in the file's parent chain.
#
# Keep structural Makefile checks enabled, but avoid requiring every
# Makefile to expose the same target names. Tiny utility Makefiles,
# generated build includes, and project-specific task files often do
# not have meaningful `all`, `clean`, or `test` targets.

[minphony]
disabled = true
